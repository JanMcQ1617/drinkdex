<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
      }
      /*
        Sipply app icon.

        The wax seal from the brand sheet, on the sheet's own cream. The
        seal is struck in wine over gilt, so it needs a light ground to
        read at all — laid on the wine the rest of the app is built from,
        it goes to a dark smudge with a gold scratch in it. Cream is not a
        softening of the brand here, it is the only ground the mark works
        on, and it is the ground the sheet itself draws it on.

        #F8EBDE is that sheet's ground, sampled rather than chosen, which
        also means the seal's anti-aliased rim was rendered against this
        exact value and composites onto it with no fringe. It lands within
        three points of `giltWash` in theme.ts; it is deliberately not
        that token, because this is a property of the artwork rather than
        a colour the UI is allowed to reach for.

        No corner radius: iOS applies its own mask and a pre-rounded icon
        shows the seam. Square and fully opaque, which is also what App
        Store Connect requires.

        The mark is 70% of the canvas. The wax blob is irregular, so the
        percentage is measured off its bounding box — the widest lobes sit
        a little proud of a true circle at that size, which is what keeps
        it looking stamped rather than printed.
      */
      .icon {
        width: 1024px;
        height: 1024px;
        background: #f8ebde;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark {
        width: 717px; /* 0.70 × 1024 */
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon"><img class="mark" src="mark-seal.png" /></div>
  </body>
</html>

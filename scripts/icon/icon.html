<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Clink app icon.

      Rebuilt from the v2 mark. What changed and why:
        • Feet are real ellipses. The old icon drew them as curved strokes
          with round caps, which rendered as bulbous "tadpole" blobs.
        • Bowls keep an OUTLINE with a filled liquid inside. A fully solid
          silhouette was tried and rejected: two dark half-discs meeting in
          the middle merge into one wing shape and stop reading as glasses.
          Outline is what conveys transparency.
        • Uniform 24px stroke throughout — the old mark mixed weights.
        • The spark is a concave 4-point sparkle, not a straight-edged star.
        • Cream ground with wine glassware, matching the new light palette.
        • Fully opaque and square — iOS applies its own corner mask.

      Optically centered: the mark spans y 309–715 before the 1.12 scale.
    -->
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FDF8EE" />
          <stop offset="0.55" stop-color="#F7EEDF" />
          <stop offset="1" stop-color="#EFDEC2" />
        </linearGradient>

        <!-- Warmth pooling behind the clink, so the ground isn't flat. -->
        <radialGradient id="glow" cx="0.5" cy="0.4" r="0.44">
          <stop offset="0" stop-color="#FFAD5F" stop-opacity="0.26" />
          <stop offset="1" stop-color="#FFAD5F" stop-opacity="0" />
        </radialGradient>

        <!--
          userSpaceOnUse, not the default objectBoundingBox: a vertical
          stem has a zero-width bbox, and an objectBoundingBox gradient on
          a zero-width box resolves to nothing at all — the stems silently
          disappeared. Explicit coordinates avoid the whole class of bug.
        -->
        <linearGradient
          id="glassStroke"
          gradientUnits="userSpaceOnUse"
          x1="-145"
          y1="-370"
          x2="60"
          y2="0">
          <stop offset="0" stop-color="#6E3A4C" />
          <stop offset="1" stop-color="#2B1820" />
        </linearGradient>

        <linearGradient id="pour" gradientUnits="userSpaceOnUse" x1="-100" y1="-352" x2="40" y2="-205">
          <stop offset="0" stop-color="#8E4A62" />
          <stop offset="1" stop-color="#5A2E3E" />
        </linearGradient>

        <linearGradient id="spark" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#FFC96B" />
          <stop offset="0.5" stop-color="#E8B23A" />
          <stop offset="1" stop-color="#C08F1E" />
        </linearGradient>

        <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#5A3A28" flood-opacity="0.16" />
        </filter>

        <filter id="sparkGlow" x="-90%" y="-90%" width="280%" height="280%">
          <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FFAD5F" flood-opacity="0.6" />
        </filter>

        <!--
          One coupe, origin at the foot center, rim at y=-370.
          Liquid is drawn first so the outline strokes over its edge.
        -->
        <g id="coupe">
          <!--
            Filled nearly to the rim on purpose. A half-filled bowl needs a
            level surface line, but the glass is rotated 19° — so a tilted
            fill line reads as a diagonal stripe rather than liquid. A near-
            full pour keeps the surface tight to the rim and sidesteps it.
          -->
          <path
            d="M -136 -352 C -134 -250, -76 -207, 0 -205 C 76 -207, 134 -250, 136 -352 Z"
            fill="url(#pour)" />
          <path
            d="M -145 -370 C -145 -245, -80 -197, 0 -195 C 80 -197, 145 -245, 145 -370 Z"
            fill="none"
            stroke="url(#glassStroke)"
            stroke-width="24"
            stroke-linejoin="round" />
          <rect x="-12" y="-200" width="24" height="166" fill="url(#glassStroke)" />
          <ellipse cx="0" cy="-24" rx="92" ry="19" fill="url(#glassStroke)" />
        </g>
      </defs>

      <rect width="1024" height="1024" fill="url(#ground)" />
      <rect width="1024" height="1024" fill="url(#glow)" />

      <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
        <g filter="url(#lift)">
          <use href="#coupe" transform="translate(248 706) rotate(19)" />
          <use href="#coupe" transform="translate(776 706) rotate(-19)" />
        </g>

        <!-- Spark sits where the two rims meet. -->
        <g transform="translate(512 400)" filter="url(#sparkGlow)">
          <path
            d="M 0 -78 C 6.6 -28.5, 28.5 -6.6, 78 0 C 28.5 6.6, 6.6 28.5, 0 78 C -6.6 28.5, -28.5 6.6, -78 0 C -28.5 -6.6, -6.6 -28.5, 0 -78 Z"
            fill="url(#spark)" />
          <circle cx="0" cy="0" r="12" fill="#FFF6E2" />
        </g>

        <!-- Two smaller sparks — asymmetric, so the mark reads as motion. -->
        <g fill="url(#spark)" opacity="0.92">
          <path
            d="M 0 -28 C 2.4 -10.2, 10.2 -2.4, 28 0 C 10.2 2.4, 2.4 10.2, 0 28 C -2.4 10.2, -10.2 2.4, -28 0 C -10.2 -2.4, -2.4 -10.2, 0 -28 Z"
            transform="translate(660 286)" />
          <path
            d="M 0 -18 C 1.5 -6.6, 6.6 -1.5, 18 0 C 6.6 1.5, 1.5 6.6, 0 18 C -1.5 6.6, -6.6 1.5, -18 0 C -6.6 -1.5, -1.5 -6.6, 0 -18 Z"
            transform="translate(372 262)" />
        </g>
      </g>
    </svg>
  </body>
</html>

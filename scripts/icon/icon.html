<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'PlayfairDisplayLatin';
        font-weight: 700;
        src: url('../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf') format('truetype');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
      }
      /*
        Sipply app icon.

        Straight from the brand sheet: a 160deg merlot-to-wine gradient with
        the monogram "S." set in Playfair Display 700 — bone letter, taupe
        period. The sheet draws it at 128px with a 30px radius; the radius is
        NOT baked in here because iOS applies its own corner mask and a
        pre-rounded icon shows the seam. Square and fully opaque, which is
        also what App Store Connect requires.

        The period is the whole mark. Without it the icon is a letter; with
        it the letter is a word ending, which is what makes "S." read as an
        abbreviation of a name rather than as a monogram of an initial.
      */
      .icon {
        width: 1024px;
        height: 1024px;
        background: linear-gradient(160deg, #7e2330 0%, #5b0f1a 70%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark {
        font-family: 'PlayfairDisplayLatin', Georgia, serif;
        font-weight: 700;
        font-size: 512px;
        line-height: 1;
        color: #e9e5df;
        /*
          Optical centring, measured off the render rather than guessed.
          Flex centres the text BOX, and the period's advance width is
          mostly empty space, so the ink lands ~21px left of centre; the
          block is pushed back right by that much and up off the baseline.
        */
        transform: translate(3px, -26px);
      }
      .dot {
        color: #cbbba5;
      }
    </style>
  </head>
  <body>
    <div class="icon"><div class="mark">S<span class="dot">.</span></div></div>
  </body>
</html>

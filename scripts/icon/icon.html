<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
      }
      /*
        Sipply app icon.

        The coupe seal from the brand sheet, on the sheet's own cream. The
        sheet draws two seals; this is the one with fewer strokes in it,
        which is what an icon needs — the glass-and-bottle keeps its detail
        down to about 60px and turns to a smudge below that, and the sizes
        an icon is actually read at start at 29. `PRIMARY` in
        build-icons.mjs selects between them and is checked against this
        file, so the two cannot drift apart.

        The
        seal is struck in wine over gilt, so it needs a light ground to
        read at all — laid on the wine the rest of the app is built from,
        it goes to a dark smudge with a gold scratch in it. Cream is not a
        softening of the brand here, it is the only ground the mark works
        on, and it is the ground the sheet itself draws it on.

        #F8EBDE is that sheet's ground, sampled rather than chosen, which
        also means the seal's anti-aliased rim was rendered against this
        exact value and composites onto it with no fringe. It lands within
        three points of `giltWash` in theme.ts; it is deliberately not
        that token, because this is a property of the artwork rather than
        a colour the UI is allowed to reach for.

        No corner radius: iOS applies its own mask and a pre-rounded icon
        shows the seam. Square and fully opaque, which is also what App
        Store Connect requires.

        The mark is 70% of the canvas, measured on its longer edge. The wax
        blob is irregular, so the percentage is taken off its bounding box —
        the widest lobes sit a little proud of a true circle at that size,
        which is what keeps it looking stamped rather than printed.
      */
      .icon {
        width: 1024px;
        height: 1024px;
        background: #f8ebde;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark {
        /*
          A square box with contain, not a width. The two seals are not the
          same shape — the coupe is 410x435 and the glass-and-bottle is
          507x508 — so setting width alone makes the portrait one render
          taller than the square one and sit heavier in the tile at the
          same nominal scale. Fitting the longer edge makes 0.70 mean one
          thing whichever seal PRIMARY selects.
        */
        width: 717px; /* 0.70 × 1024 */
        height: 717px;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="icon"><img class="mark" src="mark-seal-coupe.png" /></div>
  </body>
</html>

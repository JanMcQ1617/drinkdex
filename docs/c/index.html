<!--
  NO JEKYLL FRONT MATTER, deliberately, as docs/index.html: this is a
  complete document and Pages must copy it verbatim, not wrap it in the
  theme (the rest of docs/ still wears the old cream; this page is Daylight,
  specs/v4-mockups/white/spec.md §1).

  The web page for a shared collection (specs/v4.2/spec.md §4.8, frame
  `web`). A link reads janmcq1617.github.io/drinkdex/c/#<shareId>:

  - The share id is in the FRAGMENT, which a browser never sends to a
    server or puts in a referrer. GitHub Pages serves the same file to
    every link and never learns which collection anyone opened.
  - The page asks Supabase for that one collection through
    get_shared_collection (migration 023), with the publishable key the
    app ships (.env). That function is the only door for anyone but the
    owner: it answers one collection for one live share id, and nothing
    for anything else, so nothing can be listed. The key is public by
    design; never put a secret or service_role key here
    (scripts/build-share-index.mjs refuses the page if anyone does).
  - The answer is catalogue ids. Names, numbers and styles come from
    drinks.json beside this file, generated by
    scripts/build-share-index.mjs from src/data/drinks.json. Run it (or its
    --check) after a catalogue change. Never a photo, a caption or a
    post's author: a post shows as the drink it is of, "From a post".
  - Every string from the server is set as text (textContent), never as
    HTML, because a collection's name and its owner's username are typed
    by people.
  - No analytics, no cookies, no third-party script, not indexed. The
    Content-Security-Policy below makes the browser hold the page to that:
    scripts only from this file, connections only to this site and the
    project's Supabase. If the project URL ever changes, change it in both
    places (the build script checks the constant, and the policy with it).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://yklknprzyoebzgazcmhj.supabase.co; base-uri 'none'; form-action 'none'">
<title>A collection on Sipply</title>
<meta name="description" content="A collection of drinks shared from Sipply.">
<link rel="icon" href="../img/icon.png">
<!-- What a messenger's preview shows. It fetches the page without the fragment, so it can only ever say this. -->
<meta property="og:title" content="A collection on Sipply">
<meta property="og:description" content="Open it in Sipply, or see its drinks here.">
<meta property="og:image" content="https://janmcq1617.github.io/drinkdex/img/icon.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<noscript><style>#view{display:none}</style></noscript>

<style>
  /*
   * Daylight (src/constants/theme.ts): the app's own values, only the ones
   * this page draws with. No hue. Type is the app's three sizes, title
   * 28/34, body 17/24 and small 13/18, with Playfair for the wordmark and
   * drink names and nothing else.
   */
  :root{
    --page:#FFFFFF; --wash:#F5F5F5; --press:#EBEBEB; --line:#E3E3E3;
    --muted:#5C5C5C; --ink:#0A0A0A; --inkPressed:#333333; --onInk:#FFFFFF;
    --display:"Playfair Display",Georgia,serif;
    --body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%; background:var(--page)}
  /*
   * A column, so the foot sits at the bottom of a short page and sticks to
   * the bottom of a long one. Nothing here sets overflow on html or body:
   * that would quietly turn the sticky foot off.
   */
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    background:var(--page); color:var(--ink);
    font:400 17px/24px var(--body); letter-spacing:-.2px;
    -webkit-font-smoothing:antialiased;
  }
  main{
    flex:1; width:100%; max-width:536px; margin:0 auto;
    padding:calc(24px + env(safe-area-inset-top)) 24px 32px;
  }

  .mark{font:700 28px/34px var(--display); letter-spacing:-.2px; margin:0}
  .title{font:600 28px/34px var(--body); letter-spacing:-.4px; margin:26px 0 0; overflow-wrap:anywhere}
  .lead{color:var(--muted); margin:26px 0 0}
  .meta{font:400 13px/18px var(--body); letter-spacing:0; color:var(--muted); margin:6px 0 0; overflow-wrap:anywhere}
  .meta b{font-weight:600; color:var(--ink)}

  /* One row per item, 64 tall: the number plate's 76 pt column, then the name over its style. */
  .rows{list-style:none; margin:26px 0 0; padding:0}
  .row{display:grid; grid-template-columns:76px minmax(0,1fr); align-items:center; min-height:64px; padding:8px 0}
  .no{font:500 13px/18px var(--body); letter-spacing:1px; font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap}
  .name{font:700 17px/24px var(--display); letter-spacing:-.2px; margin:0; overflow-wrap:anywhere}
  .name.added{font:500 17px/24px var(--body)}
  .sub{font:400 13px/18px var(--body); letter-spacing:0; color:var(--muted); margin:0}

  /* Keys: squared (4 pt), 52 tall. One ink key per view. */
  .key{
    display:flex; align-items:center; justify-content:center; width:100%;
    min-height:52px; padding:4px 12px; border:0; border-radius:4px;
    font:500 17px/24px var(--body); letter-spacing:-.2px; text-align:center;
    text-decoration:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .key.ink{background:var(--ink); color:var(--onInk)}
  .key.ink:active{background:var(--inkPressed)}
  .key.wash{background:var(--wash); color:var(--ink)}
  .key.wash:active{background:var(--press)}
  @media (hover:hover){
    .key.ink:hover{background:var(--inkPressed)}
    .key.wash:hover{background:var(--press)}
  }
  .key:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  /* "Sipply isn't on this phone yet" is a sentence, not a verb: two lines of it still fit the key. */
  .key.note{font-size:15px; line-height:20px}
  .retry{margin-top:24px}

  /* The foot: a page slab over the list, a 1 pt rule on top, the keys side by side. */
  footer{
    position:sticky; bottom:0; background:var(--page);
    box-shadow:inset 0 1px 0 var(--line);
    padding:14px 24px calc(12px + env(safe-area-inset-bottom));
  }
  .foot{max-width:488px; margin:0 auto}
  /* Columns follow the keys shown, so Get Sipply alone takes the whole row. */
  .keys{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:12px}
  .age{font:400 13px/18px var(--body); letter-spacing:0; color:var(--muted); text-align:center; margin:10px 0 0}

  /* A line focused after Retry (see focusView) is read, not outlined. */
  [tabindex="-1"]:focus{outline:none}

  .sr{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
</style>
</head>
<body>

<main>
  <p class="mark">Sipply</p>
  <div id="view">
    <p class="lead" role="status">Opening the collection…</p>
  </div>
  <noscript><p class="lead">This page needs JavaScript to show the collection.</p></noscript>
</main>

<footer id="foot" hidden>
  <div class="foot">
    <div class="keys">
      <!--
        Get Sipply: the App Store page once Sipply is listed, the public
        TestFlight link until then (the external group's link; build 26
        approved for it on 17 Oct 2026). It is the ink key because, until
        universal links (spec §8, decided 3), it is the one a friend
        without the app needs.
      -->
      <a class="key ink" id="get" href="https://testflight.apple.com/join/1T5KAfkz" rel="noopener">Get Sipply</a>
      <a class="key wash" id="open" href="drinkdex://collection/" hidden>Open in Sipply</a>
    </div>
    <p class="age">Sipply is for people of legal drinking age.</p>
  </div>
</footer>

<p class="sr" id="say" role="status"></p>

<script>
(() => {
  'use strict';

  /* The app's project and publishable key (.env). Public by design: Row Level Security and the function's own checks are what protect the data. */
  const SUPABASE_URL = 'https://yklknprzyoebzgazcmhj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_nt7pkmBI-UA2u7S-ewFcYg_jprf697w';

  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  const TIMEOUT_MS = 12000;
  /* How long a tap on Open in Sipply waits for the app to take over before saying it isn't here. */
  const OPEN_WAIT_MS = 1500;
  const OPEN_LABEL = 'Open in Sipply';
  const NOT_HERE = "Sipply isn't on this phone yet";

  const view = document.getElementById('view');
  const foot = document.getElementById('foot');
  const openKey = document.getElementById('open');
  const say = document.getElementById('say');

  const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  /* Grouped thousands, by hand, as the app's formatCount does. */
  const count = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /*
   * The share id, from the fragment. Messengers sometimes stick a full stop
   * or a space on the end of a pasted link, so the first 36 characters are
   * read and the rest ignored. Anything that is not a uuid never leaves the
   * page: it is answered as a link that does not work.
   */
  function shareId() {
    let raw = location.hash.slice(1);
    try { raw = decodeURIComponent(raw); } catch (e) { /* keep it raw */ }
    const id = raw.trim().slice(0, 36).toLowerCase();
    return UUID.test(id) ? id : null;
  }

  /* ---------------------------------------------------------------- */
  /* Fetching                                                          */
  /* ---------------------------------------------------------------- */

  /*
   * The name index, fetched once per visit. A failed fetch is forgotten, so
   * Retry asks again instead of failing from memory, and so is one still
   * hanging when a load gives up (forgetIndex): on a bar's wifi the 100 KB
   * file can stall after the RPC has answered, and Retry must start a new
   * fetch rather than wait on the stalled one again.
   */
  let indexPromise = null;
  let indexCtl = null;
  let indexReady = false;
  function loadIndex() {
    if (!indexPromise) {
      const ctl = new AbortController();
      const p = fetch('drinks.json', { credentials: 'omit', signal: ctl.signal })
        .then((res) => {
          if (!res.ok) throw new Error('index ' + res.status);
          return res.json();
        })
        .then((json) => {
          indexReady = true;
          return json;
        });
      p.catch(() => {
        if (indexPromise === p) indexPromise = null;
      });
      indexPromise = p;
      indexCtl = ctl;
    }
    return indexPromise;
  }
  function forgetIndex() {
    if (indexReady || !indexPromise) return;
    indexPromise = null;
    indexCtl.abort();
  }

  /*
   * get_shared_collection(p_share uuid) returns jsonb: the collection, or
   * null when the id is unknown, switched off or its owner is gone. A new
   * publishable key (sb_publishable_…) goes in the apikey header only,
   * never as a Bearer token; without a user token PostgREST runs it as
   * anon, which is who this page is. PGRST202 is PostgREST saying the
   * function does not exist: migration 023 is not applied yet.
   */
  async function fetchShared(id, signal) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_shared_collection', {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ p_share: id }),
      credentials: 'omit',
      cache: 'no-store',
      signal,
    });
    if (res.ok) {
      const body = await res.json();
      return body && typeof body === 'object' && !Array.isArray(body) ? { state: 'shared', data: body } : { state: 'none' };
    }
    let code = null;
    try { code = (await res.json()).code; } catch (e) { /* not PostgREST's JSON */ }
    if (code === 'PGRST202') return { state: 'closed' };
    if (code === '22P02') return { state: 'none' };
    throw new Error('rpc ' + res.status);
  }

  /* ---------------------------------------------------------------- */
  /* Drawing                                                           */
  /* ---------------------------------------------------------------- */

  /*
   * Where focus goes after a Retry. The Retry key is replaced by what the
   * load draws, and a removed key drops VoiceOver's focus to the top of the
   * page with nothing said. So a load that Retry started moves focus to the
   * view's first line each time it draws, the loading line and then the
   * answer's heading, and VoiceOver reads each. A first load leaves focus
   * alone: the page is read from the top anyway.
   */
  let focusView = false;

  /* keys: 'none' (no foot), 'get' (Get Sipply alone), 'both'. */
  function draw(nodes, keys, title) {
    view.replaceChildren(...nodes);
    foot.hidden = keys === 'none';
    openKey.hidden = keys !== 'both';
    document.title = title || 'A collection on Sipply';
    if (focusView && view.firstChild) {
      view.firstChild.setAttribute('tabindex', '-1');
      view.firstChild.focus();
    }
  }

  function drawLoading() {
    draw([el('p', 'lead', 'Opening the collection…')], 'none');
    view.firstChild.setAttribute('role', 'status');
  }

  function drawMessage(text, keys) {
    draw([el('h1', 'title', text)], keys, 'Sipply');
  }

  function drawError() {
    const retry = el('button', 'key ink retry', 'Retry');
    retry.type = 'button';
    retry.addEventListener('click', () => load(true));
    draw([el('h1', 'title', "Couldn't reach Sipply. Try again."), retry], 'none', 'Sipply');
  }

  function plural(n, one, many) {
    return count(n) + ' ' + (n === 1 ? one : many);
  }

  function drawShared(data, index) {
    const name = typeof data.name === 'string' && data.name ? data.name : 'A collection';
    const owner = typeof data.owner === 'string' && data.owner ? data.owner : null;
    const items = Array.isArray(data.items) ? data.items.filter((i) => i && typeof i === 'object') : [];
    const drinks = Number.isInteger(data.drinks) ? data.drinks : items.filter((i) => i.kind === 'drink').length;
    const posts = Number.isInteger(data.posts) ? data.posts : items.filter((i) => i.kind === 'post').length;

    const nodes = [el('h1', 'title', name)];

    const meta = el('p', 'meta');
    if (owner) meta.append('A collection by ', el('b', null, owner));
    else meta.append('A collection on Sipply');
    const parts = [];
    if (drinks) parts.push(plural(drinks, 'drink', 'drinks'));
    if (posts) parts.push(plural(posts, 'post', 'posts'));
    if (!parts.length) parts.push('Nothing in it yet');
    meta.append(' · ' + parts.join(' · '));
    nodes.push(meta);

    /* As many digits as the highest Dex number has, as the app pads them. */
    let top = 0;
    for (const k in index) if (hasOwn(index, k) && index[k][0] > top) top = index[k][0];
    const digits = String(top).length;

    if (items.length) {
      const list = el('ul', 'rows');
      /* The function sends them newest first; they are drawn as sent. */
      for (const item of items) {
        const id = typeof item.drink_id === 'string' ? item.drink_id : '';
        const entry = id && hasOwn(index, id) ? index[id] : null;
        const row = el('li', 'row');

        const no = el('span', 'no', entry ? 'Nº ' + String(entry[0]).padStart(digits, '0') : '');
        no.setAttribute('aria-hidden', 'true');
        row.append(no);

        const words = el('div');
        if (entry) words.append(el('span', 'sr', 'Number ' + entry[0] + ', '));
        /* A drink the index does not know is one someone added to their own Dex. */
        words.append(entry ? el('p', 'name', entry[1]) : el('p', 'name added', 'A drink added on Sipply'));
        const sub = item.kind === 'post' ? 'From a post' : entry ? entry[2] : '';
        if (sub) words.append(el('p', 'sub', sub));
        row.append(words);

        list.append(row);
      }
      nodes.push(list);
    }

    draw(nodes, 'both', name + ' on Sipply');
  }

  /* ---------------------------------------------------------------- */
  /* Loading                                                           */
  /* ---------------------------------------------------------------- */

  /* Each load gets a number, so a slow answer to an earlier fragment (or an earlier Retry) never draws over a newer one. */
  let generation = 0;

  /* fromRetry is true only from the Retry key; hashchange passes an Event, which is not. */
  async function load(fromRetry) {
    const mine = ++generation;
    focusView = fromRetry === true;
    resetOpen();
    const id = shareId();
    if (!id) {
      drawMessage("This collection isn't shared any more.", 'get');
      return;
    }
    openKey.href = 'drinkdex://collection/' + id;
    drawLoading();

    /*
     * One clock for the whole load, the RPC and the name index together:
     * either can stall, and a page left on "Opening the collection…" with
     * no Retry is the one state nobody can get out of.
     */
    const ctl = new AbortController();
    let timer = 0;
    const late = new Promise((_, reject) => {
      timer = setTimeout(() => {
        ctl.abort();
        /* Only the current load may drop the shared index fetch: a newer load could be waiting on it. */
        if (mine === generation) forgetIndex();
        reject(new Error('timeout'));
      }, TIMEOUT_MS);
    });
    try {
      const [answer, index] = await Promise.race([Promise.all([fetchShared(id, ctl.signal), loadIndex()]), late]);
      if (mine !== generation) return;
      if (answer.state === 'shared') drawShared(answer.data, index);
      else if (answer.state === 'closed') drawMessage("Shared collections aren't open yet.", 'get');
      else drawMessage("This collection isn't shared any more.", 'get');
    } catch (e) {
      if (mine === generation) drawError();
    } finally {
      clearTimeout(timer);
    }
  }

  /* ---------------------------------------------------------------- */
  /* Open in Sipply                                                    */
  /* ---------------------------------------------------------------- */

  /*
   * A page cannot ask whether an app is installed. It can only try the
   * app's link and see whether it is still on screen afterwards: when the
   * app takes over, Safari goes to the background and the page is hidden.
   * Still visible 1.5 s after the tap means nothing took it, so the key
   * says so, beside Get Sipply. (On a phone without the app Safari also
   * shows its own "address is invalid" alert, which no page can stop.)
   * If the page is hidden at any point after that, the app did open, after
   * a slow "Open in Sipply?" prompt say, and the key goes back to its verb.
   */
  let openTimer = 0;
  let leftPage = false;

  /* Also empties the live line, so a second tap that finds no app is announced again rather than matching what it already says. */
  function resetOpen() {
    clearTimeout(openTimer);
    openKey.textContent = OPEN_LABEL;
    openKey.classList.remove('note');
    say.textContent = '';
  }

  function onHidden() {
    if (document.visibilityState !== 'hidden') return;
    leftPage = true;
    resetOpen();
  }
  document.addEventListener('visibilitychange', onHidden);
  window.addEventListener('pagehide', () => { leftPage = true; resetOpen(); });

  openKey.addEventListener('click', (event) => {
    event.preventDefault();
    resetOpen();
    leftPage = false;
    location.href = openKey.href;
    openTimer = setTimeout(() => {
      if (leftPage || document.visibilityState !== 'visible') return;
      openKey.textContent = NOT_HERE;
      openKey.classList.add('note');
      say.textContent = NOT_HERE + '.';
    }, OPEN_WAIT_MS);
  });

  /* A second link pasted into the same tab changes only the fragment. */
  window.addEventListener('hashchange', load);
  load();
})();
</script>
</body>
</html>

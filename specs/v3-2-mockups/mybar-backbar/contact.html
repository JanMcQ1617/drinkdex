<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Back bar contact sheet</title>
<style>
@font-face{font-family:Inter;src:url(fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/InterLatin_600SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#151112;width:1900px;height:1000px;overflow:hidden}
.row{display:flex;gap:28px;padding:18px 28px 0;justify-content:center}
figure{width:420px}
figcaption{height:40px;font:400 14px/18px Inter;color:#B8A09B}
figcaption b{font-weight:600;color:#E9E5DF;margin-right:6px}
img{width:420px;height:912px;display:block;border-radius:6px}
</style></head><body>
<div class="row">
  <figure><figcaption><b>1 Empty</b>The lights are off. The 14 basics stand stamped into the lining; tap the ones you have.</figcaption><img src="empty.png" alt=""></figure>
  <figure><figcaption><b>2 Stocked</b>Campari just went up. Labels on what you own; unlit at each shelf's end, what to buy next.</figcaption><img src="stocked.png" alt=""></figure>
  <figure><figcaption><b>3 Tonight</b>Scrolled to the counter: what you can pour, lit, and what is one thing short, by the thing.</figcaption><img src="tonight.png" alt=""></figure>
  <figure><figcaption><b>4 Add a bottle</b>The search glyph's sheet: rows ranked by what each would pour with your shelf.</figcaption><img src="add.png" alt=""></figure>
</div>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>My Bar Tonight</title>
<style>
@font-face{font-family:Inter;src:url(fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#161112;color:#E9E5DF;font-family:Inter}
.head{display:flex;align-items:baseline;gap:16px;padding:22px 40px 0}
.head h1{font:700 30px/36px Playfair}
.head p{font:400 15px/20px Inter;color:#B8A09B}
.row{display:flex;gap:36px;padding:18px 40px 0;justify-content:center}
figure{width:388px}
figure img{width:388px;height:843px;display:block;border-radius:28px;box-shadow:0 0 0 1px rgba(233,229,223,.12)}
figcaption{font:600 14px/18px Inter;text-align:center;margin-top:10px}
figcaption span{display:block;font-weight:400;color:#B8A09B;margin-top:2px}
</style></head><body>
<div class="head"><h1>Tonight</h1><p>My Bar, task-first: it opens on what you can pour, and stocking it is a photo picker. iPhone 17 Pro Max, 440 x 956 pt. Every count is computed from barIndex.json.</p></div>
<div class="row">
  <figure><img src="empty.png" alt=""><figcaption>1 · First open<span>The question, one-tap basics (47 drinks), bottles as tiles</span></figcaption></figure>
  <figure><img src="picker.png" alt=""><figcaption>2 · Stocking the shelf<span>Each bottle says what it adds; the count is live</span></figcaption></figure>
  <figure><img src="tonight.png" alt=""><figcaption>3 · Tonight, stocked<span>72 drinks as lit cards; one thing away, one tap each</span></figcaption></figure>
  <figure><img src="away.png" alt=""><figcaption>4 · One tap later<span>Grapefruit added: 8 more, shown where you tapped</span></figcaption></figure>
</div>
</body></html>

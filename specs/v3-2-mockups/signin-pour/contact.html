<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Pour Contact</title>
<style>
@font-face{font-family:Inter;src:url(fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#161112;color:#E9E5DF;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:baseline;gap:16px;padding:16px 44px 0}
.top h1{font:700 26px/32px Playfair}
.top p{font:400 14px/20px Inter;color:#B8A09B}
.row{display:flex;gap:36px;padding:14px 44px 0;justify-content:center}
figure{width:400px}
figure img{display:block;width:400px;height:869px;border-radius:14px;box-shadow:0 0 0 1px rgba(233,229,223,.12)}
figcaption{margin-top:8px;font:400 13px/18px Inter;color:#B8A09B}
figcaption b{color:#E9E5DF;font-weight:600}
</style>

<body>
<div class="top"><h1>First pour</h1><p>Sign-in direction for Sipply · v3 Cabinet · iPhone 17 Pro Max, 440 × 956</p></div>
<div class="row">
  <figure><img src="welcome.png" alt=""><figcaption><b>1 · First screen, at rest.</b> An empty coupe on the cellar counter; every way in is already on screen.</figcaption></figure>
  <figure><img src="pour.png" alt=""><figcaption><b>2 · Held: pouring.</b> The level rises only while the finger is down and stays wherever it is let go.</figcaption></figure>
  <figure><img src="poured.png" alt=""><figcaption><b>3 · At the brim.</b> The drawing cuts to the real photograph and name; the card offers to start you there.</figcaption></figure>
  <figure><img src="back.png" alt=""><figcaption><b>4 · Welcome back.</b> Remembered on this phone: last pour, latest catches, one tap with the method used last time.</figcaption></figure>
</div>

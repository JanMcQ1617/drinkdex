<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sipply v4.10 type</title>
<style>
/* ==================================================================== */
/* v4.10 type: three three-font systems on the same three screens       */
/*                                                                      */
/* Jan, 28 Oct 2026, pointing at the logo: "I want you to make it so    */
/* all the text in the app is in this same font, and mix it with        */
/* subheading and one other font." Each direction is a display face in  */
/* the wordmark's hand, a subheading face and a body face, set from the */
/* real files in ../fonts/ (google/fonts, ofl/ and apache/). The roles  */
/* are ONE table (DIRS, below) that writes both the CSS the screens use */
/* and the spec cards under them, so a card can never describe a size   */
/* the screen does not draw.                                            */
/*                                                                      */
/* The screens are build 34's (the v4.9 board's geometry: Home at rest, */
/* the drink page scrolled to its spec, the Dex at For you) with the    */
/* pen marks that frame type kept (the stories rule, the title swash,   */
/* the head rules, the spec's double rule, the leaders). Every line of  */
/* text is placed by its BASELINE (placeBaselines), so a face with      */
/* other metrics sits where Inter's line sat instead of drifting.       */
/*                                                                      */
/* ?d=<dir>&s=<screen> draws one phone alone (the shots); ?d=<dir> one  */
/* direction's sheet; no query, the whole wall.                         */
/* ==================================================================== */
@font-face{font-family:SedgwickAve;src:url(../fonts/SedgwickAve-Regular.ttf)}
@font-face{font-family:Anton;src:url(../fonts/Anton-Regular.ttf)}
@font-face{font-family:Archivo;src:url(../fonts/Archivo%5Bwdth,wght%5D.ttf);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Kaushan;src:url(../fonts/KaushanScript-Regular.ttf)}
@font-face{font-family:InstrumentSerif;src:url(../fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:InstrumentSans;src:url(../fonts/InstrumentSans%5Bwdth,wght%5D.ttf);font-weight:400 700;font-stretch:75% 100%}
@font-face{font-family:Caveat;src:url(../fonts/Caveat%5Bwght%5D.ttf);font-weight:400 700}
@font-face{font-family:GeistMono;src:url(../fonts/GeistMono%5Bwght%5D.ttf);font-weight:100 900}
@font-face{font-family:Hanken;src:url(../fonts/HankenGrotesk%5Bwght%5D.ttf);font-weight:100 900}
/* The wall's own captions only, never a screen: build 34's Inter. */
@font-face{font-family:Inter;src:url(../../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}

/* theme.ts, exactly: black, white, one red, and one neutral hue for every grey. */
:root{
  --page:#FFFFFF; --wash:#F5F5F5; --press:#EBEBEB; --line:#E3E3E3; --hair:#D6D6D6; --rule:#C4C4C4;
  --control:#8A8A8A; --muted:#5C5C5C; --ink:#0A0A0A; --onInk:#FFFFFF;
  --photoEdge:rgba(10,10,10,.07); --acc:#D0102C;
  --t1:#262626; --t2:#3D3D3D; --t3:#5C5C5C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ECECEC}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}
.a{position:absolute}
.nw{white-space:nowrap}
.muted{color:var(--muted)}
.mk{position:absolute;overflow:visible;pointer-events:none}
.phone{position:relative;width:440px;height:956px;background:var(--page);overflow:hidden;flex:none;isolation:isolate}
.chrome{position:absolute;left:0;right:0;background:var(--page);z-index:20}
.circle{border-radius:50%}
.sb{position:absolute;top:0;left:0;right:0;height:62px;z-index:30}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.homeInd{position:absolute;left:150px;top:942px;width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:40}
.print{position:absolute;overflow:hidden;background:var(--wash)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);pointer-events:none}
.av{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:600 12px Inter;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.field{position:absolute;left:24px;width:392px;height:44px;border-radius:4px;background:var(--wash)}
.chip{position:absolute;height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap;background:var(--page)}
.chip.sort{background:var(--wash);box-shadow:none;padding:0 10px 0 12px;gap:4px}
/* The drink page is a scrolling column: flow, not coordinates. */
.col{position:absolute;left:0;width:440px}
.col .pad{padding:0 24px}
.rowb{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lead{flex:1;align-self:baseline;height:3px;min-width:12px;background:radial-gradient(circle,var(--control) 0.9px,transparent 1.1px) right center/4px 3px repeat-x;transform:translateY(-1px)}
.plate{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:2px;background:var(--acc);color:#fff}
.key{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;white-space:nowrap;gap:8px;background:var(--acc);color:#fff}
/* The press's outlined figures (v4.9 A.2): the face's own outline, in colors.rule, a  */
/* ring of 1.25 round the glyph. Drawn as a 2.5 stroke UNDER a page-white fill        */
/* (paint-order) rather than a bare 1.25 stroke, because a variable font keeps its    */
/* overlapping contours (Geist Mono's N and 1 are two shapes each) and a bare stroke  */
/* draws every overlap as a line inside the figure. The fill covers the inner half,   */
/* so only the silhouette's ring shows, which is what the app's press would draw from */
/* an overlap-removed static cut (README, section 5).                                 */
[class*="r-fig"]{color:var(--page);-webkit-text-stroke:2.5px var(--rule);paint-order:stroke fill}

/* ---------- the wall ---------- */
.wall{padding:40px 44px 60px}
.wall h1{font:600 32px/38px Inter;letter-spacing:-.7px}
.wall .lede{font:400 15px/23px Inter;color:#333;margin-top:10px;max-width:1380px}
.wall h2{font:600 24px/30px Inter;letter-spacing:-.4px;margin:44px 0 4px}
.wall h2 small{font:400 15px/21px Inter;color:#555;margin-left:10px;letter-spacing:0}
.row{display:flex;gap:28px;margin-top:16px}
.frame .phone{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.spec{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:1376px}
.card{background:#fff;padding:18px 20px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card .face{font-size:30px;line-height:38px;white-space:nowrap;overflow:hidden}
.card .who{font:600 13px/18px Inter;margin-top:8px}
.card .who span{font-weight:400;color:#555}
.card table{border-collapse:collapse;margin-top:10px;width:100%}
.card td{font:400 12px/17px Inter;color:#333;padding:3px 8px 3px 0;border-top:1px solid #EEE;vertical-align:top}
.card td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.card td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.why{font:400 13px/19px Inter;color:#333;margin-top:14px;max-width:1376px}
.why b{color:var(--ink)}
body.solo{background:var(--page)}
body.solo .wall{padding:0}
</style>

<script>
const A = '../../../../assets/';
const IMG = (id) => `${A}drinks/${id}.webp`;

const MK = window.MARKS;

/* ==================================================================== */
/* The three directions. Each role is a whole text style for one job,   */
/* named as theme.ts names it where theme.ts has the job:               */
/*   f family · w weight · z size · l line · t tracking (px)            */
/*   up uppercase · tn tabular figures · wd width (font-stretch %)      */
/*   ff OpenType features (Geist Mono's ss09: the zero without a slash) */
/* Sizes are set by x-height, not by number: a marker's x-height is     */
/* 0.40 to 0.66 of its em against Inter's 0.546, so "the same size"     */
/* means a different number in each face (README, section 3).           */
/* ==================================================================== */
const DIRS = [

   * in the logo's hand. A's display sizes for the display jobs, and for
   * every other job today's Inter size, which is generous to the marker
   * (Sedgwick's x-height is 0.66 of its em against Inter's 0.546, so its
   * 13 is a bigger 13). One weight is all Sedgwick has, so a "strong" role
   * has nothing to be strong with, and it has no º, so the Nº plate falls
   * back to the system face mid-word, as it would on iOS. Shot alone as

/* Write the role CSS: .d-<dir> .r-<role>. */
(function writeRoles() {
  let css = '';
  for (const d of DIRS) {
    for (const [k, r] of Object.entries(d.roles)) {
      css += `.d-${d.id} .r-${k}{font-family:${r.f};font-weight:${r.w};font-size:${r.z}px;line-height:${r.l}px;letter-spacing:${r.t}px;${r.up ? 'text-transform:uppercase;' : ''}${r.tn ? 'font-variant-numeric:tabular-nums;' : ''}${r.wd ? `font-stretch:${r.wd}%;` : ''}${r.ff ? `font-feature-settings:${r.ff};` : ''}}\n`;
    }
  }
  document.getElementById('roles').textContent = css;
})();

/* ---------- marks: the v4.9 board's generated pen (marks.js) ---------- */
function M(spec, x, y, fill = 'var(--acc)') {
  const m = MK[spec];
  const { x: bx, y: by, w, h } = m.box;
  const f = m.tier === 'press' ? 'var(--control)' : fill;
  return `<svg class="mk" viewBox="${bx} ${by} ${w} ${h}" style="left:${x + bx}px;top:${y + by}px;width:${w}px;height:${h}px">${m.d.map((d) => `<path d="${d}" fill="${f}"/>`).join('')}</svg>`;
}
/** A mark in a flow column: a block its nominal height tall, the ink at its own offset. */
function Mb(spec, h) {
  return `<div style="position:relative;height:${h}px">${M(spec, 0, 0)}</div>`;
}
function WM(x, y, h) {
  const m = MK.wordmark;
  const { x: bx, y: by, w: bw, h: bh } = m.box;
  return `<svg class="mk" viewBox="${bx} ${by} ${bw} ${bh}" style="left:${x}px;top:${y}px;width:${(h * bw) / bh}px;height:${h}px">${m.d.map((d) => `<path d="${d}" fill="var(--acc)"/>`).join('')}</svg>`;
}

/* ---------- text, placed by baseline ---------- */
/** Text whose first BASELINE is at y (placeBaselines sets its top once the fonts are in). */
const t = (html, x, y, role, style = '') => `<div class="a r-${role}" data-by="${y}" style="left:${x}px;${style}">${html}</div>`;

function placeBaselines(root) {

    el.insertBefore(probe, el.firstChild);
    el.style.top = '0px';
    const base = probe.getBoundingClientRect().top - el.getBoundingClientRect().top;

    el.style.top = `${Number(el.dataset.by) - base}px`;

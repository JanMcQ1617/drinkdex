<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v4.7 code renders</title>
<style>
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}
/*
 * Visual review renders of what the v4.7 CODE draws (not the spec): every
 * measure below is read off FriendsBoard.tsx, TournamentCard.tsx,
 * FloatingTabBar.tsx, PostCard.tsx, log.tsx, tournaments/[id].tsx and
 * activity.tsx, glyphs from icons.tsx, pen marks from penPath.ts itself
 * (marks.js, regenerated by node import). Open with a #frame hash.
 */
:root{--page:#FFFFFF;--wash:#F5F5F5;--press:#EBEBEB;--line:#E3E3E3;--hair:#D6D6D6;--control:#8A8A8A;--muted:#5C5C5C;--ink:#0A0A0A;
--photoEdge:rgba(10,10,10,.07);--t1:#262626;--t2:#3D3D3D;--t3:#5C5C5C;--acc:#D0102C;--onAcc:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}
.a{position:absolute}
.title{font:600 28px/34px Inter;letter-spacing:-.4px}
.body{font:400 17px/24px Inter;letter-spacing:-.2px}
.small{font:400 13px/18px Inter}
.muted{color:var(--muted)} .tn{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone{position:relative;width:440px;height:956px;background:var(--page);overflow:hidden}
.strip{position:relative;width:440px;background:var(--page);overflow:hidden}
.circle{border-radius:50%}
.print{position:absolute;overflow:hidden;background:var(--wash);border-radius:2px}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);border-radius:2px}
.pm{position:absolute;pointer-events:none;z-index:29;overflow:visible}
.frame{display:none}
.frame.on{display:block}
</style>
</head>
<body>
<div id="root"></div>
<script src="marks.js"></script>
<script>
const IMG = id => `../../../assets/drinks/${id}.webp`;
/* ---- icons.tsx ---- */
const OUT = {
  home:'<path d="M3.2 10.4 12 3.4l8.8 7"/><path d="M5.4 9.3V19.4a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6V9.3"/><path d="M9.6 21V14.9h4.8V21"/>',
  dex:'<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
  chevronLeft:'<path d="M14.6 5.4 8 12l6.6 6.6"/>',
  chevronRight:'<path d="M9.4 5.4 16 12l-6.6 6.6"/>',
  plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  bookmark:'<path d="M6.4 4.6h11.2v15.8L12 16.3l-5.6 4.1z"/>',
  trophy:'<path d="M7.4 4.4h9.2v5.1a4.6 4.6 0 0 1-9.2 0z"/><path d="M7.4 5.9H5a1.4 1.4 0 0 0-1.4 1.4 3.6 3.6 0 0 0 3.6 3.6"/><path d="M16.6 5.9H19a1.4 1.4 0 0 1 1.4 1.4 3.6 3.6 0 0 1-3.6 3.6"/><path d="M12 14.1v3.4"/><path d="M8.4 20.2a3.6 3.6 0 0 1 7.2 0z"/>',
  heart:'<path d="M12 20.3 4.9 13.4a4.3 4.3 0 0 1 0-6.2 4.5 4.5 0 0 1 6.3 0l.8.8.8-.8a4.5 4.5 0 0 1 6.3 0 4.3 4.3 0 0 1 0 6.2z"/>',
  send:'<path d="M2.9 10.9 21.1 4.9 9.1 13.1z"/><path d="M9.1 13.1 21.1 4.9 12.6 19.1z"/>',
  search:'<circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.5 15.5 20.4 20.4"/>',
  close:'<path d="M6.2 6.2 17.8 17.8"/><path d="M17.8 6.2 6.2 17.8"/>',
  more:'<circle cx="5.4" cy="12" r="1.15"/><circle cx="12" cy="12" r="1.15"/><circle cx="18.6" cy="12" r="1.15"/>',
};
const SOLID = {
  home:'<path fill-rule="evenodd" d="M12 2.7a1.4 1.4 0 0 1 .9.3l8.3 6.6a1.4 1.4 0 0 1 .5 1.1v8.7a2.2 2.2 0 0 1-2.2 2.2h-4.6v-5.7a1 1 0 0 0-1-1h-3.8a1 1 0 0 0-1 1v5.7H4.5a2.2 2.2 0 0 1-2.2-2.2v-8.7a1.4 1.4 0 0 1 .5-1.1l8.3-6.6a1.4 1.4 0 0 1 .9-.3z"/>',
  dex:'<path d="M3.5 5.1a.5.5 0 0 0-.36.85l8.5 8.7a.5.5 0 0 0 .72 0l8.5-8.7a.5.5 0 0 0-.36-.85z"/><path d="M11.1 14.6h1.8v4.3h2.8a.9.9 0 0 1 0 1.8H8.3a.9.9 0 0 1 0-1.8h2.8z"/>',
  bookmark:'<path d="M6.4 4.6a.9.9 0 0 0-.9.9v14.9a.9.9 0 0 0 1.42.73L12 17.4l5.08 3.73a.9.9 0 0 0 1.42-.73V5.5a.9.9 0 0 0-.9-.9z"/>',
  heart:'<path d="M12 20.9a1 1 0 0 1-.68-.27l-6.9-6.7a5.1 5.1 0 0 1 0-7.4 5.4 5.4 0 0 1 7.58 0 5.4 5.4 0 0 1 7.58 0 5.1 5.1 0 0 1 0 7.4l-6.9 6.7a1 1 0 0 1-.68.27z"/>',
  /* v4.7: cup, stem, foot filled + the outline's handles stroked at 1.6 + 0.55 in currentColor */
  trophy:'<path d="M7.4 4.4h9.2v5.1a4.6 4.6 0 0 1-9.2 0z"/><path d="M11.1 14v3.5h1.8V14z"/><path d="M12 16.6a3.6 3.6 0 0 0-3.6 3.6h7.2a3.6 3.6 0 0 0-3.6-3.6z"/><g fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><path d="M7.4 5.9H5a1.4 1.4 0 0 0-1.4 1.4 3.6 3.6 0 0 0 3.6 3.6"/><path d="M16.6 5.9H19a1.4 1.4 0 0 1 1.4 1.4 3.6 3.6 0 0 1-3.6 3.6"/></g>',
};
/* Icon(): solid when filled and a SOLID exists, else the outline at 1.6 (filled outline 2.15). */
const ic = (name, size, color, filled=false) => {
  if (filled && SOLID[name]) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><g fill="${color}" color="${color}" style="color:${color}">${SOLID[name]}</g></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><g stroke="${color}" stroke-width="${filled?2.15:1.6}" stroke-linecap="round" stroke-linejoin="round" fill="none">${OUT[name]}</g></svg>`;
};
const at = (x, y, inner, st='') => `<div class="a" style="left:${x}px;top:${y}px;${st}">${inner}</div>`;
const initials = n => n.replace(/[^a-zA-Z0-9 ._-]/g,'').split(/[ ._-]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const av = (x, y, d, tone, name) => `<div class="a circle" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:var(--${tone});display:flex;align-items:center;justify-content:center;color:#fff;font:600 ${Math.round(d*0.38)}px/1 Inter">${initials(name)}</div>`;
const photo = (id, x, y, w, h) => `<div class="print" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${IMG(id)}"></div>`;
/* A pen mark: its nominal box at (left, top); the ink drawn in box coordinates, as Ink places it. */
const M = (shape, left, top) => `<svg class="pm" width="1" height="1" style="left:${left}px;top:${top}px">${shape.d.map(d => `<path fill="var(--acc)" d="${d}"/>`).join('')}</svg>`;
const statusBar = () => `<div class="a" style="left:0;top:0;width:440px;height:62px;background:#fff;z-index:30"><span class="a" style="left:52px;top:21px;font:600 17px/22px Inter">9:41</span><span class="a" style="left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000"></span></div>`;
const homeInd = () => `<div class="a" style="left:150px;top:942px;width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:40"></div>`;

/* ==== FloatingTabBar.tsx ==== row 49 at bar top, five equal slots of 88, line 18x2 at y 43 */
function tabs(active, top=873){
  const xs = {index:44, dex:132, board:220, saved:308, profile:396}, cy = top + 24.5;
  let h = `<div class="a" style="left:0;top:${top}px;width:440px;height:83px;background:var(--page);z-index:32"></div>`;
  const g = (route, glyph) => at(xs[route]-13, cy-13, ic(glyph, 26, active===route?'var(--ink)':'var(--muted)', active===route), 'z-index:33');
  h += g('index','home') + g('dex','dex') + g('saved','bookmark');
  // TournamentsKey: 52x32, radius 4, accent, trophy 22 onAccent, outline at rest / solid focused
  h += `<div class="a" style="left:194px;top:${top+8.5}px;width:52px;height:32px;border-radius:4px;background:var(--acc);display:flex;align-items:center;justify-content:center;z-index:33">${ic('trophy',22,'#FFFFFF',active==='board')}</div>`;
  if (active === 'profile') h += `<div class="a circle" style="left:${396-16.5}px;top:${cy-16.5}px;width:33px;height:33px;box-shadow:inset 0 0 0 1.5px var(--ink);z-index:33"></div>`;
  h += `<div class="a" style="z-index:33">${av(383, cy-13, 26, 't3', 'nico pours')}</div>`;
  h += `<div class="a" style="left:${xs[active]-9}px;top:${top+43}px;width:18px;height:2px;background:var(--ink);z-index:33"></div>`;
  return h;
}

/* ==== ScreenTopBar lg: title 28/34 at x 24, y 71; swash left 1, bottom -4 of the title box ==== */
const bar = title => at(24, 71, `<span class="title">${title}</span>`, 'z-index:29') + M(PENM.swash, 25, 105 + 4 - 6);

const P = {
  me:{u:'nico.pours', d:'Nico Pours', tone:'t3'}, ana:{u:'ana', d:'Ana', tone:'t2'}, leo:{u:'leo', d:'Leo', tone:'t1'},
  maya:{u:'maya.pours', d:'Maya Pours', tone:'t1'}, ines:{u:'ines.ag', d:'Ines Aguilar', tone:'t2'}, theo:{u:'theo_stirs', d:'Theo Stirs', tone:'t1'},
  sam:{u:'sam.ortega', d:'Sam Ortega', tone:'t3'},
};

/* ==== TournamentCard.tsx: padding 16, bottom 12, min 158; name 24, meta 18, +10, three 26 lines ==== */
function card(x, y, w, t){
  const L = x + 16, R = x + w - 16;
  let s = `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:158px;background:var(--wash);border-radius:8px"></div>`;
  s += at(L, y+16, `<span class="body ell" style="display:block;font-weight:600;width:${w-32-16-8}px">${t.name}</span>`);
  s += at(R-16, y+16+4, ic('chevronRight',16,'var(--muted)'));
  s += at(L, y+40, `<span class="small muted ell" style="display:block;width:${w-32}px">${t.meta}</span>`);
  t.top.forEach((r, i) => {
    const ly = y + 16 + 24 + 18 + 10 + i*26;
    s += at(L, ly+4, `<span class="small tn" style="display:inline-block;font-weight:600;min-width:14px;text-align:right">${r.rank ?? ''}</span>`);
    s += av(L+24, ly+3, 20, P[r.who].tone, P[r.who].d);
    s += at(L+54, ly+4, `<span class="small">${P[r.who].u}${r.who==='me'?'<span class="muted"> (you)</span>':''}</span>`);
    s += `<div class="a small muted tn" style="top:${ly+4}px;left:${R-120}px;width:120px;text-align:right">${r.n}</div>`;
  });
  return s;
}

/* ==== FriendsBoard.tsx FriendRow: 64; rank 28 col at 24 (17/24 600 tabular), face 40 at 60, who at 112, prints 288..416 ==== */
function friendRow(y, f){
  let s = '';
  if (f.who === 'me') s += `<div class="a" style="left:16px;top:${y}px;width:408px;height:64px;background:var(--wash);border-radius:4px"></div>`;
  const ranked = f.rank != null && f.n > 0;
  s += at(24, y+20, `<span class="body tn" style="display:inline-block;width:28px;text-align:right;font-weight:600">${ranked ? f.rank : ''}</span>`);
  s += av(60, y+12, 40, P[f.who].tone, P[f.who].d);
  const wW = f.n > 0 && f.pics && f.pics.length ? 164 : 292;
  s += at(112, y+11, `<div class="body ell" style="font-weight:500;width:${wW}px">${P[f.who].u}${f.who==='me'?'<span class="muted" style="font-weight:500"> (you)</span>':''}</div><div class="small muted tn">${f.n === 0 ? 'No entries yet' : f.n + (f.n===1?' entry':' entries')}</div>`);
  if (f.n > 0) (f.pics || []).forEach((id, i) => { s += photo(id, 288 + i*44, y+12, 40, 40); });
  return s;
}
const groupHead = (y, text) => at(24, y, `<span class="small muted" style="font-weight:600">${text}</span>`);
const hostKey = y => `<div class="a" style="left:24px;top:${y}px;width:392px;height:52px;background:var(--wash);border-radius:4px;display:flex;align-items:center;justify-content:center;font:500 17px/24px Inter;letter-spacing:-.2px">Host a tournament</div>` + at(40, y+16, ic('plus',20,'var(--ink)'));
const RULES = 'Each different drink you post while it runs adds one entry, up to 3 a day. Entries are counted, never amounts. No prizes, and Apple is not a sponsor. Please drink responsibly.';

const FRIENDS = [
  {rank:1, who:'maya', n:87, pics:['last-word','sazerac','french-75']},
  {rank:2, who:'ana', n:64, pics:['negroni','daiquiri','paloma']},
  {rank:3, who:'me', n:42, pics:['black-russian','mai-tai','gimlet']},
  {rank:3, who:'leo', n:42, pics:['boulevardier','manhattan','old-fashioned']},
  {rank:5, who:'ines', n:19, pics:['aperol-spritz','margarita','mojito']},
  {rank:6, who:'theo', n:1, pics:['paper-plane']},
  {rank:null, who:'sam', n:0, pics:[]},
];

function board(opts={}){
  let s = statusBar() + bar('Tournaments');
  let y = 114 + 16;
  s += hostKey(y); y += 52;
  if (opts.cards) {
    y += 24; s += groupHead(y, 'On now'); y += 18 + 8;
    if (opts.cards === 1) {
      s += card(24, y, 392, {name:'Negroni week', meta:'Ends Sunday · 5 people', top:[{rank:1,who:'ana',n:'6 entries'},{rank:2,who:'me',n:'4 entries'},{rank:3,who:'leo',n:'4 entries'}]});
    } else {
      s += card(24, y, 300, {name:'Negroni week', meta:'Ends Sunday · 5 people', top:[{rank:1,who:'ana',n:'6 entries'},{rank:2,who:'me',n:'4 entries'},{rank:3,who:'leo',n:'4 entries'}]});
      s += card(336, y, 300, {name:'Bar crawl club', meta:'Ends 2 Nov · 3 people', top:[{rank:1,who:'maya',n:'3 entries'},{rank:2,who:'theo',n:'1 entry'},{rank:null,who:'sam',n:'No entries yet'}]});
    }
    y += 158;
    // quiet line: 44, text centred, word left, detail right before the 16 chevron (gap 8)
    s += at(24, y+13, `<span class="small muted">All tournaments</span>`);
    s += `<div class="a small muted" style="top:${y+13}px;right:${440-416+16+8}px;white-space:nowrap">1 invitation</div>`;
    s += at(400, y+14, ic('chevronRight',16,'var(--muted)'));
    y += 44;
  } else if (opts.failed) {
    y += 12;
    s += at(24, y, `<div class="small muted" style="width:392px">Could not load tournaments. Pull down to try again.</div>`);
    y += 18;
  } else {
    y += 12;
    s += at(24, y, `<div class="small muted" style="width:392px">Nothing on now. A tournament is a shared log of the Dex entries you and people you follow post between two dates.</div>`);
    y += 36 + 12; // nothingOverRule: 12 more when the rule follows (integration fix)
  }
  if (opts.failed) { y += 24; } // no board rule under an error line; the group head's own 24
  else { s += M(PENM.board, 24, y + 12 - PENM.PEN.rule.mid); y += 24; y += 4; }
  s += groupHead(y, 'Friends'); y += 18 + 8;
  const rows = opts.alone ? [{rank:null, who:'me', n:0, pics:[]}] : FRIENDS;
  rows.forEach(f => { s += friendRow(y, f); y += 64; });
  if (opts.alone) {
    y += 16;
    s += at(24, y, `<div class="small muted" style="width:392px">Follow people to see how many different drinks each has posted.</div>`); y += 36;
    s += at(24, y+13, `<span class="small" style="font-weight:500">Find people to follow</span>`);
    s += at(24+137, y+14, ic('chevronRight',16,'var(--ink)'));
    y += 44;
  }
  y += 24;
  s += at(24, y, `<div class="small muted" style="width:392px">Friends shows how many different drinks each person has posted, each counted once. ${RULES}</div>`);
  return s + tabs('board') + homeInd();
}
function loadingBoard(){
  let s = statusBar() + bar('Tournaments');
  s += hostKey(130);
  // Hold: paddingTop 48 under the header, a quiet spinner
  s += `<div class="a circle" style="left:208px;top:${182+48}px;width:24px;height:24px;border:2.5px solid var(--hair);border-top-color:var(--muted)"></div>`;
  return s + tabs('board') + homeInd();
}

function tabStrips(){
  const one = (label, active) => `<div class="strip" style="height:118px;border-bottom:2px solid #E9E9E9"><div class="a small muted" style="left:24px;top:10px;font-weight:600">${label}</div>${tabs(active, 36).replace(/height:83px/,'height:82px')}</div>`;
  return one('At rest, on Home: trophy outline', 'index') + one('On the Tournaments tab: trophy solid, line under the key', 'board') + one('On Saved', 'saved') + one('On Profile', 'profile');
}

/* ==== PostCard.tsx: header 52, square photo 440, actions 44 (boxes at 7, 51 · 389), burst centred ==== */
function post(st){
  // st: {like, ring:{s,o}, burst:{s,o,y}|null, liked, saved, fill (0..1 of save pour), share:{x,y,s,o}}
  let s = '';
  const top = 0;
  s += av(16, top+10, 32, 't3', 'Jan McQueeny');
  s += at(60, top+8, `<div class="small" style="font-weight:600">jan.mcqueeny</div><div style="font:700 13px/18px Playfair">Black Russian</div>`);
  s += at(424-24, top+14, ic('more',24,'var(--ink)'));
  const py = top + 52;
  s += `<div class="a" style="left:0;top:${py}px;width:440px;height:440px;overflow:hidden;background:var(--wash)"><img src="${IMG(st.img||'black-russian')}" style="width:100%;height:100%;object-fit:cover"></div>`;
  if (st.burst) {
    const b = st.burst;
    s += `<div class="a" style="left:0;top:${py}px;width:440px;height:440px;display:flex;align-items:center;justify-content:center;z-index:5"><div style="position:relative;width:136px;height:136px;opacity:${b.o};transform:translateY(${b.y}px) scale(${b.s})">${ic('heart',136,'#FFFFFF',true)}<div style="position:absolute;left:4px;top:4px">${ic('heart',128,'var(--acc)',true)}</div></div></div>`;
  }
  const ay = py + 440;
  // like key: box 7..51, glyph box 26 centred (16..42), ring 26 behind
  const r = st.ring || {s:0.6,o:0};
  s += at(16, ay+9, `<div style="position:relative;width:26px;height:26px"><div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--acc);opacity:${r.o};transform:scale(${r.s})"></div><div style="transform:scale(${st.like||1})">${ic('heart',26,st.liked?'var(--acc)':'var(--ink)',!!st.liked)}</div></div>`);
  const sh = st.share || {x:0,y:0,s:1,o:1};
  s += at(60, ay+9, `<div style="opacity:${sh.o};transform:translate(${sh.x}px,${sh.y}px) scale(${sh.s})">${ic('send',26,'var(--ink)')}</div>`);
  // save key: outline, and the solid in a 26 window that pours top-down: window ty = fill, inner ty = -fill
  const f = st.fillY == null ? (st.saved ? 0 : -26) : st.fillY;
  s += at(398, ay+9+(st.drop||0), `<div style="position:relative;width:26px;height:26px">${ic('bookmark',26,'var(--ink)')}<div style="position:absolute;left:0;top:0;width:26px;height:26px;overflow:hidden;transform:translateY(${f}px)"><div style="transform:translateY(${-f}px)">${ic('bookmark',26,'var(--ink)',true)}</div></div></div>`);
  s += at(16, ay+44+2, `<span class="small"><b style="font-weight:600">${st.liked ? '1 like' : '0 likes'}</b></span>`);
  s += at(16, ay+44+26, `<span class="small muted">1 week ago</span>`);
  s += M(PENM.entry, 16, ay+44+26+18+12);
  return `<div class="strip" style="height:${ay+44+26+18+28}px">${s}</div>`;
}
/* Timings from LikeKey / HeartBurst / ShareKey / SaveKey */
const outCubic = p => 1-Math.pow(1-p,3), inCubic = p => p*p*p, inQuad = p => p*p, outQuad = p => 1-(1-p)*(1-p), inOutQuad = p => p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function likeAt(t){
  let sc = 1;
  if (t < 80) sc = 1 - 0.18*inQuad(t/80); else if (t < 220) sc = 0.82 + 0.36*outCubic((t-80)/140); else if (t < 380) sc = 1.18 - 0.18*inOutQuad((t-220)/160);
  let ring = {s:0.6,o:0};
  if (t >= 80 && t < 400) { const p = outCubic((t-80)/320); ring = {s:0.6+0.9*p, o:0.5*(1-p)}; }
  return {sc, ring};
}
function burstAt(t){
  let s, o, y = 0;
  if (t < 180) s = 1.15*outCubic(t/180); else if (t < 280) s = 1.15 - 0.2*inOutQuad((t-180)/100); else if (t < 380) s = 0.95 + 0.05*outQuad((t-280)/100); else if (t < 620) s = 1; else s = 1 + 0.1*inQuad(Math.min(1,(t-620)/220));
  o = t < 60 ? outCubic(t/60) : t < 620 ? 1 : 1 - inQuad(Math.min(1,(t-620)/220));
  if (t >= 620) y = -12*inQuad(Math.min(1,(t-620)/220));
  return {s, o, y};
}
function postAt(t){ const L = likeAt(t); return post({liked:true, like:L.sc, ring:L.ring, burst:burstAt(t)}); }

/* Action-row strips at points in each key's timeline */
function keysStrip(){
  const row = (label, st) => { const html = post(st); return `<div style="position:relative;width:440px;height:84px;overflow:hidden;border-bottom:2px solid #E9E9E9"><div style="position:absolute;left:0;top:${-492+20}px">${html}</div><div class="a small muted" style="left:140px;top:28px;font-weight:600;z-index:40;background:var(--page);padding:0 4px">${label}</div></div>`; };
  const L = t => { const l = likeAt(t); return {liked:true, like:l.sc, ring:l.ring}; };
  const sh = t => { if (t<160){const p=inCubic(t/160);return {x:8*p,y:-3*p,s:1-0.1*p,o:1-p};} const p=outCubic((t-160)/200);return {x:-6*(1-p),y:2*(1-p),s:1,o:p}; };
  const sv = t => { if (t<160) return {saved:true, fillY:-26*(1-outCubic(t/160))}; if (t<260) return {saved:true, fillY:0, drop:1.5*inQuad((t-160)/100)}; return {saved:true, fillY:0, drop:1.5*(1-outQuad((t-260)/120))}; };
  return [
    row('rest, unliked / unsaved', {}),
    row('like t=40 (squash 0.9)', L(40)),
    row('like t=120 (ring 0.9, op .33)', L(120)),
    row('like t=220 (peak 1.18)', L(220)),
    row('like t=300 (ring fading)', L(300)),
    row('liked, rest', {liked:true}),
    row('share t=100 (flying out)', {share:sh(100)}),
    row('share t=240 (coming home)', {share:sh(240)}),
    row('save t=60 (pouring)', sv(60)),
    row('save t=200 (landing +1.5)', sv(200)),
    row('saved, rest', {saved:true}),
  ].join('');
}

/* ==== log.tsx find row: X box 12..56 (glyph 24), field 64..416 in the 52 row, focused: white, 2pt ink ring ==== */
function logStrip(){
  let s = statusBar();
  s += at(22, 62+14, ic('close',24,'var(--ink)'));
  s += `<div class="a" style="left:64px;top:${62+4}px;width:352px;height:44px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink)"></div>`;
  s += at(76, 62+16, ic('search',20,'var(--ink)'));
  s += at(104, 62+14, `<span class="body muted">Type your drink</span>`);
  s += `<div class="a" style="left:105px;top:${62+15}px;width:2px;height:22px;background:#0A84FF"></div>`;
  s += at(24, 114+16+8, `<span class="small muted" style="font-weight:600">Recent</span>`);
  return `<div class="strip" style="height:170px">${s}</div>`;
}

/* ==== tournaments/[id].tsx head: content x 24, head paddingTop 16, name 28/34, swash left 1 bottom -7, nameRow marginBottom 8 ==== */
function tpage(name, lines=1){
  let s = statusBar();
  s += at(24-10, 62+14, ic('chevronLeft',24,'var(--ink)'));
  const y0 = 114 + 16;
  const nameW = 392 - 8 - 24 - (44-24)/2 + 10; // nameBox flex beside the ••• box
  s += at(24, y0, `<div class="title" style="width:${352}px">${name}</div>`);
  const nameBottom = y0 + 34*lines;
  s += M(PENM.swash, 25, nameBottom + 7 - 6);
  s += at(416-24, y0 + 5, ic('more',24,'var(--ink)'));
  let y = nameBottom + 8 + 4;
  s += at(24, y, `<span class="small muted">On now · ends Sunday 26 October</span>`); y += 18 + 4;
  s += at(24, y, `<span class="small muted">Most entries · hosted by ana</span>`); y += 18;
  y += 24;
  s += `<div class="a" style="left:24px;top:${y}px;width:392px;height:52px;background:var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font:500 17px/24px Inter">Post a drink you've had</div>` + at(40, y+16, ic('plus',20,'#FFFFFF'));
  y += 52 + 24;
  s += groupHead(y, 'Standings'); y += 18 + 4;
  [{r:1,w:'ana',n:'6 entries'},{r:2,w:'me',n:'4 entries'},{r:3,w:'leo',n:'4 entries'}].forEach(o => {
    if (o.w==='me') s += `<div class="a" style="left:16px;top:${y}px;width:408px;height:56px;background:var(--wash);border-radius:4px"></div>`;
    s += at(24, y+16, `<span class="body tn" style="font-weight:600">${o.r}</span>`);
    s += av(48, y+10, 36, P[o.w].tone, P[o.w].d);
    s += at(96, y+16, `<span class="body">${P[o.w].u}${o.w==='me'?'<span class="muted"> (you)</span>':''}</span>`);
    s += `<div class="a body muted tn" style="top:${y+16}px;right:24px">${o.n}</div>`;
    y += 56;
  });
  return `<div class="strip" style="height:${y+20}px">${s}</div>`;
}

/* ==== activity.tsx: rows 64 (pad 12, lead 56 at 24, sentence at 92, thumb 44 ending 416); closing rule 16 under, at 24 ==== */
function activity(){
  let s = statusBar();
  s += at(14, 62+14, ic('chevronLeft',24,'var(--ink)'));
  s += `<div class="a" style="left:0;top:${62+14}px;width:440px;text-align:center;font:600 17px/24px Inter">Activity</div>`;
  let y = 114 + 8;
  s += groupHead(y+24, 'This week'); y += 24 + 18 + 4;
  const rows = [
    {w:'ana', t:'<b style="font-weight:600">ana</b> liked your Negroni. <span class="muted">2h</span>', pic:'negroni'},
    {w:'maya', t:'<b style="font-weight:600">maya.pours</b> started following you. <span class="muted">1d</span>'},
    {w:'leo', t:'<b style="font-weight:600">leo</b> liked your Black Russian. <span class="muted">3d</span>', pic:'black-russian'},
  ];
  rows.forEach(r => {
    s += av(24, y+12, 40, P[r.w].tone, P[r.w].d);
    s += at(92, y+20, `<div class="body ell" style="width:${r.pic?268:324}px">${r.t}</div>`);
    if (r.pic) s += photo(r.pic, 372, y+10, 44, 44);
    y += 64;
  });
  s += M(PENM.activity, 24, y + 16);
  y += 22;
  return `<div class="strip" style="height:${y+40}px">${s}</div>`;
}

const FRAMES = {

/* ==== rollout.png: the round on one sheet (integration, 23 Oct 2026) ==== */
function rollout(){
  const lab = (t) => `<div style="font:600 15px/20px Inter;color:var(--ink);margin:0 0 8px">${t}</div>`;
  const sc = (html, k, w, h) => `<div style="width:${w*k}px;height:${h*k}px;overflow:hidden;position:relative;box-shadow:0 0 0 1px #E3E3E3"><div style="transform:scale(${k});transform-origin:0 0;width:${w}px;position:absolute;left:0;top:0">${html}</div></div>`;
  const col = (inner, w) => `<div style="width:${w}px;display:flex;flex-direction:column;gap:20px">${inner}</div>`;
  const box = (t, html) => `<div>${lab(t)}${html}</div>`;
  const phone = (html) => `<div class="phone">${html}</div>`;
  const POST_H = 52+440+44+26+18+28;
  return `<div style="padding:28px;display:flex;gap:28px;align-items:flex-start;background:#FAFAFA;width:max-content">
    ${col(box('1. Tournaments tab: two on now, Friends ranked (ties 3, 3)', sc(phone(board({cards:2})), 1, 440, 956)), 440)}
    ${col(box('2. Nothing on now: rule 24 under the sentence', sc(phone(board({cards:0})), 0.62, 440, 956)) + box('3. Tournaments failed: no rule under the error', sc(phone(board({cards:0, failed:true})), 0.62, 440, 956).replace('<div style="width:272.8px;height:592.72px', '<div style="width:272.8px;height:300px')), 273)}
    ${col(box('4. Tab bar: red key, trophy outline / solid', sc(tabStrips(), 0.75, 440, 472)) + box('5. "Type your drink"', sc(logStrip(), 0.75, 440, 170)) + box('6. New pen: swash under a tournament name', sc(tpage('Negroni week'), 0.75, 440, 360)) + box('7. New pen: Activity closing rule', sc(activity(), 0.75, 440, 430)), 330)}
    ${col(box('8. Double-tap: like t=120, t=220, t=700 (128pt heart)', `<div style="display:flex;gap:12px">${[120,220,700].map(t => sc(postAt(t), 0.5, 440, POST_H)).join('')}</div>`) + box('9. Keys: like, share, save frames', sc(keysStrip(), 0.62, 440, 924)), 684)}
  </div>`;
}
const want = location.hash.slice(1) || 'board';
document.getElementById('root').innerHTML = FRAMES[want]();

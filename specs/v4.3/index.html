<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sipply v4.3 mockups</title>
<style>
@font-face{font-family:Inter;src:url(../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}

/* v4 "Daylight" tokens (src/constants/theme.ts). No hue: the drink photos are the only colour. */
:root{
  --page:#FFFFFF; --wash:#F5F5F5; --press:#EBEBEB; --line:#E3E3E3; --hair:#D6D6D6; --rule:#C4C4C4;
  --control:#8A8A8A; --muted:#5C5C5C; --ink:#0A0A0A; --inkPressed:#333333; --onInk:#FFFFFF; --onInkMuted:#A3A3A3;
  --scrim:rgba(10,10,10,.36); --photoEdge:rgba(10,10,10,.07);
  --t1:#262626; --t2:#3D3D3D; --t3:#5C5C5C;
  /* iOS system sheet (the share sheet is Apple's, not ours): its own neutral greys */
  --sys:#F2F2F7; --sysRow:#FFFFFF; --sysSep:#C6C6C8; --sysLabel:#3C3C43;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E6E6E6}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}
b{font-weight:600}

/* the three sizes (title 28/34, body 17/24, small 13/18), Playfair for drink names; prompt 22/28 is onboarding's own */
.title{font:600 28px/34px Inter;letter-spacing:-.4px}
.body{font:400 17px/24px Inter;letter-spacing:-.2px}
.b5{font-weight:500}.b6{font-weight:600}
.small{font:400 13px/18px Inter}
.pf{font:700 17px/24px Playfair;letter-spacing:-.2px}
.pf28{font:700 28px/34px Playfair;letter-spacing:-.2px}
.prompt{font:500 22px/28px Inter;letter-spacing:-.3px}
.plate{font:500 13px/18px Inter;letter-spacing:1px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .tn{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.a{position:absolute}
.phone{position:relative;width:440px;height:956px;background:var(--page);overflow:hidden;flex:none;isolation:isolate}
.circle{border-radius:50%}
.sb{position:absolute;top:0;left:0;right:0;height:62px;color:var(--ink);background:var(--page);z-index:30}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.sb .r{position:absolute;right:30px;top:24px;display:flex;gap:6px;align-items:center}
.homeInd{position:absolute;left:150px;top:942px;width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:40}

/* prints: square corners (radius 2, layout spec), photoEdge inset (white spec §5) */
.print{position:absolute;overflow:hidden;background:var(--wash);border-radius:2px}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);border-radius:2px;pointer-events:none}
.print.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--page)}
.print.mosaic>div{position:relative;overflow:hidden;background:var(--wash)}
.print.mosaic img{position:absolute;inset:0}

/* keys and chips: squared (4pt). Chips 32 tall, hair edge off, ink on (ui.tsx Chip) */
.key{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:500 17px/24px Inter;letter-spacing:-.2px;gap:8px}
.key.ink{background:var(--ink);color:var(--onInk)}
.key.wash{background:var(--wash);color:var(--ink)}
.key.off{background:var(--wash);color:var(--muted)}
.chips{display:flex;gap:8px;align-items:center}
.chips.wrap{flex-wrap:wrap}
.chip{height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hair);font:500 13px/18px Inter;color:var(--ink);white-space:nowrap;background:var(--page)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--onInk);box-shadow:none}
.chip.on .n{color:var(--onInkMuted)}
.chip.sort{background:var(--wash);box-shadow:none;padding:0 10px 0 12px;gap:4px}

.field{position:absolute;left:24px;width:392px;height:44px;border-radius:4px;background:var(--wash)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--page);border-radius:12px 12px 0 0;box-shadow:0 -8px 30px rgba(10,10,10,.12);z-index:35}
.grab{position:absolute;left:202px;top:8px;width:36px;height:4px;border-radius:1px;background:var(--rule)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:34}
.box{width:22px;height:22px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--control);background:var(--page);flex:none;display:flex;align-items:center;justify-content:center}
.box.on{background:var(--ink);box-shadow:none}
.opt{position:absolute;background:var(--wash);border-radius:4px;display:flex;align-items:center;justify-content:center;font:400 17px/24px Inter;letter-spacing:-.2px;color:var(--ink)}
.opt.on{background:var(--ink);color:var(--onInk);font-weight:500}
.bubble{position:absolute;background:var(--wash);border-radius:4px}
.bubble.q{border-top-left-radius:0;padding:19px 21px}
.bubble .sub{margin-top:8px}
.seal{position:absolute;background:url(../../assets/images/icon.png) center/156% no-repeat;border-radius:50%}
.fb{position:absolute;left:24px;width:392px;top:719px;height:105px;background:var(--wash);border-radius:4px;display:flex;align-items:center;gap:16px;padding:0 20px}
.kb{position:absolute;left:0;right:0;bottom:0;height:346px;background:#D4D5D8;z-index:36}
.kb .k{position:absolute;height:42px;border-radius:5px;background:#FFFFFF;box-shadow:0 1px 0 #898A8D;font:400 22px/42px Inter;text-align:center;color:#000}
.kb .k.g{background:#ABAFB6;font-size:15px}

/* the wall */
.wall{display:flex;flex-wrap:wrap;gap:72px 36px;padding:120px 44px 60px;width:2908px;position:relative}
.wall>h1{position:absolute;left:44px;top:34px;font:600 30px/36px Inter;letter-spacing:-.6px}
.wall>h1 small{display:block;font:400 15px/22px Inter;letter-spacing:0;color:var(--muted);margin-top:6px}
.frame{display:flex;flex-direction:column;gap:14px;width:440px;flex:none}
.frame .phone{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.cap{font:400 13px/19px Inter;color:#4A4A4A}
.cap .cnt{display:block;font:600 15px/22px Inter;color:var(--ink);margin-bottom:4px}
body.solo{background:var(--page)}
body.solo .wall{padding:0;display:block;width:auto}
body.solo .wall>h1,body.solo .cap{display:none}
body.solo .frame{display:none}
body.solo .frame.on{display:block}
body.solo .frame .phone{box-shadow:none}

/* v4.3 */
.wall{width:2432px}
.sheet{z-index:35}
</style>
</head>
<body>
<div class="wall" id="wall">
  <h1>Sipply v4.3: tag the people you were with, and one idea a day
    <small>Daylight tokens at 440 × 956. The people are stand-ins (ana and leo are Jan’s own example); the drinks and photos are the catalogue’s. Every notification line is real copy from ideas.mjs, which tools/schedule.mjs checks.</small></h1>
</div>
<script>
const IMG = id => `../../assets/drinks/${id}.webp`;
const fmt = n => n.toLocaleString('en-US');
/* ---------- glyphs: src/components/icons.tsx paths ---------- */
const OUT = {
  home:'<path d="M3.2 10.4 12 3.4l8.8 7"/><path d="M5.4 9.3V19.4a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6V9.3"/><path d="M9.6 21V14.9h4.8V21"/>',
  dex:'<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
  search:'<circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.5 15.5 20.4 20.4"/>',
  sliders:'<path d="M4 7.5h9.2"/><path d="M17.8 7.5H20"/><path d="M4 16.5h2.7"/><path d="M11.3 16.5H20"/><circle cx="15.5" cy="7.5" r="2.3"/><circle cx="9" cy="16.5" r="2.3"/>',
  chevronLeft:'<path d="M14.6 5.4 8 12l6.6 6.6"/>',
  chevronRight:'<path d="M9.4 5.4 16 12l-6.6 6.6"/>',
  chevronDown:'<path d="M5.4 9.4 12 16l6.6-6.6"/>',
  close:'<path d="M6.2 6.2 17.8 17.8"/><path d="M17.8 6.2 6.2 17.8"/>',
  plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  check:'<path d="M5 12.6 9.8 17.4 19 6.9"/>',
  share:'<path d="M12 15.4V3.9"/><path d="M8.2 7.5 12 3.7l3.8 3.8"/><path d="M5.4 13.2v5.9a1.5 1.5 0 0 0 1.5 1.5h10.2a1.5 1.5 0 0 0 1.5-1.5v-5.9"/>',
  heart:'<path d="M12 20.3 4.9 13.4a4.3 4.3 0 0 1 0-6.2 4.5 4.5 0 0 1 6.3 0l.8.8.8-.8a4.5 4.5 0 0 1 6.3 0 4.3 4.3 0 0 1 0 6.2z"/>',
  comment:'<path d="M20.4 12.6a7.4 7.4 0 0 1-8 7.4 8.5 8.5 0 0 1-3-.6L4.2 20.4l1.1-4.9a7.4 7.4 0 0 1-.7-3.2 7.4 7.4 0 0 1 8-7.4 7.5 7.5 0 0 1 7.8 7.4z"/>',
  send:'<path d="M2.9 10.9 21.1 4.9 9.1 13.1z"/><path d="M9.1 13.1 21.1 4.9 12.6 19.1z"/>',
  bookmark:'<path d="M6.4 4.6h11.2v15.8L12 16.3l-5.6 4.1z"/>',
  create:'<rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4"/><path d="M12 8v8"/><path d="M8 12h8"/>',
  copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="1.6"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  pencil:'<path d="M15.6 4.8 19.2 8.4 8.7 18.9 4.6 19.4 5.1 15.3z"/><path d="M13.6 6.8l3.6 3.6"/>',
  trash:'<path d="M4.8 6.8h14.4"/><path d="M9.4 6.6V4.9h5.2v1.7"/><path d="M6.6 6.8l.9 12.3a1.4 1.4 0 0 0 1.4 1.3h6.2a1.4 1.4 0 0 0 1.4-1.3l.9-12.3"/>',
  minus:'<circle cx="12" cy="12" r="8.2"/><path d="M8.4 12h7.2"/>',
  lock:'<path d="M5.9 10.6h12.2a1.4 1.4 0 0 1 1.4 1.4v7.2a1.4 1.4 0 0 1-1.4 1.4H5.9a1.4 1.4 0 0 1-1.4-1.4V12a1.4 1.4 0 0 1 1.4-1.4z"/><path d="M8.1 10.4V7.6a3.9 3.9 0 0 1 7.8 0v2.8"/>',
  stop:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/><path d="M4.5 4.5 19.5 19.5"/>',
};
const SOLID = {
  home:'<path fill-rule="evenodd" d="M12 2.7a1.4 1.4 0 0 1 .9.3l8.3 6.6a1.4 1.4 0 0 1 .5 1.1v8.7a2.2 2.2 0 0 1-2.2 2.2h-4.6v-5.7a1 1 0 0 0-1-1h-3.8a1 1 0 0 0-1 1v5.7H4.5a2.2 2.2 0 0 1-2.2-2.2v-8.7a1.4 1.4 0 0 1 .5-1.1l8.3-6.6a1.4 1.4 0 0 1 .9-.3z"/>',
  dex:'<path d="M3.5 5.1a.5.5 0 0 0-.36.85l8.5 8.7a.5.5 0 0 0 .72 0l8.5-8.7a.5.5 0 0 0-.36-.85z"/><path d="M11.1 14.6h1.8v4.3h2.8a.9.9 0 0 1 0 1.8H8.3a.9.9 0 0 1 0-1.8h2.8z"/>',
  sliders:'<path d="M3.2 6.7h10.6v1.6H3.2zM17.6 6.7h3.2v1.6h-3.2zM3.2 15.7h3.9v1.6H3.2zM10.9 15.7h9.9v1.6h-9.9z"/><circle cx="15.5" cy="7.5" r="3.1"/><circle cx="9" cy="16.5" r="3.1"/>',
  bookmark:'<path d="M6.4 4.6a.9.9 0 0 0-.9.9v14.9a.9.9 0 0 0 1.42.73L12 17.4l5.08 3.73a.9.9 0 0 0 1.42-.73V5.5a.9.9 0 0 0-.9-.9z"/>',
  heart:'<path d="M12 20.9a1 1 0 0 1-.68-.27l-6.9-6.7a5.1 5.1 0 0 1 0-7.4 5.4 5.4 0 0 1 7.58 0 5.4 5.4 0 0 1 7.58 0 5.1 5.1 0 0 1 0 7.4l-6.9 6.7a1 1 0 0 1-.68.27z"/>',
};
const ic = (name, size=24, color='var(--ink)', sw=1.6, solid=false) => {
  if (name === 'more') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><circle cx="5.4" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.6" cy="12" r="1.7"/></svg>`;
  if (solid && SOLID[name]) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">${SOLID[name]}</svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${OUT[name]}</svg>`;
};
const at = (x, y, inner, st='') => `<div class="a" style="left:${x}px;top:${y}px;${st}">${inner}</div>`;
const PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6z"/>';
const av = (x, y, d, tone) => `<div class="a circle" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:var(--${tone});display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><svg width="${Math.round(d*.86)}" height="${Math.round(d*.86)}" viewBox="0 0 24 24" fill="#FFFFFF">${PERSON}</svg></div>`;

/* ---------- system chrome ---------- */
const statusBar = (bg='var(--page)') => `<div class="sb" style="background:${bg}"><span class="t">9:41</span><span class="island"></span><span class="r">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="#0A0A0A"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="#0A0A0A"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3ZM8 9.3l1.9-1.7a2.9 2.9 0 0 0-3.8 0Z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0A0A0A" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#0A0A0A"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#0A0A0A" fill-opacity=".4"/></svg></span></div>`;
const homeInd = () => `<div class="homeInd"></div>`;

/* the tab bar as built: Home · Dex · + · Saved · Profile, 49pt row on an opaque page slab */
function tabBar(active){
  const xs = [44,132,220,308,396], cy = 897.5;
  let h = `<div class="a" style="left:0;top:873px;width:440px;height:83px;background:var(--page);z-index:32"></div>`;
  const g = (name, i) => at(xs[i]-13, cy-13, ic(name, 26, active===name?'var(--ink)':'var(--muted)', 1.6, active===name), 'z-index:33');
  h += g('home',0) + g('dex',1);
  h += `<div class="a" style="left:${xs[2]-26}px;top:${cy-19}px;width:52px;height:38px;border-radius:4px;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:33">${ic('plus',22,'#FFFFFF',2)}</div>`;
  h += g('bookmark',3);
  h += `<div class="a" style="z-index:33">${av(xs[4]-13, cy-13, 26, 't3')}</div>`;
  return h + homeInd();
}


const frames = [];
const frame = (id, title, cap, body) => frames.push({id, title, cap, body});
/* ---------- v4.3 additions ---------- */
OUT.profile = '<circle cx="12" cy="8.2" r="3.7"/><path d="M4.9 20.4a7.3 7.3 0 0 1 14.2 0"/>';
OUT.flashlight = '<path d="M8.6 3.4h6.8v3.4l-1.7 3v10.8h-3.4V9.8l-1.7-3z"/><path d="M12 13.2v2.4"/>';
OUT.cameraSys = '<path d="M4.2 8.4h3.1l1.6-2.4h6.2l1.6 2.4h3.1v10.4H4.2z"/><circle cx="12" cy="13.4" r="3.3"/>';

/* The tab bar as build 24 has it: Decided 6's short ink line under the active glyph. */
function tabs(active){
  const xs = {home:44, dex:132, bookmark:308};
  let h = tabBar(active);
  if (xs[active]) h += `<div class="a" style="left:${xs[active]-10}px;top:917px;width:20px;height:2px;background:var(--ink);z-index:33"></div>`;
  return h;
}

/* The people. Stand-ins (usernames as in the earlier v4 mocks), with Jan's own example pair, ana and leo. */
const P = {
  me:    {u:'nico.pours', n:'Nico Pérez',   tone:'t3'},
  ana:   {u:'ana',        n:'Ana López',    tone:'t2'},
  leo:   {u:'leo',        n:'Leo Martín',   tone:'t1'},
  maya:  {u:'maya.pours', n:'Maya Ortiz',   tone:'t1'},
  ines:  {u:'ines.ag',    n:'Inés Agosto',  tone:'t2'},
  theo:  {u:'theo_stirs', n:'Theo Rivera',  tone:'t1'},
  sam:   {u:'sam.ortega', n:'Sam Ortega',   tone:'t3'},
  dmitri:{u:'dmitri.k',   n:'Dmitri Kovač', tone:'t2'},
  lucia: {u:'lucia.r',    n:'Lucía Ramos',  tone:'t3'},
};

const wash = (x, y, w, h, r=4, extra='') => `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;background:var(--wash);${extra}"></div>`;
const photo = (id, x, y, w, h, extra='') => `<div class="print" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra}"><img src="${IMG(id)}"></div>`;
const box = on => `<div class="box ${on?'on':''}">${on?ic('check',18,'#FFFFFF',2.2):''}</div>`;
const grab = top => `<div class="a" style="left:202px;top:${top}px;width:36px;height:5px;border-radius:1px;background:var(--rule);z-index:36"></div>`;

/* ---------- the + window, compose step, with the Tag people row ---------- */
function composeBody(){
  let h = '';
  h += at(20, 76, ic('chevronLeft',24));
  h += `<div class="a pf" style="left:52px;top:76px;width:336px;text-align:center">Negroni</div>`;
  h += photo('negroni', 24, 122, 392, 490);
  h += wash(24, 636, 392, 80);
  h += `<div class="a body" style="left:40px;top:652px;width:360px">Leo’s recipe, in his kitchen. Equal parts, stirred long.</div>`;
  /* the row: 56 tall from y 732, a person glyph, the words, who is tagged, a chevron */
  h += at(24, 748, ic('profile',24));
  h += at(60, 748, '<span class="body b5">Tag people</span>');
  h += `<div class="a body muted ell" style="left:180px;top:748px;width:208px;text-align:right">ana and leo</div>`;
  h += at(396, 750, ic('chevronRight',20,'var(--muted)'));
  h += `<div class="key ink" style="left:24px;top:818px;width:392px;height:52px">Post</div>`;
  h += `<div class="a body b5" style="left:24px;top:880px;width:392px;text-align:center">Save to Dex only</div>`;
  return h + statusBar() + homeInd();
}

frame('compose', '1 Post · the Tag people row',
  `Compose, after picking the drink: the photo, the caption, and one new row under it, <b>Tag people</b>. Once someone is picked it says who (“ana and leo”, “ana and 2 others”). Tags go with Post only, like the song. Shown only signed in, for a catalogue drink, once 024 is live. On a re-post of a drink already posted, the row starts with the post’s tags.`,
  composeBody());

/* ---------- the picker: a page sheet over compose ---------- */

function wheel(x, items, sel, w){
  let h = '';
  items.forEach((t, i) => {
    const d = i - sel, y = 690 + d*34;
    if (Math.abs(d) > 2) return;
    const op = [1, .62, .38, .2][Math.abs(d)], sc = [1, .94, .86, .76][Math.abs(d)];
    h += `<div class="a" style="left:${x}px;top:${y-12}px;width:${w}px;text-align:center;font:400 ${Math.round(22*sc)}px/24px Inter;color:rgba(10,10,10,${op});z-index:37">${t}</div>`;
  });
  return h;
}
function timeSheet(){
  const top = 520;
  let h = `<div class="scrim"></div><div class="sheet" style="top:${top}px"></div>` + grab(top+8);
  h += `<div class="a body b6" style="left:0;top:${top+28}px;width:440px;text-align:center;z-index:36">Time</div>`;
  h += `<div class="a" style="left:40px;top:672px;width:360px;height:36px;border-radius:8px;background:#EDEDF0;z-index:36"></div>`;
  h += wheel(118, ['3','4','5','6','7','8','9'], 3, 60) + wheel(196, ['57','58','59','00','01','02','03'], 3, 60) + wheel(282, ['AM','PM'], 1, 60);
  h += `<div class="a small muted" style="left:24px;top:${top+272}px;width:392px;text-align:center;z-index:36">Your idea comes once a day, at this time.</div>`;
  h += `<div class="key ink" style="left:24px;top:${top+310}px;width:392px;height:52px;z-index:36">Done</div>`;
  return h;
}

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=780, height=1688" />
<title>Sipply curtain transition</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:Inter;src:url(assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}
/*
 * "Hairline curtain" (v4.6, 23 Oct 2026). The phone is drawn in points
 * (390 x 844, iPhone 15/16) and zoomed 2x onto the 780 x 1688 canvas.
 * Tokens as src/constants/theme.ts has them; Campari is the only colour.
 */
:root{
  --page:#FFFFFF; --wash:#F5F5F5; --line:#E3E3E3; --hair:#D6D6D6; --rule:#C4C4C4;
  --control:#8A8A8A; --muted:#5C5C5C; --ink:#0A0A0A; --photoEdge:rgba(10,10,10,.07);
  --t1:#262626; --t2:#3D3D3D; --t3:#5C5C5C; --acc:#D0102C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;background:#FFFFFF}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}
b{font-weight:600}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#FFFFFF}
#phone{position:absolute;left:0;top:0;width:390px;height:844px;zoom:2;overflow:hidden;background:var(--page)}
.a{position:absolute}
.circle{border-radius:50%}
.small{font:400 13px/18px Inter}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print{position:absolute;overflow:hidden;background:var(--wash);border-radius:2px}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);border-radius:2px;pointer-events:none}

/* layers, bottom to top: Home, the veil, the curtains, the flying wordmark, the film's still, the status bar */
#home{position:absolute;left:0;top:0;width:390px;height:844px;background:var(--page)}
#overlay{position:absolute;inset:0}
/* v2: a white veil under the halves, so the slit opens onto white and Home develops in it instead of a red slab */
#veil{position:absolute;inset:0;background:var(--page)}
/* v2: seam 528 (centre + 106): the gap under the wordmark (13.3pt) is then 3pt x 1/0.2265, so mark + gap scale as one rigid group */
#curtTop{position:absolute;left:0;top:0;width:390px;height:528.5px;background:var(--page)}
#curtBot{position:absolute;left:0;top:528.5px;width:390px;height:316px;background:var(--page)}
/* the pen's last stroke IS the two halves' 0.5pt edges, stacked into 1pt; it draws out from under the drip's bead (x 285.2) */
#edgeTop{position:absolute;left:0;bottom:0;width:390px;height:.5px;background:var(--acc);transform-origin:285.2px 50%}
#edgeBot{position:absolute;left:0;top:0;width:390px;height:.5px;background:var(--acc);transform-origin:285.2px 50%}
/* the wordmark at the film's end scale: its 462.97 x 285.52 box at 0.64933 pt per unit, centred on the screen */
#fly{position:absolute;left:44.689px;top:329.303px;width:300.621px;height:185.397px;transform-origin:0 0}
#fly img{display:block;width:100%;height:100%}
/* the real film's last frame, drawn as VideoIntro draws the clip (220/483 pt per film px, centred) */
#film{position:absolute;left:-50.963px;top:-15.267px;width:491.925px;height:874.534px}
#film img{display:block;width:100%;height:100%}
/* system chrome: the island is hardware and is always there; the clock and icons are the status bar */
#island{position:absolute;left:132px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
#sbar{position:absolute;left:0;top:0;width:390px;height:59px;opacity:0}
#sbar .t{position:absolute;left:51px;top:18px;font:600 17px/22px Inter;letter-spacing:-.2px}
#sbar .r{position:absolute;right:28px;top:22px;display:flex;gap:6px;align-items:center}
.homeInd{position:absolute;left:125px;top:830px;width:140px;height:5px;border-radius:3px;background:var(--ink)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="780" data-height="1688" data-duration="1.72">
  <div id="stage" class="clip" data-start="0" data-duration="1.72" data-track-index="0">
    <div id="phone">
      <div id="home" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="overlay" data-layout-allow-overflow>
        <div id="veil"></div>
        <div id="curtTop"><div id="edgeTop"></div></div>
        <div id="curtBot"><div id="edgeBot"></div></div>
        <div id="fly"><img src="assets/wordmark.svg" alt=""></div>
      </div>
      <div id="film"><img src="assets/film-end.png" alt=""></div>
      <div id="sbar"><span class="t">9:41</span><span class="r">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#0A0A0A"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#0A0A0A"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3ZM8 9.3l1.9-1.7a2.9 2.9 0 0 0-3.8 0Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0A0A0A" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#0A0A0A"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#0A0A0A" fill-opacity=".4"/></svg></span></div>
      <div id="island"></div>
    </div>
  </div>
</div>
<script>
(function () {
  /* ---------- Home at 390 x 844, ported from the v4.4 campari mock (specs/v4.5-logo/scribble/home) ---------- */
  var IMG = function (id) { return 'assets/drinks/' + id + '.webp'; };
  var OUT = {
    home:'<path d="M3.2 10.4 12 3.4l8.8 7"/><path d="M5.4 9.3V19.4a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6V9.3"/><path d="M9.6 21V14.9h4.8V21"/>',
    dex:'<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
    plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
    heart:'<path d="M12 20.3 4.9 13.4a4.3 4.3 0 0 1 0-6.2 4.5 4.5 0 0 1 6.3 0l.8.8.8-.8a4.5 4.5 0 0 1 6.3 0 4.3 4.3 0 0 1 0 6.2z"/>',
    send:'<path d="M2.9 10.9 21.1 4.9 9.1 13.1z"/><path d="M9.1 13.1 21.1 4.9 12.6 19.1z"/>',
    bookmark:'<path d="M6.4 4.6h11.2v15.8L12 16.3l-5.6 4.1z"/>',
    create:'<rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4"/><path d="M12 8v8"/><path d="M8 12h8"/>'
  };
  var SOLID = {
    home:'<path fill-rule="evenodd" d="M12 2.7a1.4 1.4 0 0 1 .9.3l8.3 6.6a1.4 1.4 0 0 1 .5 1.1v8.7a2.2 2.2 0 0 1-2.2 2.2h-4.6v-5.7a1 1 0 0 0-1-1h-3.8a1 1 0 0 0-1 1v5.7H4.5a2.2 2.2 0 0 1-2.2-2.2v-8.7a1.4 1.4 0 0 1 .5-1.1l8.3-6.6a1.4 1.4 0 0 1 .9-.3z"/>',
    heart:'<path d="M12 20.9a1 1 0 0 1-.68-.27l-6.9-6.7a5.1 5.1 0 0 1 0-7.4 5.4 5.4 0 0 1 7.58 0 5.4 5.4 0 0 1 7.58 0 5.1 5.1 0 0 1 0 7.4l-6.9 6.7a1 1 0 0 1-.68.27z"/>'
  };
  function ic(name, size, color, sw, solid) {
    size = size || 24; color = color || 'var(--ink)'; sw = sw || 1.6;
    if (name === 'more') return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '"><circle cx="5.4" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.6" cy="12" r="1.7"/></svg>';
    if (solid && SOLID[name]) return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '">' + SOLID[name] + '</svg>';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + OUT[name] + '</svg>';
  }
  function at(x, y, inner, st) { return '<div class="a" style="left:' + x + 'px;top:' + y + 'px;' + (st || '') + '">' + inner + '</div>'; }
  var PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6z"/>';
  function av(x, y, d, tone) { return '<div class="a circle" style="left:' + x + 'px;top:' + y + 'px;width:' + d + 'px;height:' + d + 'px;background:var(--' + tone + ');display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><svg width="' + Math.round(d * .86) + '" height="' + Math.round(d * .86) + '" viewBox="0 0 24 24" fill="#FFFFFF">' + PERSON + '</svg></div>'; }
  var P = { me:{u:'nico.pours',tone:'t3'}, ana:{u:'ana',tone:'t2'}, leo:{u:'leo',tone:'t1'}, maya:{u:'maya.pours',tone:'t1'}, ines:{u:'ines.ag',tone:'t2'}, theo:{u:'theo_stirs',tone:'t1'}, sam:{u:'sam.ortega',tone:'t3'} };

  var h = '';
  /* the tray: content starts at insets.top 59 + the bar's 45 */
  var S = [['me',null,true],['ana','daiquiri',false],['leo','negroni',false],['ines','paloma',false],['theo','paper-plane',true]];
  S.forEach(function (s, i) {
    var k = s[0], img = s[1], seen = s[2], x = 12 + i * 80, y = 112, p = P[k];
    if (k === 'me') {
      h += av(x + 5, y + 5, 56, p.tone);
      h += '<div class="a circle" style="left:' + (x + 41) + 'px;top:' + (y + 41) + 'px;width:22px;height:22px;background:var(--ink);box-shadow:0 0 0 3px var(--page);display:flex;align-items:center;justify-content:center">' + ic('plus', 14, '#FFFFFF', 2.4) + '</div>';
    } else {
      h += '<div class="a circle" style="left:' + x + 'px;top:' + y + 'px;width:66px;height:66px;box-shadow:inset 0 0 0 ' + (seen ? '1px var(--rule)' : '2px var(--ink)') + '"></div>';
      h += '<div class="a circle" style="left:' + (x + 5) + 'px;top:' + (y + 5) + 'px;width:56px;height:56px;overflow:hidden;background:var(--wash)"><img src="' + IMG(img) + '" style="position:absolute;left:-14px;top:-12px;width:84px;height:84px;object-fit:cover"></div>';
    }
    h += '<div class="a small ell" style="left:' + (x - 7) + 'px;top:' + (y + 70) + 'px;width:80px;text-align:center;color:' + (k === 'me' || seen ? 'var(--muted)' : 'var(--ink)') + '">' + (k === 'me' ? 'Your story' : p.u) + '</div>';
  });
  /* the post */
  var y0 = 208;
  h += '<div class="a circle" style="left:12px;top:' + (y0 + 6) + 'px;width:40px;height:40px;box-shadow:inset 0 0 0 2px var(--ink)"></div>';
  h += av(16, y0 + 10, 32, 't1');
  h += '<div class="a small" style="left:60px;top:' + (y0 + 8) + 'px;width:280px;white-space:nowrap"><b>maya.pours</b> with <b>ana</b> and <b>leo</b></div>';
  h += at(60, y0 + 26, '<span style="font:700 13px/18px Playfair">Negroni</span>');
  h += at(350, y0 + 14, ic('more', 24));
  h += '<div class="print" style="left:0;top:' + (y0 + 52) + 'px;width:390px;height:390px;border-radius:0"><img src="' + IMG('negroni') + '" style="transform:scale(1.1)"></div>';
  var ay = y0 + 52 + 390;
  h += at(16, ay + 9, ic('heart', 26, 'var(--ink)', 1.6, true)) + at(60, ay + 9, ic('send', 26)) + at(348, ay + 9, ic('bookmark', 26));
  h += '<div class="a circle" style="left:16px;top:' + (ay + 44) + 'px;width:22px;height:22px;background:var(--page);padding:2px">' + av(2, 2, 18, 't2') + '</div>';
  h += at(46, ay + 46, '<span class="small">Liked by <b>ines.ag</b> and <b>23 others</b></span>');
  h += '<div class="a small" style="left:16px;top:' + (ay + 70) + 'px;width:358px"><b>maya.pours</b> Leo’s recipe, in his kitchen. Equal parts, stirred long.</div>';
  /* the status strip and the bar (HomeChrome at insets.top 59): wordmark box 42 tall at (13.7, 61) */
  h += '<div class="a" style="left:0;top:0;width:390px;height:104px;background:var(--page)"></div>';
  h += at(13.7, 61, '<img src="assets/wordmark.svg" alt="" style="display:block;height:42px;width:68.104px">');
  h += at(304, 68, ic('create', 26)) + at(348, 68, ic('heart', 26));
  h += '<div class="a circle" style="left:363px;top:66px;width:12px;height:12px;background:var(--acc);border:2px solid var(--page)"></div>';
  /* the tab bar (FloatingTabBar): five 78pt slots, + in Campari, the 18 x 2 INK line under Home (as shipped; v4.4's red line is retired) */
  var cy = 785.5, xs = { home:39, dex:117, bookmark:273, profile:351 };
  h += '<div class="a" style="left:0;top:761px;width:390px;height:83px;background:var(--page)"></div>';
  h += at(xs.home - 13, cy - 13, ic('home', 26, 'var(--ink)', 1.6, true));
  h += at(xs.dex - 13, cy - 13, ic('dex', 26, 'var(--muted)'));
  h += at(xs.bookmark - 13, cy - 13, ic('bookmark', 26, 'var(--muted)'));
  h += '<div class="a" style="left:169px;top:' + (cy - 19) + 'px;width:52px;height:38px;border-radius:4px;background:var(--acc);display:flex;align-items:center;justify-content:center">' + ic('plus', 22, '#FFFFFF', 2) + '</div>';
  h += av(xs.profile - 13, cy - 13, 26, 't3');
  h += '<div class="a" style="left:' + (xs.home - 9) + 'px;top:804px;width:18px;height:2px;background:var(--ink)"></div>';
  h += '<div class="homeInd"></div>';
  document.getElementById('home').innerHTML = h;

  /* ---------- the transition ---------- */
  /* cubic-bezier, solved the way RN's Easing.bezier solves it, so the native build can use the same four numbers */
  function bezier(x1, y1, x2, y2) {
    function a(p1, p2) { return 1 - 3 * p2 + 3 * p1; }
    function b(p1, p2) { return 3 * p2 - 6 * p1; }
    function c(p1) { return 3 * p1; }
    function at(t, p1, p2) { return ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t; }
    function slope(t, p1, p2) { return 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1); }
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      var t = x;
      for (var i = 0; i < 8; i++) { var s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (at(t, x1, x2) - x) / s; }
      var lo = 0, hi = 1;
      if (Math.abs(at(t, x1, x2) - x) > 1e-6) { t = x; for (var j = 0; j < 40; j++) { var v = at(t, x1, x2); if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; } }
      return at(t, y1, y2);
    };
  }
  var PEN = bezier(0.25, 0, 0.1, 1);     // the stroke: leaves the bead already moving, eases into both edges
  var PART = bezier(0.4, 0, 0.1, 1);     // the split: a soft start (no flash), then a shorter, confident settle

  var T0 = 0.40;          // the film's held end frame before it
  var DRAW = 0.16;        // the stroke, outward from under the bead
  var LEAD = 0.10;        // the split starts while the stroke is still reaching the edges: nothing waits
  var SPLIT = 0.56;       // the halves part, the wordmark docks
  var FADE = 0.16;        // the overlay dissolves onto Home's own bar
  var TRAVEL = 422;       // seam 528 -> the bar's foot at 106
  var tS = T0 + LEAD;     // 0.50
  var tF = tS + SPLIT;    // 1.06: the dissolve starts once the wordmark has docked, so it fades over its exact twin

  var tl = gsap.timeline({ paused: true });
  // 0. the film's still hands over to the drawn wordmark (same path, same place)
  tl.set('#film', { opacity: 0 }, T0);
  // the status bar fades in as the exit starts (expo-status-bar, animated)
  tl.fromTo('#sbar', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out', immediateRender: false }, T0);
  // 1. the pen's last stroke: the halves' two 0.5pt edges, stacked, drawn out both ways from under the bead
  tl.fromTo(['#edgeTop', '#edgeBot'], { scaleX: 0 }, { scaleX: 1, duration: DRAW, ease: PEN, immediateRender: true }, T0);
  // 2. the split, from inside the stroke's last 60 ms; both halves travel 422pt, so they read as one split
  tl.fromTo('#curtTop', { y: 0 }, { y: -TRAVEL, duration: SPLIT, ease: PART, immediateRender: false }, tS);
  tl.fromTo('#curtBot', { y: 0 }, { y: TRAVEL, duration: SPLIT, ease: PART, immediateRender: false }, tS);
  tl.fromTo('#fly', { x: 0, y: 0, scale: 1 }, { x: -30.989, y: -268.303, scale: 0.226541, duration: SPLIT, ease: PART, immediateRender: false }, tS);
  // the slit opens onto white: Home develops through the veil instead of a red slab appearing in a letterbox
  tl.fromTo('#veil', { opacity: 1 }, { opacity: 0, duration: 0.32, ease: 'power1.inOut', immediateRender: false }, tS + 0.04);
  // the lower line never crosses the photo or the caption: gone within the split's first 80 ms (still over the veil)
  tl.fromTo('#edgeBot', { opacity: 1 }, { opacity: 0, duration: 0.08, ease: 'none', immediateRender: false }, tS);
  // the upper line carries the mark through the veil, then lets go as Home clears (gone by +400 ms): never left on text or at the bar's foot
  tl.fromTo('#edgeTop', { opacity: 1 }, { opacity: 0, duration: 0.22, ease: 'power1.inOut', immediateRender: false }, tS + 0.08);
  // 3. the top half has become Home's bar; the overlay dissolves onto the real one
  tl.fromTo('#overlay', { opacity: 1 }, { opacity: 0, duration: FADE, ease: 'power1.inOut', immediateRender: false }, tF);
  tl.set('#overlay', { opacity: 0 }, 1.72);
  window.__timelines['main'] = tl;
})();
</script>
</body>
</html>

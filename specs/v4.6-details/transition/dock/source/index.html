<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=780, height=1688" />
    <title>Sipply intro to Home: Dock</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: Inter; src: url(assets/InterLatin_400Regular.ttf); font-weight: 400; }
      @font-face { font-family: Inter; src: url(assets/InterLatin_500Medium.ttf); font-weight: 500; }
      @font-face { font-family: Inter; src: url(assets/InterLatin_600SemiBold.ttf); font-weight: 600; }
      @font-face { font-family: Playfair; src: url(assets/PlayfairDisplayLatin_700Bold.ttf); font-weight: 700; }
      :root {
        --page: #ffffff; --wash: #f5f5f5; --rule: #c4c4c4; --muted: #5c5c5c; --ink: #0a0a0a;
        --photoEdge: rgba(10, 10, 10, 0.07); --t1: #262626; --t2: #3d3d3d; --t3: #5c5c5c;
        --acc: #d0102c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { margin: 0; background: #ffffff; }
      body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
      svg { display: block; overflow: visible; }
      b { font-weight: 600; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
      #stage { position: absolute; inset: 0; }
      /* the phone in points, drawn at 2x */
      #phone { position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; background: var(--page); transform: scale(2); transform-origin: 0 0; }
      .layer { position: absolute; left: 0; top: 0; width: 390px; height: 844px; }
      .a { position: absolute; }
      .circle { border-radius: 50%; }
      .small { font: 400 13px/18px Inter; }
      .muted { color: var(--muted); }
      .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .print { position: absolute; overflow: hidden; background: var(--wash); }
      .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .print::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px var(--photoEdge); pointer-events: none; }
      #film { position: absolute; display: block; }
      #fly { position: absolute; display: block; transform-origin: 0 0; }
      #fly img, #homeWm img { display: block; width: 100%; height: 100%; }
      #homeWm { position: absolute; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="780" data-height="1688" data-duration="1.78">
      <div id="stage" class="clip" data-start="0" data-duration="1.78" data-track-index="0">
        <div id="phone">
          <div id="home" class="layer"></div>
          <img id="film" src="assets/film-last.png" alt="" />
          <div id="fly"><img src="assets/wordmark.svg" alt="" /></div>
          <!-- the Dynamic Island is hardware: it is over the film too -->
          <div id="island" style="position:absolute;left:132px;top:11px;width:126px;height:37px;border-radius:19px;background:#000"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        /* ---------------- geometry, in points on a 390 x 844 phone ---------------- */
        var SW = 390, SH = 844;
        /* VideoIntro.tsx: the film is drawn at the splash's scale, 220 pt per 483 film px, centred */
        var FILM_PT = 220 / 483;
        var filmW = 1080 * FILM_PT, filmH = 1920 * FILM_PT;
        var filmL = (SW - filmW) / 2, filmT = (SH - filmH) / 2;
        /* d-the-tag/tools/gen.cjs: the wordmark's viewBox, 660 film px wide, centred on film (540, 960) */
        var VB_W = 462.97, VB_H = 285.52, VB_X = -15.68;
        var srcW = 660 * FILM_PT, srcH = srcW * VB_H / VB_W;
        var srcL = SW / 2 - srcW / 2, srcT = SH / 2 - srcH / 2;
        /* HomeChrome.tsx: 42 pt tall, `lead` (box out by the s's tail), on the 44 row's foot under the status bar */
        var STATUS = 62, ROW = 44, WM_H = 42;
        var dstH = WM_H, dstW = WM_H * VB_W / VB_H;
        var dstL = 16 + (VB_X / VB_H) * WM_H, dstT = STATUS + ROW - WM_H;
        var K = dstW / srcW;

        var film = document.getElementById("film");
        film.style.cssText = "left:" + filmL + "px;top:" + filmT + "px;width:" + filmW + "px;height:" + filmH + "px";
        var fly = document.getElementById("fly");
        fly.style.left = srcL + "px"; fly.style.top = srcT + "px";
        fly.style.width = srcW + "px"; fly.style.height = srcH + "px";

        /* ---------------- Home, as the v4.4 campari mock draws it, at 390 wide ---------------- */
        var OUT = {
          dex: '<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
          plus: '<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
          heart: '<path d="M12 20.3 4.9 13.4a4.3 4.3 0 0 1 0-6.2 4.5 4.5 0 0 1 6.3 0l.8.8.8-.8a4.5 4.5 0 0 1 6.3 0 4.3 4.3 0 0 1 0 6.2z"/>',
          send: '<path d="M2.9 10.9 21.1 4.9 9.1 13.1z"/><path d="M9.1 13.1 21.1 4.9 12.6 19.1z"/>',
          bookmark: '<path d="M6.4 4.6h11.2v15.8L12 16.3l-5.6 4.1z"/>',
          create: '<rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4"/><path d="M12 8v8"/><path d="M8 12h8"/>'
        };
        var SOLID = {
          home: '<path fill-rule="evenodd" d="M12 2.7a1.4 1.4 0 0 1 .9.3l8.3 6.6a1.4 1.4 0 0 1 .5 1.1v8.7a2.2 2.2 0 0 1-2.2 2.2h-4.6v-5.7a1 1 0 0 0-1-1h-3.8a1 1 0 0 0-1 1v5.7H4.5a2.2 2.2 0 0 1-2.2-2.2v-8.7a1.4 1.4 0 0 1 .5-1.1l8.3-6.6a1.4 1.4 0 0 1 .9-.3z"/>',
          heart: '<path d="M12 20.9a1 1 0 0 1-.68-.27l-6.9-6.7a5.1 5.1 0 0 1 0-7.4 5.4 5.4 0 0 1 7.58 0 5.4 5.4 0 0 1 7.58 0 5.1 5.1 0 0 1 0 7.4l-6.9 6.7a1 1 0 0 1-.68.27z"/>'
        };
        function ic(name, size, color, sw, solid) {
          size = size || 24; color = color || "var(--ink)"; sw = sw || 1.6;
          if (name === "more") return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '"><circle cx="5.4" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.6" cy="12" r="1.7"/></svg>';
          if (solid && SOLID[name]) return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '">' + SOLID[name] + "</svg>";
          return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + OUT[name] + "</svg>";
        }
        function at(x, y, inner, st) { return '<div class="a" style="left:' + x + "px;top:" + y + "px;" + (st || "") + '">' + inner + "</div>"; }
        var PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6z"/>';
        function av(x, y, d, tone) {
          return '<div class="a circle" style="left:' + x + "px;top:" + y + "px;width:" + d + "px;height:" + d + "px;background:var(--" + tone + ');display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><svg width="' + Math.round(d * 0.86) + '" height="' + Math.round(d * 0.86) + '" viewBox="0 0 24 24" fill="#FFFFFF">' + PERSON + "</svg></div>";
        }
        var P = { me: { u: "nico.pours", tone: "t3" }, ana: { u: "ana", tone: "t2" }, leo: { u: "leo", tone: "t1" }, maya: { u: "maya.pours", tone: "t1" }, ines: { u: "ines.ag", tone: "t2" }, theo: { u: "theo_stirs", tone: "t1" }, sam: { u: "sam.ortega", tone: "t3" } };

        function statusBar() {
          return '<div class="a" style="left:0;top:0;width:390px;height:62px;background:var(--page)">' +
            '<span class="a" style="left:48px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px">9:41</span>' +
            '<span class="a" style="right:26px;top:24px;display:flex;gap:6px;align-items:center">' +
            '<svg width="18" height="12" viewBox="0 0 18 12" fill="#0A0A0A"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>' +
            '<svg width="16" height="12" viewBox="0 0 16 12" fill="#0A0A0A"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3ZM8 9.3l1.9-1.7a2.9 2.9 0 0 0-3.8 0Z"/></svg>' +
            '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0A0A0A" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#0A0A0A"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#0A0A0A" fill-opacity=".4"/></svg></span></div>';
        }
        /* the bar's keys: create's box 295-339, the heart's 339-383 (ROW_END 7), glyphs 26 centred */
        function barKeys() {
          return at(304, 71, ic("create", 26)) + at(348, 71, ic("heart", 26));
        }
        function dot() {
          return '<div id="dot" class="a circle" style="left:363px;top:69px;width:12px;height:12px;background:var(--acc);border:2px solid var(--page)"></div>';
        }
        function tray(y0) {
          var S = [["me", null, true], ["ana", "daiquiri", false], ["leo", "negroni", false], ["ines", "paloma", false], ["theo", "paper-plane", true]];
          var h = "";
          S.forEach(function (s, i) {
            var k = s[0], img = s[1], seen = s[2], x = 12 + i * 80, y = y0 + 8, p = P[k];
            if (k === "me") {
              h += av(x + 5, y + 5, 56, p.tone);
              h += '<div class="a circle" style="left:' + (x + 41) + "px;top:" + (y + 41) + 'px;width:22px;height:22px;background:var(--ink);box-shadow:0 0 0 3px var(--page);display:flex;align-items:center;justify-content:center">' + ic("plus", 14, "#FFFFFF", 2.4) + "</div>";
            } else {
              h += '<div class="a circle" style="left:' + x + "px;top:" + y + "px;width:66px;height:66px;box-shadow:inset 0 0 0 " + (seen ? "1px var(--rule)" : "2px var(--ink)") + '"></div>';
              h += '<div class="a circle" style="left:' + (x + 5) + "px;top:" + (y + 5) + 'px;width:56px;height:56px;overflow:hidden;background:var(--wash)"><img src="assets/' + img + '.webp" style="position:absolute;left:-14px;top:-12px;width:84px;height:84px;object-fit:cover"></div>';
            }
            h += '<div class="a small ell" style="left:' + (x - 7) + "px;top:" + (y + 70) + "px;width:80px;text-align:center;color:" + (k === "me" || seen ? "var(--muted)" : "var(--ink)") + '">' + (k === "me" ? "Your story" : p.u) + "</div>";
          });
          return h;
        }
        function post(y0) {
          var h = "";
          h += '<div class="a circle" style="left:12px;top:' + (y0 + 6) + 'px;width:40px;height:40px;box-shadow:inset 0 0 0 2px var(--ink)"></div>';
          h += av(16, y0 + 10, 32, "t1");
          h += '<div class="a small" style="left:60px;top:' + (y0 + 8) + 'px;width:280px;white-space:nowrap"><b>maya.pours</b> with <b>ana</b> and <b>leo</b></div>';
          h += at(60, y0 + 26, '<span style="font:700 13px/18px Playfair">Negroni</span>');
          h += at(350, y0 + 14, ic("more", 24));
          h += '<div class="print" style="left:0;top:' + (y0 + 52) + 'px;width:390px;height:390px"><img src="assets/negroni.webp" style="transform:scale(1.1)"></div>';
          var ay = y0 + 52 + 390;
          h += at(16, ay + 9, ic("heart", 26, "var(--ink)", 1.6, true)) + at(60, ay + 9, ic("send", 26)) + at(348, ay + 9, ic("bookmark", 26));
          h += '<div class="a circle" style="left:16px;top:' + (ay + 44) + 'px;width:22px;height:22px;background:var(--page);padding:2px">' + av(2, 2, 18, "t2") + "</div>";
          h += at(46, ay + 46, '<span class="small">Liked by <b>ines.ag</b> and <b>23 others</b></span>');
          h += '<div class="a small" style="left:16px;top:' + (ay + 70) + 'px;width:358px"><b>maya.pours</b> Leo’s recipe, in his kitchen. Equal parts, stirred long.</div>';
          return h;
        }
        /* FloatingTabBar: five slots across 390 (39 · 117 · 195 · 273 · 351), 83 tall from 761 */
        function tabs() {
          var cy = 785.5, h = '<div class="a" style="left:0;top:761px;width:390px;height:83px;background:var(--page)"></div>';
          h += at(26, cy - 13, ic("home", 26, "var(--ink)", 1.6, true));
          h += at(104, cy - 13, ic("dex", 26, "var(--muted)"));
          h += at(260, cy - 13, ic("bookmark", 26, "var(--muted)"));
          h += '<div class="a" style="left:169px;top:' + (cy - 19) + 'px;width:52px;height:38px;border-radius:4px;background:var(--acc);display:flex;align-items:center;justify-content:center">' + ic("plus", 22, "#FFFFFF", 2) + "</div>";
          h += av(338, cy - 13, 26, "t3");
          /* the active line is INK, as FloatingTabBar ships it (theme.ts §1.3: the accent never says where you are) */
          h += '<div class="a" style="left:30px;top:804px;width:18px;height:2px;background:var(--ink)"></div>';
          h += '<div class="a" style="left:128px;top:830px;width:134px;height:5px;border-radius:3px;background:var(--ink)"></div>';
          return h;
        }
        /* ---------------- details/pen mark 3, the drawn rule (penPath, cr, ruleD copied from details/pen/mock) ---------------- */
        var f2 = function (v) { return Math.round(v * 100) / 100; };
        function penPath(sample, width, n) {
          n = n || 72; var P = [], L = [], R = [];
          for (var i = 0; i < n; i++) P.push(sample(i / (n - 1)));
          for (var i2 = 0; i2 < n; i2++) {
            var a = P[Math.max(0, i2 - 1)], b = P[Math.min(n - 1, i2 + 1)];
            var dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
            var w = width(i2 / (n - 1)) / 2;
            L.push([P[i2][0] - dy * w, P[i2][1] + dx * w]); R.push([P[i2][0] + dy * w, P[i2][1] - dx * w]);
          }
          var w0 = width(0) / 2, w1 = width(1) / 2, d = "M" + f2(L[0][0]) + " " + f2(L[0][1]);
          for (var i3 = 1; i3 < n; i3++) d += "L" + f2(L[i3][0]) + " " + f2(L[i3][1]);
          d += "A" + f2(w1) + " " + f2(w1) + " 0 0 0 " + f2(R[n - 1][0]) + " " + f2(R[n - 1][1]);
          for (var i4 = n - 2; i4 >= 0; i4--) d += "L" + f2(R[i4][0]) + " " + f2(R[i4][1]);
          return d + "A" + f2(w0) + " " + f2(w0) + " 0 0 0 " + f2(L[0][0]) + " " + f2(L[0][1]) + "Z";
        }
        function cr(pts) {
          return function (t) {
            var n = pts.length - 1, u = Math.min(t * n, n - 1e-6), i = Math.floor(u), f = u - i;
            var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
            function c(k) { return .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * f + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * f * f + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * f * f * f); }
            return [c(0), c(1)];
          };
        }
        function ruleD(Lw) {
          return penPath(cr([[0, 2.9], [Lw * .25, 2.4], [Lw * .55, 2.6], [Lw * .82, 2.3], [Lw * .95, 2.0], [Lw, 0.9]]),
            function (t) { return 0.25 + (0.9 - 0.25) * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.15)), .6); }, 160);
        }
        var RULE_X = 24, RULE_W = SW - 48, RULE_Y = 205;
        /* the window: an overflow-hidden box slid left while its content slides right by the same amount (transforms only, as in RN) */
        var penRule = '<div id="penWin" class="a" style="left:' + RULE_X + 'px;top:' + RULE_Y + 'px;width:' + RULE_W + 'px;height:4px;overflow:hidden">' +
          '<div id="penInk" style="width:' + RULE_W + 'px;height:4px"><svg width="' + RULE_W + '" height="4" viewBox="0 0 ' + RULE_W + ' 4"><path fill="var(--acc)" d="' + ruleD(RULE_W) + '"/></svg></div></div>';

        document.getElementById("home").innerHTML =
          '<div id="gContent" class="layer">' + post(211) + '<div id="gTray" class="layer">' + tray(107) + penRule + "</div></div>" +
          '<div id="gTabs" class="layer">' + tabs() + "</div>" +
          '<div id="gBar" class="layer">' + barKeys() + dot() + "</div>" +
          '<div id="gSb" class="layer">' + statusBar() + "</div>" +
          '<div id="homeWm" style="left:' + dstL + "px;top:" + dstT + "px;width:" + dstW + "px;height:" + dstH + 'px"><img src="assets/wordmark.svg" alt=""></div>';

        /* ---------------- easing: the same beziers Reanimated's Easing.bezier takes ---------------- */
        function bezier(x1, y1, x2, y2) {
          function A(a, b) { return 1 - 3 * b + 3 * a; }
          function B(a, b) { return 3 * b - 6 * a; }
          function C(a) { return 3 * a; }
          function calc(t, a, b) { return ((A(a, b) * t + B(a, b)) * t + C(a)) * t; }
          function slope(t, a, b) { return 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a); }
          return function (x) {
            if (x <= 0) return 0; if (x >= 1) return 1;
            var t = x;
            for (var i = 0; i < 8; i++) { var s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (calc(t, x1, x2) - x) / s; }
            var lo = 0, hi = 1;
            for (var j = 0; j < 30 && Math.abs(calc(t, x1, x2) - x) > 1e-7; j++) { if (calc(t, x1, x2) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
            return calc(t, y1, y2);
          };
        }
        var DOCK = bezier(0.3, 0, 0, 1);       /* v2: a softer lift off the still frame (v1: 0.2), then the same long settle */
        var RISE = bezier(0.22, 1, 0.36, 1);   /* plain ease-out (quint-like) for everything that rises */
        var DRAW = function (x) { return 1 - Math.pow(1 - x, 3); };   /* details/pen: the draw-on is an ease-out (Easing.out(cubic)) */
        var LIN = function (x) { return x; };

        /* ---------------- the timeline (v2) ---------------- */
        var T0 = 0.4;                  /* 0.4 s of the film's held end frame first */
        var MS = function (ms) { return T0 + ms / 1000; };
        var DOCK_MS = 600, HAND = 600;
        var tl = gsap.timeline({ paused: true });
        gsap.set("#homeWm", { opacity: 0 });
        gsap.set(["#gBar", "#gContent", "#gTray", "#gTabs", "#gSb"], { opacity: 0 });
        gsap.set("#dot", { opacity: 0, scale: 0.4 });
        gsap.set("#penWin", { x: -RULE_W });
        gsap.set("#penInk", { x: RULE_W });

        /* a rise group: translate over the whole window on RISE; opacity much sooner, so nothing sits washed out */
        function rise(sel, start, dur, dy, opMs, opEase) {
          tl.fromTo(sel, { y: dy }, { y: 0, duration: dur / 1000, ease: RISE }, MS(start));
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: opMs / 1000, ease: opEase }, MS(start));
        }

        /* 0: the vector wordmark replaces the film's frame on the same pixels; the film's white becomes the page's */
        tl.set("#film", { opacity: 0 }, T0);
        tl.fromTo("#fly", { x: 0, y: 0, scale: 1 }, { x: dstL - srcL, y: dstT - srcT, scale: K, duration: DOCK_MS / 1000, ease: DOCK }, T0);
        /* the status bar returns as the dissolve starts (VideoIntro: hidden={!leaving}) */
        tl.fromTo("#gSb", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "none" }, T0);
        /* group 1, the chrome: the bar's keys and the tab bar, together */
        /* its opacity cuts in over 64 ms (4 frames, linear), because it holds the red + key, which must never sit pink */
        rise("#gBar", 160, 360, 8, 64, LIN);
        rise("#gTabs", 160, 360, 8, 64, LIN);
        /* group 2, the list (wraps the FlatList): the feed rises up behind the leaving wordmark. It is clear of it from 240 ms */
        /* (wordmark foot y 194, post header 233). Opacity over its first 30% (132 ms) on RISE, past 0.9 by 50 ms, so the Negroni is never pink */
        rise("#gContent", 240, 440, 16, 132, RISE);
        /* nested inside it, the story tray (TodaysPours in the list header) holds until the wordmark has left its row */
        /* (tried at 240 with the list: the red script sat on Your story and ana from 267 to 367 ms) */
        rise("#gTray", 360, 420, 14, 126, RISE);
        /* the Activity dot, if unread: full red at once (48 ms), growing 0.4 -> 1 */
        tl.fromTo("#dot", { opacity: 0 }, { opacity: 1, duration: 0.048, ease: LIN }, MS(480));
        tl.fromTo("#dot", { scale: 0.4 }, { scale: 1, duration: 0.30, ease: RISE }, MS(480));
        /* hand-off: Home's own wordmark takes over on the same pixels */
        tl.set("#homeWm", { opacity: 1 }, MS(HAND));
        tl.set("#fly", { opacity: 0 }, MS(HAND));
        /* the pen signs the page: the details system's Home mark (pen: the drawn rule under the stories) draws on once, left to right */
        tl.fromTo("#penWin", { x: -RULE_W }, { x: 0, duration: 0.28, ease: DRAW }, MS(560));
        tl.fromTo("#penInk", { x: RULE_W }, { x: 0, duration: 0.28, ease: DRAW }, MS(560));
        tl.set({}, {}, 1.78);
        window.__timelines["main"] = tl;
        window.__dock = { srcL: srcL, srcT: srcT, srcW: srcW, srcH: srcH, dstL: dstL, dstT: dstT, dstW: dstW, dstH: dstH, K: K, filmL: filmL, filmT: filmT, filmW: filmW, filmH: filmH };
      })();
    </script>

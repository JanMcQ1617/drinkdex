<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass back bar</title>
<style>
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}

:root{
  /* theme.ts today, unchanged */
  --paper:#F7F2EA; --sunk:#E9E5DF; --white:#FFFFFF; --line:#D9CFC1; --lineControl:#8A7F74; --lineInk:#2B2322;
  --ink:#2B2322; --muted:#6A6058; --faint:#8A7F74;
  --wine:#5B0F1A; --merlot:#7E2330; --wineSoft:#A85A63;
  --mat:#FBF8F2; --lining:#3E0A12; --cellar:#2F070D;
  --onLining:#E9E5DF; --onLiningMuted:#B8A09B; --onLiningFaint:#A7837F;
  --liningLine:rgba(233,229,223,.16); --liningControl:rgba(233,229,223,.42);
  --matEdge:rgba(14,11,11,.35); --windowEdge:rgba(43,35,34,.16); --slotEdge:rgba(233,229,223,.10);
  --storyRing:#BC6B75; --storyRingSeen:rgba(233,229,223,.30);
  --reelInk:#FFFDF9; --reelInkDim:#A99E94; --reelBar:#2B2322; --reelControlBorder:rgba(255,253,249,.28);
  --scrimMid:rgba(14,11,11,.62); --scrimDeep:rgba(14,11,11,.86); --markerFill:rgba(14,11,11,.78);
  --overlay:rgba(43,35,34,.52);

  /* NEW in v3.3 "brass": the back-bar hardware */
  --brass:#B8924F;        /* rails, keylines, brackets, the gauge fill. UI 3:1 on every dark ground; decorative on paper */
  --brassPlate:#C9A867;   /* the face of an engraved number plate */
  --brassLit:#E8D3A2;     /* 1pt top highlight of a plate or rail */
  --brassShade:#7D5F2C;   /* 1pt foot of a plate or rail; a label's outer edge */
  --brassInk:#7A5820;     /* brass-coloured TEXT on paper, mat, label stock */
  --brassOnDark:#D6B676;  /* brass-coloured TEXT on lining, cellar, walnut, espresso */
  --walnut:#4A3328;       /* the wood: shelves, the counter, the Dex plaque (texture mean #4B372B) */
  --walnutDeep:#2E1F19;   /* a plank's lower edge, the plaque's edge */
  --walnutTop:#6A4C3B;    /* the lit top face of a shelf */
  --onWalnutMuted:#C9B6A8;/* secondary text on walnut */
  --label:#F3E9D2;        /* bottle-label stock */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#151112}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"kern"}
svg{display:block;overflow:visible}

.wall{display:flex;gap:36px;padding:96px 40px 48px;align-items:flex-start;position:relative}
.wall h1{position:absolute;left:40px;top:28px;font:700 30px/36px Playfair;color:#E9E5DF}
.wall h1 small{font:400 15px/20px Inter;color:#B8A09B;margin-left:14px}
figure.cap{width:440px;flex:none}
.legend{position:absolute;right:40px;top:30px;display:flex;gap:14px}
.legend span{display:flex;align-items:center;gap:6px;font:500 12px/16px Inter;color:#B8A09B}
.legend i{width:16px;height:16px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(233,229,223,.2)}
body.solo .legend{display:none}
figure.cap figcaption{font:400 14px/19px Inter;color:#B8A09B;margin-top:14px;min-height:58px}
figure.cap figcaption b{font-weight:600;color:#E9E5DF;margin-right:6px}
body.solo .wall{padding:0;gap:0}
body.solo .wall h1, body.solo figcaption{display:none}
body.solo figure.cap{display:none}
body.solo figure.cap.on{display:block}

.screen{position:relative;width:440px;height:956px;overflow:hidden;background:var(--paper);isolation:isolate;border-radius:0}
.abs,.screen .abs{position:absolute}

/* grounds: grain pre-multiplied to theme.ts opacities (lining .77, paper .35) */
.pap{background:url(img/grain-paper.png) 0 0/128px 128px repeat, var(--paper)}
.lin{background:url(img/grain-lining.png) 0 0/128px 128px repeat, var(--lining)}
.cel{background:url(img/grain-lining.png) 0 0/128px 128px repeat, var(--cellar)}
.wood{background:url(img/walnut.webp) center/cover no-repeat, var(--walnut)}

/* ---------- hardware ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:62px;z-index:50;color:var(--reelInk)}
.sb.dark{color:var(--ink)}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.sb .r{position:absolute;right:30px;top:24px;display:flex;gap:6px;align-items:center}
.hi{position:absolute;bottom:8px;left:153px;width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:60}
.hi.light{background:var(--onLining)}

/* ---------- top bar ---------- */
.bar{position:absolute;left:0;right:0;top:62px;height:44px;z-index:30;color:var(--onLining)}
.bar.ink{color:var(--ink)}
.bar .title{position:absolute;left:100px;right:100px;top:9px;text-align:center;font:600 20px/26px Inter}
.bar .title.md{font:600 17px/22px Inter;top:11px}
.bar .wordmark{position:absolute;left:100px;right:100px;top:4px;text-align:center;font:700 28px/34px Playfair;letter-spacing:.2px}
.gb{position:absolute;top:0;width:44px;height:44px;display:grid;place-items:center}
.gb .dot{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--storyRing);box-shadow:0 0 0 2px var(--lining)}
/* the brass rail: the foot of a solid bar once content runs under it. Replaces the 24pt fade. */
.rail{position:absolute;left:0;right:0;height:3px;z-index:31}
.rail::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--brassLit);opacity:.55}
.rail::after{content:"";position:absolute;left:0;right:0;top:1px;height:1px;background:var(--brass)}
.rail i{position:absolute;left:0;right:0;top:2px;height:1px;background:rgba(14,11,11,.45)}

/* ---------- floating tab bar ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:36px;height:64px;background:var(--reelBar);border-radius:12px;z-index:40;
  box-shadow:0 4px 14px rgba(14,11,11,.30);border:1px solid rgba(255,253,249,.08);display:flex;align-items:center;padding:0 6px}
.tabbar::before{content:"";position:absolute;inset:3px;border:1px solid rgba(184,146,79,.42);border-radius:9px;pointer-events:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--reelInkDim);font:500 11px/14px Inter;position:relative;height:100%;justify-content:center}
.tab.on{color:var(--reelInk);font-weight:600}
.tab.on::before{content:"";position:absolute;top:3px;left:50%;width:28px;margin-left:-14px;height:2px;background:var(--brassLit);border-radius:0 0 1px 1px}
.tab .gbox{width:28px;height:28px;display:grid;place-items:center}
.tab.post .pbtn{width:52px;height:38px;border-radius:8px;background:var(--wine);display:grid;place-items:center;border:1px solid var(--brass);
  box-shadow:inset 0 1px 0 rgba(232,211,162,.25)}
.tab .av{width:24px;height:24px;border-radius:50%;background:var(--merlot);color:var(--onLining);font:600 11px/24px Inter;text-align:center}
.tab.on .av{box-shadow:0 0 0 1.5px var(--reelBar),0 0 0 2.5px var(--reelInk)}

/* ---------- engraved number plate ---------- */
.plate{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:2px;background:var(--brassPlate);
  border-top:1px solid var(--brassLit);border-bottom:1px solid var(--brassShade);
  box-shadow:0 1px 1.5px rgba(14,11,11,.35);
  font:500 11px/14px Inter;letter-spacing:1.2px;color:var(--ink);text-shadow:0 1px 0 rgba(232,211,162,.85);
  font-variant-numeric:tabular-nums;white-space:nowrap;position:relative}
.plate .no{letter-spacing:.2px;margin-right:3px}
.plate.lg{height:22px;padding:0 13px;font-size:12px}
/* screws: only on plates 22pt and taller */
.plate.lg::before,.plate.lg::after{content:"";position:absolute;top:50%;margin-top:-2px;width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#E8D3A2 0 30%,#8C6C36 70%)}
.plate.lg::before{left:4px}.plate.lg::after{right:4px}
/* a plate for a drink you have not caught: the holder is there, the brass is not yet polished */
.plate.tarn{background:transparent;border:1px solid rgba(184,146,79,.72);color:var(--brassOnDark);text-shadow:none;box-shadow:none}

/* ---------- bottle-label tags (chamfered; the SVG edge is drawn by script below) ---------- */
.tag{position:relative;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;font:500 12px/16px Inter;color:var(--ink);white-space:nowrap}
.tag>svg.edge{position:absolute;left:0;top:0;z-index:-1}
.tag.solid{color:var(--ink)}

/* ---------- mounts (collected) and slots (not yet) ---------- */
.mount{position:relative;background:var(--mat);border:1px solid var(--matEdge);border-radius:8px;
  box-shadow:0 1px 0 rgba(14,11,11,.45),0 8px 18px rgba(14,11,11,.34)}
.mount>.key{position:absolute;inset:3px;border:1px solid var(--brass);border-radius:5px;pointer-events:none;opacity:.95}
.slot{position:relative;background:var(--cellar);border:1px solid var(--slotEdge);border-radius:8px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.55),inset 0 -1px 0 rgba(233,229,223,.06)}
.win{position:relative;overflow:hidden;border-radius:3px;background:var(--cellar)}
.win img{display:block;width:100%;height:100%;object-fit:cover}
.win::after{content:"";position:absolute;inset:0;border:1px solid var(--windowEdge);border-radius:3px;pointer-events:none}
/* bevel: the cut edge of a mat window, light from above */
.win.bevel{box-shadow:0 -1px 0 rgba(14,11,11,.28),0 1px 0 rgba(255,253,249,.9)}

/* ---------- walnut shelf with a brass front rail ---------- */
.shelf{position:absolute;left:0;right:0;height:24px;z-index:2}
.shelf .top{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(var(--walnutTop),#5A4132)}
.shelf .br{position:absolute;left:0;right:0;top:4px;height:2px;background:var(--brass);border-top:1px solid var(--brassLit)}
.shelf .front{position:absolute;left:0;right:0;top:6px;height:17px;border-bottom:1px solid var(--walnutDeep)}
.shelf .shade{position:absolute;left:0;right:0;top:24px;height:12px;background:linear-gradient(rgba(14,11,11,.30),rgba(14,11,11,0))}
.shelf .holder{position:absolute;top:8px;height:14px;padding:0 6px;border-radius:1px;background:var(--brassPlate);border-top:1px solid var(--brassLit);
  border-bottom:1px solid var(--brassShade);font:500 11px/12px Inter;letter-spacing:1px;color:var(--ink);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;text-shadow:0 1px 0 rgba(232,211,162,.85)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font:600 14px/18px Inter;white-space:nowrap}
.btn.wine{background:var(--wine);color:var(--onLining)}
.btn.out{border:1px solid var(--lineControl);color:var(--ink);background:var(--white)}
.btn.outL{border:1px solid var(--liningControl);color:var(--onLining)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.field{height:44px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;font:400 16px/22px Inter}
.field.paper{background:var(--white);border:1px solid var(--line);color:var(--muted)}
.field.well{background:var(--cellar);border:1px solid var(--liningControl);color:var(--onLiningMuted);box-shadow:inset 0 1px 4px rgba(0,0,0,.45)}
.chip{height:32px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font:500 13px/18px Inter;white-space:nowrap}
.chip.l{border:1px solid var(--liningControl);color:var(--onLining)}
.chip.l.on{background:var(--onLining);color:var(--lining);border-color:var(--onLining)}

/* ---------- people ---------- */
.avatar{border-radius:50%;display:grid;place-items:center;color:var(--onLining);font-weight:600;flex:none}
.u{font:600 15px/20px Inter}
.m{color:var(--muted)}

/* kicker: sentence case, a hair of tracking, never caps (label.kicker) */
.kick{font:500 12px/16px Inter;letter-spacing:.6px;color:var(--brassInk)}
.kick.d{color:var(--brassOnDark)}

/* ---------- section header with a bar-spoon rule ---------- */
.sect{display:flex;align-items:center;gap:10px}
.sect h3{font:600 20px/26px Inter;white-space:nowrap}
.sect .n{font:600 20px/26px Inter;color:var(--brassInk);font-variant-numeric:tabular-nums}
.sect .spoon{flex:1 1 0;min-width:0;width:0;height:8px}

.twoline{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wall">
<div class="legend"><span><i style="background:#B8924F"></i>brass</span><span><i style="background:#C9A867"></i>plate</span><span><i style="background:#7A5820"></i>brassInk</span><span><i style="background:#D6B676"></i>brassOnDark</span><span><i style="background:url(img/walnut.webp) center/cover"></i>walnut</span><span><i style="background:#F3E9D2"></i>label</span></div>
<h1>Brass <small>v3.3 detail layer: back-bar hardware. Brass keylines and brackets, engraved number plates, bottle labels, bar-spoon rules, walnut.</small></h1>

<!-- =================================================================== -->
<!-- 1 HOME                                                              -->
<!-- =================================================================== -->
<figure class="cap" id="f-home"><div class="screen pap" id="home">
  <div class="sb"><span class="t">9:41</span><span class="island"></span><span class="r" data-sb></span></div>

  <!-- head band: lining, runs from the status bar through the stories -->
  <div class="abs lin" style="left:0;right:0;top:0;height:208px"></div>
  <div class="bar">
    <div class="gb" style="left:6px" data-ic="plus:26:var(--onLining)"></div>
    <div class="wordmark">Sipply</div>
    <div class="gb" style="right:50px" data-ic="trophy:26:var(--onLining)"></div>
    <div class="gb" style="right:6px"><span data-ic="heart:26:var(--onLining)"></span><span class="dot"></span></div>
  </div>

  <!-- stories, standing on the back-bar shelf -->
  <div class="abs" id="stories" style="left:12px;top:112px;display:flex;gap:10px"></div>
  <div class="shelf" style="top:206px">
    <div class="top"></div><div class="br"></div><div class="front wood"></div><div class="shade"></div>
  </div>

  <!-- post -->
  <div class="abs" style="left:16px;right:16px;top:230px;height:42px;display:flex;align-items:center;gap:10px">
    <div class="avatar" style="width:34px;height:34px;background:#5E2545;font-size:13px;box-shadow:0 0 0 1px var(--paper),0 0 0 2px var(--brass)">IA</div>
    <div style="flex:1">
      <div class="u">ines.ag <span class="m" style="font-weight:400;font-size:14px">· 2h</span></div>
      <div style="font:400 13px/17px Inter;color:var(--muted)">La Factoría, Old San Juan</div>
    </div>
    <span data-ic="more:24:var(--ink)"></span>
  </div>

  <!-- the print: inset, framed, brass corner brackets -->
  <div class="abs" style="left:24px;top:274px;width:392px;height:490px;border-radius:4px;overflow:hidden;background:var(--cellar);box-shadow:0 0 0 1px rgba(43,35,34,.22)">
    <img src="../../../assets/drinks/negroni.webp" style="width:100%;height:100%;object-fit:cover;object-position:50% 40%">
    <!-- nameplate: two scrims (functional, foot of the photo only), then the name -->
    <div class="abs" style="left:0;right:0;bottom:0;height:200px;background:linear-gradient(rgba(14,11,11,0),rgba(14,11,11,.62) 48%,rgba(14,11,11,.86))"></div>
    <div class="abs brackets" style="inset:8px;z-index:2"></div>
    <div class="abs" style="left:18px;right:18px;bottom:22px;color:var(--reelInk)">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <span class="plate lg"><span class="no">Nº</span>0127</span>
        <span class="tag solid" data-tag="label" style="height:22px"><span data-ic="check:13:var(--wine):2.4"></span>In your Dex</span>
      </div>
      <div style="font:700 34px/40px Playfair;text-shadow:0 1px 2px rgba(14,11,11,.6)">Negroni</div>
      <div style="font:400 13px/18px Inter;margin-top:2px;text-shadow:0 1px 2px rgba(14,11,11,.6)">Spirit-forward · Rocks glass · Florence, Italy</div>
    </div>
  </div>

  <!-- actions -->
  <div class="abs" style="left:20px;right:20px;top:768px;height:34px;display:flex;align-items:center;gap:18px">
    <span data-ic="heart:26:var(--wine):0:solid"></span>
    <span data-ic="comment:25:var(--ink)"></span>
    <span data-ic="send:25:var(--ink)"></span>
    <span style="flex:1"></span>
    <span data-ic="bookmark:25:var(--ink)"></span>
  </div>
  <div class="abs" style="left:24px;right:24px;top:804px;display:flex;align-items:center;gap:8px">
    <div style="display:flex">
      <div class="avatar" style="width:20px;height:20px;background:#8A5F10;font-size:11px;box-shadow:0 0 0 1.5px var(--paper)">M</div>
      <div class="avatar" style="width:20px;height:20px;background:#3A2E2C;font-size:11px;margin-left:-6px;box-shadow:0 0 0 1.5px var(--paper)">T</div>
      <div class="avatar" style="width:20px;height:20px;background:#736247;font-size:11px;margin-left:-6px;box-shadow:0 0 0 1.5px var(--paper)">D</div>
    </div>
    <div style="font:400 14px/20px Inter">Liked by <b style="font-weight:600">maya.pours</b> and <b style="font-weight:600">12 others</b></div>
  </div>
  <div class="abs" style="left:24px;right:24px;top:827px;font:400 14px/20px Inter;white-space:nowrap;overflow:hidden;text-overflow:clip"><b style="font-weight:600">ines.ag</b> Equal parts, stirred long. The orange does&hellip; <span style="color:var(--muted)">more</span></div>

  <div class="tabbar" data-tabs="home"></div>
  <div class="hi"></div>
</div>
<figcaption><b>1 Home</b>The stories stand on a walnut back-bar shelf with a brass front rail. The post is a print behind four brass corner brackets; its Dex number is an engraved plate, its status a bottle label. Liked by, with faces.</figcaption></figure>

<!-- =================================================================== -->
<!-- 2 DEX                                                               -->
<!-- =================================================================== -->
<figure class="cap" id="f-dex"><div class="screen lin" id="dex">
  <div class="sb"><span class="t">9:41</span><span class="island"></span><span class="r" data-sb></span></div>
  <div class="bar">
    <div class="title">Dex</div>
    <div class="gb" style="right:6px" data-ic="stats:24:var(--onLining)"></div>
  </div>

  <!-- hero figure + brass level gauge -->
  <div class="abs" style="left:16px;right:16px;top:114px;display:flex;align-items:flex-end;gap:12px;color:var(--onLining)">
    <div style="font:600 40px/42px Inter;letter-spacing:-.6px;font-variant-numeric:tabular-nums">38</div>
    <div style="padding-bottom:3px">
      <div style="font:500 15px/19px Inter">in your Dex</div>
      <div style="font:400 13px/17px Inter;color:var(--onLiningMuted);font-variant-numeric:tabular-nums">of 2,089 · 1.8%</div>
    </div>
    <div style="flex:1"></div>
    <div style="text-align:right;padding-bottom:3px">
      <div class="kick d">latest catch</div>
      <div style="font:600 15px/20px Playfair">Ramos Gin Fizz</div>
    </div>
  </div>
  <div class="abs gauge" data-gauge="38:2089:dark" style="left:16px;right:16px;top:170px;height:30px"></div>

  <div class="abs field well" style="left:16px;right:16px;top:210px"><span data-ic="search:20:var(--onLiningMuted)"></span>Search 2,089 drinks</div>
  <div class="abs" style="left:16px;right:0;top:266px;display:flex;gap:8px;align-items:center">
    <span class="chip l on">All</span><span class="chip l">Cocktails</span><span class="chip l">Spirits</span>
    <span style="width:1px;height:20px;background:var(--liningLine);margin:0 2px"></span>
    <span class="chip l">Collected</span><span class="chip l">Not yet</span>
  </div>

  <div id="dexgrid"></div>

  <div class="tabbar" data-tabs="dex"></div>
  <div class="hi light"></div>
</div>
<figcaption><b>2 Dex</b>One grid in number order. Each row stands on a walnut shelf whose brass label holder names its numbers. Caught drinks are brass-trimmed mounts with a polished plate; the rest are recesses with an empty plate holder.</figcaption></figure>

<!-- =================================================================== -->
<!-- 3 MY BAR                                                            -->
<!-- =================================================================== -->
<figure class="cap" id="f-bar"><div class="screen pap" id="bar">
  <div class="sb"><span class="t">9:41</span><span class="island"></span><span class="r" data-sb></span></div>
  <div class="abs lin" style="left:0;right:0;top:0;height:194px"></div>
  <div class="bar"><div class="title">My Bar</div></div>
  <div class="abs" style="left:16px;right:16px;top:114px;color:var(--onLining)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font:600 22px/28px Inter">What's in your bar?</div>
      <span class="plate lg" style="font-variant-numeric:tabular-nums">12 ticked</span>
    </div>
    <div style="font:400 14px/20px Inter;color:var(--onLiningMuted);margin-top:6px">Tick what you have. The ones that pour the most come first.</div>

  [4,'espresso-martini','Espresso Martini',1],[5,'grasshopper','Grasshopper',0],[6,'porto-flip','Porto Flip',0],
  [7,'white-russian','White Russian',1],[8,'gin-fizz','Gin Fizz',1],[9,'ramos-gin-fizz','Ramos Gin Fizz',1],
];
(function(){
  const g = document.getElementById('dexgrid');
  const W = 129, GAP = 10, X0 = 16, Y0 = 314, CH = 196, PITCH = 228;
  let html = '';
  for (let r = 0; r < 3; r++) {
    const y = Y0 + r * PITCH;
    for (let c = 0; c < 3; c++) {
      const d = dex[r*3+c]; if (!d) continue;
      const [n,id,name,got] = d;
      const x = X0 + c * (W + GAP);
      const no = String(n).padStart(4,'0');
      if (got) {
        html += `<div class="abs mount" style="left:${x}px;top:${y}px;width:${W}px;height:${CH}px;padding:8px">
          <div class="key"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;height:18px"><span class="plate"><span class="no">Nº</span>${no}</span>${icon('check',15,'#5B0F1A',2.4)}</div>
          <div style="font:700 16px/20px Playfair;color:var(--ink);margin-top:6px;height:40px">${name}</div>
          <div class="win bevel" style="width:111px;height:111px;margin-top:5px"><img src="${P(id)}"></div>
        </div>`;
      } else {
        html += `<div class="abs slot" style="left:${x}px;top:${y}px;width:${W}px;height:${CH}px;padding:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;height:18px"><span class="plate tarn"><span class="no">Nº</span>${no}</span>${icon('lock',15,'#A7837F',1.75)}</div>
          <div style="font:500 14px/18px Inter;color:var(--onLiningMuted);margin-top:7px;height:39px">${name}</div>
          <div class="win" style="width:111px;height:111px;margin-top:5px;background:var(--cellar)"><img src="${GHOST(id)}" style="opacity:.9"></div>
        </div>`;
      }
    }
    const a = String(r*3+1).padStart(4,'0'), b = String(r*3+3).padStart(4,'0');
    html += `<div class="shelf" style="top:${y+CH+2}px"><div class="top"></div><div class="br"></div><div class="front wood"></div><div class="shade"></div>
      <div class="holder" style="left:16px">${a} – ${b}</div></div>`;
  }
  g.innerHTML = html;
})();

/* ---------------- drawn hardware ---------------- */
hydrateIcons(document);
document.fonts.ready.then(()=>{

/* corner brackets: four brass L plates with a screw in each corner */
document.querySelectorAll('.brackets').forEach(el=>{
  const w = el.offsetWidth, h = el.offsetHeight, A = 22, T = 3, S = 8;
  const L = (x,y,sx,sy) => {
    const p = `M0 0H${A}V${T}H${S}V${S}H${T}V${A}H0Z`;
    return `<g transform="translate(${x} ${y}) scale(${sx} ${sy})">
      <path d="${p}" fill="#B8924F" stroke="#7D5F2C" stroke-width=".75"/>
      <path d="M.6 ${A-.6}V.6H${A-.6}" fill="none" stroke="#E8D3A2" stroke-width=".9" stroke-opacity=".9"/>
      <circle cx="${S/2+.6}" cy="${S/2+.6}" r="1.9" fill="#7D5F2C"/><path d="M${S/2-.6} ${S/2+1.8} ${S/2+1.8} ${S/2-.6}" stroke="#E8D3A2" stroke-width=".7"/>
    </g>`;
  };
  el.innerHTML = `<svg width="${w}" height="${h}" style="filter:drop-shadow(0 1px 1px rgba(14,11,11,.55))">${L(0,0,1,1)+L(w,0,-1,1)+L(0,h,1,-1)+L(w,h,-1,-1)}</svg>`;
});

/* bottle-label tags: chamfered corners, the big ones with an inner rule */
function chamferPath(w,h,c,i){ const a=i+.5, b=c; return `M${a+b} ${a}H${w-a-b}L${w-a} ${a+b}V${h-a-b}L${w-a-b} ${h-a}H${a+b}L${a} ${h-a-b}V${a+b}Z`; }
document.querySelectorAll('[data-tag]').forEach(el=>{
  const w = el.offsetWidth, h = el.offsetHeight, kind = el.dataset.tag;
  const S = {
    label:{fill:'#F3E9D2',edge:'#7D5F2C',c:4,inner:false},
    mini:{fill:'#F3E9D2',edge:'rgba(125,95,44,.7)',c:3,inner:false},
    labelOn:{fill:'#F3E9D2',edge:'#7D5F2C',c:7,inner:'rgba(184,146,79,.85)'},
    labelOff:{fill:'#FFFFFF',edge:'#D9CFC1',c:7,inner:false},
  }[kind];
  let s = `<svg class="edge" width="${w}" height="${h}"><path d="${chamferPath(w,h,S.c,0)}" fill="${S.fill}" stroke="${S.edge}"/>`;
  if (S.inner) s += `<path d="${chamferPath(w,h,S.c-1.2,2.5)}" fill="none" stroke="${S.inner}" stroke-width=".8"/>`;
  el.insertAdjacentHTML('afterbegin', s + '</svg>');
  el.style.isolation = 'isolate';
});

/* bar-spoon twist rule: a twisted shaft between two discs */
document.querySelectorAll('[data-spoon]').forEach(svg=>{
  const w = svg.getBoundingClientRect().width, h = 8, cy = 4;
  let d = '';
  for (let x = 10; x < w - 16; x += 3.2) d += `M${x.toFixed(1)} ${cy+2.2}L${(x+2.6).toFixed(1)} ${cy-2.2}`;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `<path d="M6 ${cy}H${w-6}" stroke="#B8924F" stroke-width="1" opacity=".55"/>
    <path d="${d}" stroke="#B8924F" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="3" cy="${cy}" r="2.6" fill="#B8924F"/><circle cx="${w-4}" cy="${cy}" r="3.6" fill="#B8924F"/><circle cx="${w-4}" cy="${cy}" r="1.4" fill="#E8D3A2"/>`;
});

/* the brass gauge: a level tube, ticks every 10%, notches at the rank ladder */
document.querySelectorAll('[data-gauge]').forEach(el=>{
  const [n,total,tone] = el.dataset.gauge.split(':'); const w = el.offsetWidth;
  const pct = +n / +total, H = 8, y = 2;
  const ink = tone==='wood' ? '#C9B6A8' : '#B8A09B';
  const well = tone==='wood' ? '#2E1F19' : '#2F070D';
  let ticks = '';
  for (let i = 0; i <= 20; i++) { const x = (w-1) * i/20 + .5; ticks += `<path d="M${x} ${y+H+2}V${y+H+(i%2?4:6)}" stroke="#B8924F" stroke-width="1" opacity="${i%2?.55:.9}"/>`; }
  let notches = '';
  if (tone==='wood') [.10,.25,.50,.75].forEach(p=>{ const x=(w-1)*p+.5; notches += `<path d="M${x-3.5} ${y-3.5}L${x} ${y}L${x+3.5} ${y-3.5}Z" fill="#D6B676"/>`; });
  const labels = tone==='wood'
    ? [[.10,'209'],[.25,'523'],[.50,'1,045'],[.75,'1,567'],[1,'2,089']]
    : [[0,'0'],[.25,'500'],[.5,'1,000'],[.75,'1,500'],[1,'2,089']];
  const lab = labels.map(([p,t])=>{ const x=(w-1)*p+.5; const anchor = p===0?'start':p===1?'end':'middle'; return `<text x="${x}" y="${y+H+18}" text-anchor="${anchor}" font-family="Inter" font-weight="500" font-size="11" fill="${ink}" style="font-variant-numeric:tabular-nums">${t}</text>`; }).join('');
  el.innerHTML = `<svg width="${w}" height="30">
    <rect x=".5" y="${y+.5}" width="${w-1}" height="${H-1}" rx="2" fill="${well}" stroke="#B8924F"/>
    <rect x="2" y="${y+2}" width="${Math.max(3,(w-4)*pct)}" height="${H-4}" rx="1" fill="#C9A867"/>
    <path d="M2 ${y+2.5}H${2+Math.max(3,(w-4)*pct)}" stroke="#E8D3A2" stroke-width="1"/>
    ${notches}${ticks}${lab}</svg>`;
});

document.body.dataset.ready='1';
});

if (location.hash) {
  const id = location.hash.slice(1);
  document.body.classList.add('solo');
  const f = document.getElementById('f-' + id); if (f) f.classList.add('on');
}

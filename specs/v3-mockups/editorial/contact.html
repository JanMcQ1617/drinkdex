<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sipply Menu Card, all screens</title>
<style>
@font-face{font-family:Inter;src:url(fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Playfair;src:url(fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#2B2322}
body{display:flex;gap:20px;padding:24px;font-family:Inter,sans-serif}
figure{flex:none}
.f{width:378px;height:822px;overflow:hidden;border-radius:40px;box-shadow:0 0 0 1px rgba(255,253,249,.18)}
iframe{width:440px;height:956px;border:0;transform:scale(.8591);transform-origin:0 0;display:block}
figcaption{color:#D8D2CB;font-size:15px;font-weight:500;margin-top:12px;text-align:center}
</style>
</head>
<body>
<figure><div class="f"><iframe src="index.html#home"></iframe></div><figcaption>Home, at rest</figcaption></figure>
<figure><div class="f"><iframe src="index.html#home-feed"></iframe></div><figcaption>Home, scrolled</figcaption></figure>
<figure><div class="f"><iframe src="index.html#dex"></iframe></div><figcaption>Dex</figcaption></figure>
<figure><div class="f"><iframe src="index.html#drink"></iframe></div><figcaption>Drink page</figcaption></figure>
<figure><div class="f"><iframe src="index.html#profile"></iframe></div><figcaption>Profile</figcaption></figure>
<figure><div class="f"><iframe src="index.html#signin"></iframe></div><figcaption>Sign in</figcaption></figure>
<figure><div class="f"><iframe src="index.html#log"></iframe></div><figcaption>Log a pour</figcaption></figure>
</body>
</html>

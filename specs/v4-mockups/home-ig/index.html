<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home, Instagram-style</title>
<style>
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}

/* v4 "Daylight" tokens, as in src/constants/theme.ts. No hue: the drink photos are the only colour. */
:root{
  --page:#FFFFFF;     /* colors.bg: ground, bars, tab bar */
  --wash:#F5F5F5;     /* colors.bgSunk: a photo or disc before it decodes */
  --rule:#C4C4C4;     /* colors.rule: the seen story ring, the resting gallery dots. Decorative */
  --muted:#5C5C5C;    /* colors.textMuted: 6.69:1 on page. Quiet text, resting tab glyphs */
  --ink:#0A0A0A;      /* colors.text: 19.80:1 on page */
  --onInk:#FFFFFF;
  --photoEdge:rgba(10,10,10,.07);
  --t1:#262626; --t2:#3D3D3D; --t3:#5C5C5C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E6E6E6}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}
b{font-weight:600}

/* The three sizes the app already has (textRole.title / body / small); nothing new. */
.wordmark{font:700 28px/34px Playfair;letter-spacing:-.2px}
.sm{font:400 13px/18px Inter}
.sm6{font:600 13px/18px Inter}
.drink{font:700 13px/18px Playfair}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.a{position:absolute}
.phone{position:relative;width:440px;height:956px;background:var(--page);overflow:hidden;flex:none;isolation:isolate}
.circle{border-radius:50%}

/* ---------- the feed: one flow column, moved by scroll ---------- */
.feed{position:absolute;left:0;top:0;width:440px}
.spacer{height:107px}                               /* 62 status + 44 bar + 1 foot (HOME_BAR_HEIGHT 45) */
.tray{position:relative;height:104px}               /* 107 → 211 at rest */
.post{position:relative;padding-bottom:14px}
.ph{position:relative;height:52px}                  /* post header */
.photo{position:relative;width:440px;height:440px;background:var(--wash);overflow:hidden}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);pointer-events:none}
.acts{position:relative;height:44px}
.liked{position:relative;height:22px;display:flex;align-items:center;padding-left:16px}
.txt{margin:4px 16px 0;font:400 13px/18px Inter;color:var(--ink)}
.txt.q{color:var(--muted)}

/* avatars: a Daylight tone with a white silhouette standing in for a person's photo (no initials, so no capitals) */
.av{position:absolute;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}

/* status bar (system) */
.sb{position:absolute;top:0;left:0;right:0;height:62px;color:var(--ink);background:var(--page)}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.sb .r{position:absolute;right:30px;top:24px;display:flex;gap:6px;align-items:center}

/* the wall */
.wall{display:flex;gap:36px;padding:112px 44px 40px;align-items:flex-start;position:relative}
.wall>h1{position:absolute;left:44px;top:34px;font:600 30px/36px Inter;letter-spacing:-.6px}
.wall>h1 small{font:400 15px/20px Inter;letter-spacing:0;color:var(--muted);margin-left:16px}
.frame{display:flex;flex-direction:column;gap:16px;width:440px;flex:none}
.frame .phone{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.frame.ref .phone img{display:block;width:440px;height:956px}
.cap{font:400 13px/19px Inter;color:#4A4A4A}
.cap .cnt{display:block;font:600 15px/22px Inter;color:var(--ink);margin-bottom:4px}
body.solo{background:var(--page)}
body.solo .wall{padding:0;display:block}
body.solo .wall>h1,body.solo .cap{display:none}
body.solo .frame{display:none}
body.solo .frame.on{display:block}
body.solo .frame .phone{box-shadow:none}
#dump{white-space:pre;font:11px/14px monospace;padding:20px}
</style>
</head>
<body>
<div class="wall" id="wall">
  <h1>Home, the way Instagram lays it out<small>Daylight tokens on 440 × 956. Header, full-bleed photo, heart · comment · share · save, liked by, caption, comments, time. Photos are the only colour.</small></h1>
</div>
<pre id="dump"></pre>
<script>
/* ---------- glyphs: src/components/icons.tsx paths, stroke 1.6 at 24 ---------- */
const OUT = {
  home:'<path d="M3.2 10.4 12 3.4l8.8 7"/><path d="M5.4 9.3V19.4a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6V9.3"/><path d="M9.6 21V14.9h4.8V21"/>',
  dex:'<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
  bottle:'<path d="M10.4 3.2v4c0 1.4-3.2 1.8-3.2 3.6v8.6a1.4 1.4 0 0 0 1.4 1.4h6.8a1.4 1.4 0 0 0 1.4-1.4v-8.6c0-1.8-3.2-2.2-3.2-3.6v-4z"/><path d="M10.4 5.4h3.2"/><path d="M7.2 12.8h9.6"/><path d="M7.2 17h9.6"/>',
  heart:'<path d="M12 20.3 4.9 13.4a4.3 4.3 0 0 1 0-6.2 4.5 4.5 0 0 1 6.3 0l.8.8.8-.8a4.5 4.5 0 0 1 6.3 0 4.3 4.3 0 0 1 0 6.2z"/>',
  comment:'<path d="M20.4 12.6a7.4 7.4 0 0 1-8 7.4 8.5 8.5 0 0 1-3-.6L4.2 20.4l1.1-4.9a7.4 7.4 0 0 1-.7-3.2 7.4 7.4 0 0 1 8-7.4 7.5 7.5 0 0 1 7.8 7.4z"/>',
  send:'<path d="M2.9 10.9 21.1 4.9 9.1 13.1z"/><path d="M9.1 13.1 21.1 4.9 12.6 19.1z"/>',
  bookmark:'<path d="M6.4 4.6h11.2v15.8L12 16.3l-5.6 4.1z"/>',
  plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  /* NEW: Instagram's create glyph, a squared frame with the plus inside (icons.tsx `create`) */
  create:'<rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4"/><path d="M12 8v8"/><path d="M8 12h8"/>',
};
const SOLID = {
  home:'<path fill-rule="evenodd" d="M12 2.7a1.4 1.4 0 0 1 .9.3l8.3 6.6a1.4 1.4 0 0 1 .5 1.1v8.7a2.2 2.2 0 0 1-2.2 2.2h-4.6v-5.7a1 1 0 0 0-1-1h-3.8a1 1 0 0 0-1 1v5.7H4.5a2.2 2.2 0 0 1-2.2-2.2v-8.7a1.4 1.4 0 0 1 .5-1.1l8.3-6.6a1.4 1.4 0 0 1 .9-.3z"/>',
  heart:'<path d="M12 20.9a1 1 0 0 1-.68-.27l-6.9-6.7a5.1 5.1 0 0 1 0-7.4 5.4 5.4 0 0 1 7.58 0 5.4 5.4 0 0 1 7.58 0 5.1 5.1 0 0 1 0 7.4l-6.9 6.7a1 1 0 0 1-.68.27z"/>',
  bookmark:'<path d="M6.4 4.6a.9.9 0 0 0-.9.9v14.9a.9.9 0 0 0 1.42.73L12 17.4l5.08 3.73a.9.9 0 0 0 1.42-.73V5.5a.9.9 0 0 0-.9-.9z"/>',
};
const ic = (name, size=26, color='var(--ink)', sw=1.6, solid=false) => {
  if (name === 'more') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><circle cx="5.4" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.6" cy="12" r="1.7"/></svg>`;
  if (solid && SOLID[name]) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">${SOLID[name]}</svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${OUT[name]}</svg>`;
};
const at = (x, y, inner, m='') => `<div class="a" ${m?`data-m="${m}"`:''} style="left:${x}px;top:${y}px">${inner}</div>`;

const PHOTO = id => `../../../assets/drinks/${id}.webp`;   /* the shipped daylight prints, standing in for users' photos */
const PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6z"/>';
const av = (x, y, d, tone, m='') => {
  const s = Math.round(d*.86);
  return `<div class="av" ${m?`data-m="${m}"`:''} style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:var(--${tone})"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="#FFFFFF">${PERSON}</svg></div>`;
};

/* ---------- the people and the posts (stand-ins; names as in the earlier v4 mocks) ---------- */
const P = {
  me:    {u:'nico.pours', tone:'t3'},
  ines:  {u:'ines.ag',    tone:'t2'},
  maya:  {u:'maya.pours', tone:'t1'},
  sam:   {u:'sam.ortega', tone:'t3'},
  theo:  {u:'theo_stirs', tone:'t1'},
  dmitri:{u:'dmitri.k',   tone:'t2'},
};
/* Today's pours, unseen first (groupPours' order). The disc is the newest photo, as TodaysPours draws it now. */
const STORIES = [
  {who:'me', own:true},
  {who:'ines',  img:'negroni',          seen:false},
  {who:'maya',  img:'daiquiri',         seen:false},
  {who:'sam',   img:'aperol-spritz',    seen:false},
  {who:'theo',  img:'paper-plane',      seen:true},
  {who:'dmitri',img:'espresso-martini', seen:true},
];
const POSTS = [
  { who:'ines', drink:'Negroni', img:'negroni', pos:'50% 62%', zoom:1.18, story:'unseen',
    likers:['maya'], likes:24, liked:false, comments:0, when:'2 hours ago',
    caption:'Stirred long over one big cube. Sunday’s first.' },
  { who:'theo', drink:'Paper Plane', img:'paper-plane', pos:'50% 50%', zoom:1.12, story:'seen',
    likers:['ines','maya','sam'], likes:42, liked:true, comments:12, when:'5 hours ago', gallery:3,
    caption:'Equal parts, hard shake, and the bourbon still shows up. Best one this week. Went with a high-rye bourbon so it stays dry against the Aperol, and the Amaro Nonino brings the orange-peel bitterness forward. Lemon squeezed right before, never from the bottle. Shaken hard for twelve seconds, double strained into a cold coupe. The paper plane on top is only for the photo.' },
  { who:'maya', drink:'Daiquiri', img:'daiquiri', pos:'50% 56%', zoom:1.15, story:'unseen',
    likers:['theo'], likes:17, liked:false, comments:3, when:'8 hours ago',
    caption:'Two of rum, one of lime, three quarters of syrup. That’s the whole secret.' },
];

/* ---------- system chrome ---------- */
const statusBar = () => `<div class="sb"><span class="t">9:41</span><span class="island"></span><span class="r">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="#0A0A0A"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="#0A0A0A"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3ZM8 9.3l1.9-1.7a2.9 2.9 0 0 0-3.8 0Z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0A0A0A" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#0A0A0A"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#0A0A0A" fill-opacity=".4"/></svg></span></div>`;
const homeInd = () => `<div class="a" style="left:150px;top:942px;width:140px;height:5px;border-radius:3px;background:var(--ink)"></div>`;

/* Home's bar: 44 tall under the 62pt status strip. Wordmark left at 16; create (+) and the Activity heart right. */
function topBar(){
  let h = `<div class="a" style="left:0;top:62px;width:440px;height:45px;background:var(--page)"></div>`;
  h += `<div class="a wordmark" data-m="wordmark" style="left:16px;top:67px">Sipply</div>`;
  h += at(354, 71, ic('create',26), 'create');
  h += at(398, 71, ic('heart',26), 'activity');
  /* unread: 8pt ink dot in a 2pt page ring, on the glyph's top-right (TopBarButton badge) */
  h += `<div class="a circle" data-m="dot" style="left:414px;top:69px;width:12px;height:12px;background:var(--ink);box-shadow:0 0 0 2px var(--page)"></div>`;
  return h;
}

/* v4 tab bar, as built (FloatingTabBar): a 49pt row on an opaque page slab, five glyphs, the + filled. */
function tabBar(){
  const xs = [44,132,220,308,396], cy = 897.5;
  let h = `<div class="a" style="left:0;top:873px;width:440px;height:83px;background:var(--page)"></div>`;
  h += at(xs[0]-13, cy-13, ic('home',26,'var(--ink)',1.6,true));
  h += at(xs[1]-13, cy-13, ic('dex',26,'var(--muted)'));
  h += `<div class="a" style="left:${xs[2]-26}px;top:${cy-19}px;width:52px;height:38px;border-radius:4px;background:var(--ink);display:flex;align-items:center;justify-content:center">${ic('plus',22,'#FFFFFF',2)}</div>`;
  h += at(xs[3]-13, cy-13, ic('bottle',26,'var(--muted)'));
  h += av(xs[4]-13, cy-13, 26, P.me.tone);
  return h + homeInd();
}

/* ---------- stories tray: ring box 66 (2pt ink ring unseen / 1pt rule ring seen, 3pt gap, 56 disc), slot 80 ---------- */
function tray(){
  let h = '';
  STORIES.forEach((s, i) => {
    const x = 12 + i*80, y = 8;           /* ring box left edges 12 · 92 · 172 · 252 · 332 · 412 (the sixth peeks 28pt) */
    const p = P[s.who];
    if (!s.own) {
      const ring = s.seen ? 'box-shadow:inset 0 0 0 1px var(--rule)' : 'box-shadow:inset 0 0 0 2px var(--ink)';
      h += `<div class="a circle" ${i===1?'data-m="ring"':''} style="left:${x}px;top:${y}px;width:66px;height:66px;${ring}"></div>`;
      h += `<div class="a circle" ${i===1?'data-m="disc"':''} style="left:${x+5}px;top:${y+5}px;width:56px;height:56px;overflow:hidden;background:var(--wash)"><img src="${PHOTO(s.img)}" style="position:absolute;left:-14px;top:-12px;width:84px;height:84px;object-fit:cover"></div>`;
    } else {
      h += av(x+5, y+5, 56, p.tone, 'yourDisc');
      /* the + badge: 22pt ink disc, white plus, 3pt page ring (28 outer), its corner on the ring box's corner */
      h += `<div class="a circle" data-m="badge" style="left:${x+41}px;top:${y+41}px;width:22px;height:22px;background:var(--ink);box-shadow:0 0 0 3px var(--page);display:flex;align-items:center;justify-content:center">${ic('plus',14,'#FFFFFF',2.4)}</div>`;
    }
    const label = s.own ? 'Your story' : p.u;
    const tone = s.own || s.seen ? 'var(--muted)' : 'var(--ink)';
    h += `<div class="a sm ell" ${i===0?'data-m="storyName"':''} style="left:${x-7}px;top:${y+70}px;width:80px;text-align:center;color:${tone}">${label}</div>`;
  });
  return `<div class="tray" data-m="tray">${h}</div>`;
}

/* ---------- one post ---------- */
function post(d, k, expanded){
  const p = P[d.who];
  let h = `<article class="post" data-m="post${k}">`;
  /* header: 52 tall. 32 face at x 16 (inside a 40 ring box at 12 when they have a story today), text at 60, ••• at 400 */
  h += `<div class="ph" data-m="header${k}">`;
  if (d.story === 'unseen') h += `<div class="a circle" data-m="hring${k}" style="left:12px;top:6px;width:40px;height:40px;box-shadow:inset 0 0 0 2px var(--ink)"></div>`;
  h += av(16, 10, 32, p.tone, 'havatar'+k);
  h += `<div class="a sm6" data-m="user${k}" style="left:60px;top:8px">${p.u}</div>`;
  h += `<div class="a drink" data-m="drinkline${k}" style="left:60px;top:26px">${d.drink}</div>`;
  h += at(400, 14, ic('more',24), 'more'+k);
  h += `</div>`;
  /* the photo: full bleed, 440 × 440 */
  h += `<div class="photo" data-m="photo${k}"><img src="${PHOTO(d.img)}" style="object-position:${d.pos};transform:scale(${d.zoom});transform-origin:${d.pos}">`;
  if (d.gallery) h += `<div class="a" data-m="marker${k}" style="right:12px;top:12px;height:22px;min-width:22px;padding:0 6px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 1px #FFFFFF;color:#fff;font:500 11px/22px Inter;font-variant-numeric:tabular-nums">1/${d.gallery}</div>`;
  h += `</div>`;
  /* actions: 44 tall. 26pt glyphs at x 16 · 60 · 104 (centres 44 apart, so their 44pt boxes abut); save at 398 */
  h += `<div class="acts" data-m="acts${k}">`;
  h += at(16, 9, ic('heart',26,'var(--ink)',1.6,d.liked), 'heart'+k);
  h += at(60, 9, ic('comment',26), 'comment'+k);
  h += at(104, 9, ic('send',26), 'share'+k);
  h += at(398, 9, ic('bookmark',26), 'save'+k);
  if (d.gallery) {
    const n = d.gallery, w = n*6 + (n-1)*4;
    let dots = '';
    for (let i=0;i<n;i++) dots += `<span class="circle" style="display:block;width:6px;height:6px;background:${i===0?'var(--ink)':'var(--rule)'}"></span>`;
    h += `<div class="a" data-m="dots${k}" style="left:${220-w/2}px;top:19px;display:flex;gap:4px">${dots}</div>`;
  }
  h += `</div>`;
  /* liked by: 22 tall. Faces 22 outer (18 + a 2pt page ring), overlapping by 8; the line 8 after them */
  const faces = d.likers.map((w,i)=>`<div class="circle" style="position:absolute;left:${i*14}px;top:0;width:22px;height:22px;background:var(--page);padding:2px"><div class="circle" style="width:18px;height:18px;background:var(--${P[w].tone});display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff">${PERSON}</svg></div></div>`).join('');
  const fw = 22 + (d.likers.length-1)*14;
  h += `<div class="liked" data-m="liked${k}"><div style="position:relative;width:${fw}px;height:22px;flex:none">${faces}</div><div class="sm" style="margin-left:8px">Liked by <b>${P[d.likers[0]].u}</b> and <b>${d.likes-1} others</b></div></div>`;
  /* caption: "username caption", two lines then "… more" */
  h += `<p class="txt cap2" data-m="caption${k}" data-u="${p.u}" data-full="${d.caption.replace(/"/g,'&quot;')}" data-x="${expanded?1:0}"><b>${p.u}</b> ${d.caption}</p>`;
  if (d.comments) h += `<p class="txt q" data-m="comments${k}">View all ${d.comments} comments</p>`;
  h += `<p class="txt q" data-m="time${k}">${d.when}</p>`;
  return h + `</article>`;
}

function phone({scroll=0, bar=true, expanded=false, id}){
  let feed = `<div class="spacer"></div>` + tray() + POSTS.map((d,k)=>post(d, k+1, expanded && k===1)).join('');
  let h = `<div class="feed" data-scroll="${scroll}">${feed}</div>`;
  h += statusBar();
  if (bar) h += topBar();
  h += tabBar();
  return h;
}

/* Two lines, then "… more" in muted: the longest run of words that still fits. */
function clamp(el){
  if (el.dataset.x === '1') return;
  const words = el.dataset.full.split(' '), u = el.dataset.u;
  const put = n => el.innerHTML = `<b>${u}</b> ${words.slice(0,n).join(' ')}${n < words.length ? '… <span class="muted">more</span>' : ''}`;
  put(words.length);
  if (el.offsetHeight <= 36) return;
  let lo = 0, hi = words.length - 1;
  while (lo < hi) { const mid = Math.ceil((lo+hi)/2); put(mid); if (el.offsetHeight <= 36) lo = mid; else hi = mid - 1; }
  put(lo);
}

const FRAMES = [
  ['ref', null, 'Before: build 20', 'white-min/home.png, the less-stuff Home as built: an inset 4:5 print, one line (drink and author), heart, count, save, •••.'],
  ['home', {bar:true}, '1 Home at rest', 'Wordmark left; create and the Activity heart right. Stories with ink rings for new, a grey ring for seen, "Your story" first with its + badge. Post 1 whole, post 2’s header above the tab bar.'],
  ['scrolled', {bar:false, scrollTo:2}, '2 Home scrolled', 'Scrolling down slides the bar away under the status strip (as now). One post mid-screen: header with the drink as its second line, full-bleed photo, heart · comment · share · save, liked by with three faces, two lines of caption and "more", "View all 12 comments", the time.'],
  ['caption', {bar:false, scrollTo:2, expanded:true}, '3 Caption expanded', 'Tapping "more" opens the whole caption in place, as Instagram does; nothing scrolls, the post grows.'],
];

const wall = document.getElementById('wall');
FRAMES.forEach(([id, cfg, name, txt]) => {
  const f = document.createElement('div'); f.className = 'frame' + (cfg ? '' : ' ref'); f.id = 'f-'+id;
  const inner = cfg ? phone({...cfg, id}) : `<img src="../white-min/home.png" alt="">`;
  f.innerHTML = `<div class="phone" data-frame="${id}">${inner}</div><div class="cap"><span class="cnt">${name}</span>${txt}</div>`;
  wall.appendChild(f);
});

document.fonts.ready.then(() => {
  document.querySelectorAll('.cap2').forEach(clamp);
  /* Scroll for frames 2 and 3: post 2 (collapsed) centred between the status strip (62) and the tab bar (873). */
  const ref = document.querySelector('#f-scrolled .feed');
  const p2 = ref.querySelector('[data-m="post2"]');
  const blockH = p2.offsetHeight - 14;                       /* less its bottom padding */
  const scroll = Math.round(p2.offsetTop - (62 + (811 - blockH) / 2));
  ['scrolled','caption'].forEach(id => {
    const feed = document.querySelector(`#f-${id} .feed`);
    feed.style.transform = `translateY(${-scroll}px)`;
    feed.dataset.scroll = scroll;
  });
  const hash = location.hash.slice(1);
  if (hash === 'measure') {
    const out = {};
    ['home','scrolled','caption'].forEach(id => {
      const ph = document.querySelector(`#f-${id} .phone`), o = ph.getBoundingClientRect();
      const m = {scroll: +ph.querySelector('.feed').dataset.scroll};
      ph.querySelectorAll('[data-m]').forEach(e => {
        const r = e.getBoundingClientRect();
        m[e.dataset.m] = [Math.round(r.left-o.left), Math.round(r.top-o.top), Math.round(r.width), Math.round(r.height)].join(',');
      });
      out[id] = m;
    });
    document.getElementById('dump').textContent = JSON.stringify(out, null, 1);
  } else if (hash) {
    document.body.classList.add('solo');
    const f = document.getElementById('f-'+hash); if (f) f.classList.add('on');
  }
});
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylight mockups</title>
<style>
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}

:root{
  /* v4 "Daylight": the whole UI palette. Nine values, no hue. */
  --white:#FFFFFF;      /* page, cards, sheets, the tab bar */
  --wash:#F5F5F5;       /* wells: search, chips' pressed ground, empty prints, the Dex panel */
  --press:#EBEBEB;      /* pressed fill of white controls; never carries `control` */
  --line:#E3E3E3;       /* 1pt edges and rules. Decorative */
  --hair:#D6D6D6;       /* hairline row separators (0.5pt). Decorative */
  --rule:#C4C4C4;       /* seen story ring, ruler minor ticks, the grabber. Decorative */
  --control:#8A8A8A;    /* control edges, resting glyphs, >=18pt only as text. 3.45 white */
  --muted:#5C5C5C;      /* secondary text. 6.69 white, 6.13 wash */
  --ink:#0A0A0A;        /* text, solid buttons, plates, active marks. 19.80 white */
  --inkPressed:#333333; /* a solid button held */
  --onInk:#FFFFFF;
  --onInkMuted:#A3A3A3; /* secondary text on ink. 7.85 */
  --scrim:rgba(10,10,10,.36);
  --photoEdge:rgba(10,10,10,.07);
  --t1:#262626; --t2:#3D3D3D; --t3:#5C5C5C; --t4:#E3E3E3; /* avatar tones */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E6E6E6}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"kern"}
svg{display:block;overflow:visible}
.tab-nums,.tn{font-variant-numeric:tabular-nums}

/* ---------- the wall ---------- */
.wall{display:flex;gap:32px;padding:104px 40px 40px;align-items:flex-start;position:relative}
.wall h1{position:absolute;left:40px;top:30px;font:600 30px/36px Inter;letter-spacing:-.6px;color:var(--ink)}
.wall h1 small{font:400 15px/20px Inter;letter-spacing:0;color:var(--muted);margin-left:16px}
.legend{position:absolute;right:40px;top:40px;display:flex;gap:16px}
.legend span{display:flex;align-items:center;gap:6px;font:500 12px/16px Inter;color:var(--muted)}
.legend i{width:16px;height:16px;border-radius:2px;display:block;box-shadow:inset 0 0 0 1px rgba(10,10,10,.14)}
figure.cap{width:440px;flex:none}
figure.cap figcaption{font:400 14px/20px Inter;color:var(--muted);margin-top:16px;min-height:60px}
figure.cap figcaption b{font-weight:600;color:var(--ink);margin-right:6px}
body.solo{background:#fff}
body.solo .wall{padding:0;gap:0}
body.solo .wall h1, body.solo .legend, body.solo figcaption{display:none}
body.solo figure.cap{display:none}
body.solo figure.cap.on{display:block}
body.solo .screen{box-shadow:none}

.screen{position:relative;width:440px;height:956px;overflow:hidden;background:var(--white);isolation:isolate;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.abs{position:absolute}

/* ---------- system ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:62px;z-index:50;color:var(--ink)}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.sb .r{position:absolute;right:30px;top:24px;display:flex;gap:6px;align-items:center}
.hi{position:absolute;bottom:8px;left:153px;width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:60}

/* ---------- top bars: solid white, a 1pt rule once content runs under. No fade. ---------- */
.bar{position:absolute;left:0;right:0;top:62px;height:44px;z-index:30;background:var(--white)}
.bar.ruled{box-shadow:0 1px 0 var(--line)}
.bar .lt{position:absolute;left:16px;top:3px;font:600 30px/38px Inter;letter-spacing:-.8px}
.bar .lt.user{font:600 22px/28px Inter;letter-spacing:-.4px;top:8px}
.bar .wm{position:absolute;left:16px;top:2px;font:700 30px/38px Playfair;letter-spacing:-.2px}
.bar .ct{position:absolute;left:100px;right:100px;top:11px;text-align:center;font:600 17px/22px Inter;letter-spacing:-.2px}
.gb{position:absolute;top:0;width:44px;height:44px;display:grid;place-items:center}
.gb .dot{position:absolute;right:9px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--white)}

/* ---------- floating tab bar: white slab, 1pt edge, a lift (not a scrolling cell) ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:30px;height:64px;background:var(--white);border-radius:12px;z-index:40;
  box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(10,10,10,.06),0 8px 24px rgba(10,10,10,.08);display:flex;padding:0 6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:500 11px/14px Inter;position:relative}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::before{content:"";position:absolute;top:0;left:50%;width:24px;margin-left:-12px;height:2px;background:var(--ink)}
.tab .gbox{width:28px;height:28px;display:grid;place-items:center}
.tab.post .pbtn{width:52px;height:40px;border-radius:4px;background:var(--ink);display:grid;place-items:center}
.tab .av{width:24px;height:24px;border-radius:50%;background:var(--t1);color:#fff;font:600 10px/24px Inter;text-align:center}
.tab.on .av{box-shadow:0 0 0 1.5px var(--white),0 0 0 2.5px var(--ink)}

/* ---------- the catalogue number: a solid ink plate when caught, an empty one when not ---------- */
.plate{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:2px;background:var(--ink);color:var(--onInk);
  font:500 11px/14px Inter;letter-spacing:1.2px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.plate .no{letter-spacing:.2px;margin-right:3px}
.plate.lg{height:22px;padding:0 8px;font-size:12px;line-height:16px;letter-spacing:1.3px}
.plate.empty{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--control)}
.plate.media{box-shadow:0 0 0 1px rgba(255,255,255,.92)}

/* outline tag: "In your Dex" */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--ink);
  font:500 12px/16px Inter;color:var(--ink);white-space:nowrap;flex:none}
.tag.mini{height:18px;font-size:11px;line-height:14px;padding:0 6px 0 4px;gap:3px;box-shadow:inset 0 0 0 1px var(--control)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:4px;font:600 14px/18px Inter;white-space:nowrap}
.btn.ink{background:var(--ink);color:var(--onInk)}
.btn.out{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--control)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.field{height:44px;border-radius:4px;display:flex;align-items:center;gap:8px;padding:0 12px;font:400 16px/22px Inter;background:var(--wash);color:var(--muted)}
.chip{height:32px;padding:0 12px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;font:500 13px/18px Inter;white-space:nowrap;
  box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink);background:var(--white);flex:none}
.chip.on{background:var(--ink);color:var(--onInk);box-shadow:none}
.chip .c{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on .c{color:var(--onInkMuted)}

.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.av.t1{background:var(--t1)}.av.t2{background:var(--t2)}.av.t3{background:var(--t3)}.av.t4{background:var(--t4);color:var(--ink)}
.u{font:600 15px/20px Inter}
.mu{color:var(--muted)}
.kick{font:500 12px/16px Inter;letter-spacing:.6px;color:var(--muted)}

/* section head: the bar-spoon rule becomes a plain 1pt rule that runs out to the margin */
.sect{display:flex;align-items:center;gap:8px}
.sect h3{font:600 18px/24px Inter;letter-spacing:-.2px;white-space:nowrap}
.sect .n{font:600 18px/24px Inter;color:var(--muted);font-variant-numeric:tabular-nums}
.sect .rl{flex:1;height:1px;background:var(--line);margin-left:8px}

/* the index rule (was the walnut shelf + brass holder): the row's numbers, then a rule */
.idx{position:absolute;left:16px;right:16px;height:16px;display:flex;align-items:center;gap:10px;font:500 11px/14px Inter;letter-spacing:1px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.idx::after{content:"";flex:1;height:1px;background:var(--line)}

/* prints */
.print{position:absolute;overflow:hidden;background:var(--wash)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);pointer-events:none}
.nophoto{display:grid;place-items:center;background:var(--wash)}

/* drink names */
.pf{font-family:Playfair;font-weight:600}
.pfb{font-family:Playfair;font-weight:700}

/* keyboard (system; drawn for the + window) */
.kb{position:absolute;left:0;right:0;bottom:0;height:366px;background:#D4D5D8;z-index:45}
.kb .sug{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center}
.kb .sug span{flex:1;text-align:center;font:400 16px/20px Inter;color:var(--ink)}
.kb .sug i{width:1px;height:24px;background:#B4B6BA}
.kb .row{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:7px}
.kb .k{height:46px;width:37px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #8E9093;display:grid;place-items:center;font:400 22px/26px Inter;color:var(--ink)}
.kb .k.f{background:#ABAEB4;font-size:16px}
</style>
</head>
<body>

<div class="legend"><span><i style="background:#0A0A0A"></i>ink</span><span><i style="background:#5C5C5C"></i>muted</span><span><i style="background:#8A8A8A"></i>control</span><span><i style="background:#C4C4C4"></i>rule</span><span><i style="background:#E3E3E3"></i>line</span><span><i style="background:#F5F5F5"></i>wash</span><span><i style="background:#FFFFFF"></i>white</span></div>
<h1>Daylight <small>v4, white-led. Black ink on gallery white, a nine-step grey ramp, 1pt rules. The photographs are the only colour, and catching a drink is what turns its print to colour.</small></h1>

</div>
<figcaption><b>1 Home</b>A white bar with the wordmark set left. Stories ringed in black when unseen, grey when seen. The post hangs as a print with a wall label under it: name, number plate, "In your Dex". Liked by, with faces.</figcaption></figure>

<!-- 2 DEX                                                               -->

</div>
<figcaption><b>2 Dex</b>One catalogue in number order, each row headed by its numbers. A caught drink is a colour print with a solid plate and its name in Playfair; one not yet caught is a faded black-and-white proof with an empty plate.</figcaption></figure>

  <div class="abs" style="left:0;right:0;top:398px;bottom:0;z-index:36;background:var(--white);border-radius:12px 12px 0 0;box-shadow:0 -8px 30px rgba(10,10,10,.12);overflow:hidden">
    <div class="abs" style="left:202px;top:8px;width:36px;height:4px;border-radius:1px;background:var(--rule)"></div>

/* ---------------- the ruler: a 1pt baseline, a 3pt ink fill, ticks every 5%, a needle at you ---------------- */
hydrateIcons(document);
document.querySelectorAll('[data-ruler]').forEach(el=>{
  const [n,total,kind] = el.dataset.ruler.split(':'); const w = el.offsetWidth;
  const pct = +n / +total, base = 8;
  const fx = Math.max(3, (w-1) * pct);
  let ticks = '';
  for (let i = 0; i <= 20; i++) {
    const x = (w-1) * i/20 + .5; const major = i % 5 === 0;
    ticks += `<path d="M${x} ${base+1}V${base + (major?7:4)}" stroke="${major?'#8A8A8A':'#C4C4C4'}" stroke-width="1"/>`;
  }
  let marks = '';
  if (kind==='ladder') [.10,.25,.50,.75].forEach(p=>{ const x=(w-1)*p+.5; marks += `<path d="M${x-3.5} ${base-6}L${x+3.5} ${base-6}L${x} ${base-1.5}Z" fill="#0A0A0A"/>`; });
  const labels = kind==='ladder'
    ? [[.10,'209'],[.25,'523'],[.50,'1,045'],[.75,'1,567'],[1,'2,089']]
    : [[0,'0'],[.25,'500'],[.5,'1,000'],[.75,'1,500'],[1,'2,089']];
  const lab = labels.map(([p,t])=>{ const x=(w-1)*p+.5; const anchor = p===0?'start':p===1?'end':'middle';
    return `<text x="${x}" y="${base+21}" text-anchor="${anchor}" font-family="Inter" font-weight="500" font-size="11" fill="#5C5C5C" style="font-variant-numeric:tabular-nums">${t}</text>`; }).join('');
  el.innerHTML = `<svg width="${w}" height="${el.offsetHeight}">
    <path d="M0 ${base+.5}H${w}" stroke="#C4C4C4" stroke-width="1"/>
    <rect x="0" y="${base-2}" width="${fx}" height="3" fill="#0A0A0A"/>
    <path d="M${fx-.5} ${base-6}V${base+7}" stroke="#0A0A0A" stroke-width="1"/>
    ${ticks}${marks}${lab}</svg>`;
});
document.body.dataset.ready='1';

/* solo mode for per-screen renders: index.html#home etc. */
if (location.hash) {
  const id = location.hash.slice(1);
  document.body.classList.add('solo');
  const f = document.getElementById('f-' + id); if (f) f.classList.add('on');

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bar, two modes</title>
<style>
@font-face{font-family:Inter;src:url(../../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}

/* v4 "Daylight" in the layout's roles (layout/spec.md §3), as white-min applies them. No hue. */
:root{
  --page:#FFFFFF;      /* ground, bars */
  --wash:#F5F5F5;      /* the field, the key while there is nothing to make */
  --rule:#C4C4C4;      /* decorative only */
  --control:#8A8A8A;   /* an empty checkbox's edge, resting tab glyphs, the no-photo glass. UI 3:1 (3.45), never text */
  --muted:#5C5C5C;     /* quiet text: 6.69 on page, 6.13 on wash */
  --ink:#0A0A0A;       /* text, the key, a ticked box, the + : 19.80 on page */
  --onInk:#FFFFFF;     /* text on ink: 19.80 */
  --onInkMuted:#A3A3A3;/* the key's change figure: 7.85 on ink */
  --photoEdge:rgba(10,10,10,.07);
  --t3:#5C5C5C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E6E6E6}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}

/* three sizes, plus Playfair for drink names */
.title{font:600 28px/34px Inter;letter-spacing:-.4px}
.body{font:400 17px/24px Inter;letter-spacing:-.2px}
.small{font:400 13px/18px Inter}
.pf-body{font:700 17px/24px Playfair}
.muted{color:var(--muted)}
.b5{font-weight:500}.b6{font-weight:600}
.tn{font-variant-numeric:tabular-nums}

.a{position:absolute}
.phone{position:relative;width:440px;height:956px;background:var(--page);overflow:hidden;flex:none;isolation:isolate}
.row{position:absolute;display:flex;align-items:baseline;justify-content:space-between}
.field{position:absolute;height:44px;background:var(--wash);border-radius:4px;display:flex;align-items:center;padding:0 12px;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print{position:absolute;overflow:hidden;background:var(--wash)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);pointer-events:none}
.nophoto{display:flex;align-items:center;justify-content:center;background:var(--wash)}
.av{position:absolute;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}

/* the payoff key: full width, squared, the screen's one primary action */
.key{position:absolute;left:24px;width:392px;height:52px;border-radius:4px;display:flex;align-items:center;padding:0 12px 0 16px;gap:10px}
.key.on{background:var(--ink);color:var(--onInk)}
.key.off{background:var(--wash);color:var(--muted)}
.key .l{flex:1}

/* the two modes: text tabs, the chosen one in ink 600 on a 2pt ink bar */
.seg{position:absolute;left:24px;top:190px;width:392px;height:44px;display:flex}
.seg>div{flex:1;display:flex;justify-content:center;align-items:flex-end}
.seg span.t{display:block;padding:0 6px 8px;border-bottom:2px solid transparent}
.seg .on span.t{border-bottom-color:var(--ink);font-weight:600;color:var(--ink)}
.seg .off span.t{font-weight:500;color:var(--muted)}

/* checkbox: squared, 22pt. Empty = 1.5pt control edge (3.45:1); ticked = ink with a white check */
.box{position:absolute;width:22px;height:22px;border-radius:3px}
.box.off{box-shadow:inset 0 0 0 1.5px var(--control)}
.box.on{background:var(--ink);display:flex;align-items:center;justify-content:center}

.struck{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}

.sb{position:absolute;top:0;left:0;right:0;height:62px;color:var(--ink)}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.sb .r{position:absolute;right:30px;top:24px;display:flex;gap:6px;align-items:center}

.kb{position:absolute;left:0;right:0;background:#D4D5D8}
.kb .k{position:absolute;height:44px;border-radius:6px;background:#FFFFFF;box-shadow:0 1px 0 #8E9093;display:flex;align-items:center;justify-content:center;font:400 22px/1 Inter;color:var(--ink)}
.kb .k.f{background:#ABAEB4;font-size:16px}

.wall{display:flex;gap:36px;padding:112px 44px 40px;align-items:flex-start;position:relative}
.wall>h1{position:absolute;left:44px;top:34px;font:600 30px/36px Inter;letter-spacing:-.6px}
.wall>h1 small{font:400 15px/20px Inter;letter-spacing:0;color:var(--muted);margin-left:16px}
.frame{display:flex;flex-direction:column;gap:16px;width:440px;flex:none}
.frame .phone{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.cap{font:400 13px/19px Inter;color:#4A4A4A}
.cap .cnt{display:block;font:600 15px/22px Inter;color:var(--ink);margin-bottom:4px}
body.solo{background:var(--page)}
body.solo .wall{padding:0;display:block}
body.solo .wall>h1,body.solo .cap{display:none}
body.solo .frame{display:none}
body.solo .frame.on{display:block}
body.solo .frame .phone{box-shadow:none}
</style>
</head>
<body>
<div class="wall" id="wall">
  <h1>My Bar, two modes<small>"In my bar" is what you own, grouped by type. "Add" is search, then the same groups. "You can make N drinks" sits above both and changes on every tap. Daylight, 440 × 956.</small></h1>
</div>
<script>
/* ---------- icons: the Daylight hand (white-min), stroke 1.6 at 24 ---------- */
const OUT = {
  home:'<path d="M3.2 10.4 12 3.4l8.8 7"/><path d="M5.4 9.3V19.4a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6V9.3"/><path d="M9.6 21V14.9h4.8V21"/>',
  dex:'<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
  search:'<circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.5 15.5 20.4 20.4"/>',
  plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  chevronLeft:'<path d="M14.6 5.4 8 12l6.6 6.6"/>',
  chevronRight:'<path d="M9.4 5.4 16 12l-6.6 6.6"/>',
  close:'<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
  check:'<path d="M5.2 12.6l4.3 4.3 9.3-9.6"/>',
  rocks:'<path d="M6.2 7.2h11.6l-1.1 11.3a1.6 1.6 0 0 1-1.6 1.4H8.9a1.6 1.6 0 0 1-1.6-1.4z"/><path d="M6.8 12.4h10.4"/>',
};
const SOLID = {
  bottle:'<path fill-rule="evenodd" d="M9.5 2.3h5v4.9c0 .5 3.2 1.2 3.2 3.6v8.6a2.3 2.3 0 0 1-2.3 2.3H8.6a2.3 2.3 0 0 1-2.3-2.3v-8.6c0-2.4 3.2-3.1 3.2-3.6zM8.1 13.4v3.2h7.8v-3.2z"/>',
};
const ic = (name, size=24, color='var(--ink)', sw=1.6, solid=false) => {
  if (solid && SOLID[name]) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">${SOLID[name]}</svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${OUT[name]}</svg>`;
};
const at = (x, y, inner) => `<div class="a" style="left:${x}px;top:${y}px">${inner}</div>`;
const P = n => n === 'gin-rickey' ? `img/${n}.webp` : `../../white/img/${n}.webp`;
const print = (src, x, y, w, h, pos='50% 50%') => `<div class="print" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${src}" style="object-position:${pos}"></div>`;
const PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6z"/>';
const av = (x, y, d) => `<div class="av" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:var(--t3)"><svg width="${Math.round(d*.86)}" height="${Math.round(d*.86)}" viewBox="0 0 24 24" fill="#FFFFFF">${PERSON}</svg></div>`;

const status = () => `<div class="sb"><span class="t">9:41</span><span class="island"></span><span class="r">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="#0A0A0A"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="#0A0A0A"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3ZM8 9.3l1.9-1.7a2.9 2.9 0 0 0-3.8 0Z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0A0A0A" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#0A0A0A"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#0A0A0A" fill-opacity=".4"/></svg></span></div>`;
/* a pushed screen's bottom safe area: content scrolls under it, cut cleanly above the home indicator */
const safeFoot = () => `<div class="a" style="left:0;top:922px;width:440px;height:34px;background:var(--page)"></div>`;
const homeInd = () => `<div class="a" style="left:150px;top:942px;width:140px;height:5px;border-radius:3px;background:var(--ink)"></div>`;

/* tab bar (layout/spec.md §4): five glyphs, My Bar active (the solid bottle) */
function tabs(){
  const xs = [44,132,220,308,396], cy = 897;
  let h = `<div class="a" style="left:0;top:873px;width:440px;height:83px;background:var(--page)"></div>`;
  h += at(xs[0]-13, cy-13, ic('home',26,'var(--control)'));
  h += at(xs[1]-13, cy-13, ic('dex',26,'var(--control)'));
  h += `<div class="a" style="left:${xs[2]-26}px;top:${cy-19}px;width:52px;height:38px;border-radius:4px;background:var(--ink);display:flex;align-items:center;justify-content:center">${ic('plus',22,'#FFFFFF',2)}</div>`;
  h += at(xs[3]-13, cy-13, ic('bottle',26,'var(--ink)',1.6,true));
  h += av(xs[4]-13, cy-13, 26);
  return h + homeInd();
}

/* ---------- My Bar's own pieces ---------- */
const title = (t, quiet='') => `<div class="row" style="left:24px;top:71px;width:392px"><span class="title">${t}</span>${quiet?`<span class="small muted tn">${quiet}</span>`:''}</div>`;

/* the payoff key. n = drinks you can make; d = what the last tap changed ("+6", "−8"), shown until the next change */
function makeKey(top, n, d=''){
  if (!n) return `<div class="key off body b5" style="top:${top}px"><span class="l">Nothing to make yet</span></div>`;
  return `<div class="key on body b5" style="top:${top}px"><span class="l">You can make <span class="tn">${n}</span> drinks</span>${d?`<span class="body tn" style="color:var(--onInkMuted)">${d}</span>`:''}${ic('chevronRight',20,'#FFFFFF',1.8)}</div>`;
}
function modeTabs(sel, count){
  const have = `In my bar${count?` <span class="muted tn" style="font-weight:400">${count}</span>`:''}`;
  return `<div class="seg body"><div class="${sel==='have'?'on':'off'}"><span class="t">${have}</span></div><div class="${sel==='add'?'on':'off'}"><span class="t">Add</span></div></div>`;
}
const head = (y, t, right='') => `<div class="row" style="left:24px;top:${y}px;width:392px;align-items:center;height:24px"><span class="body b6">${t}</span>${right}</div>`;
const allLink = n => `<span class="body muted tn" style="display:flex;align-items:center;gap:2px">All ${n}${ic('chevronRight',16,'var(--muted)',1.8)}</span>`;

/* In my bar: two columns of names, each with its ×. A taken-out one stays put, struck, with Undo where the × was */
function haveGroup(y, name, items){
  let h = head(y, name);
  items.forEach(([n, out], i) => {
    const x = 24 + (i%2)*208, ry = y + 24 + Math.floor(i/2)*44;
    h += `<div class="a body ell ${out?'struck':''}" style="left:${x}px;top:${ry+10}px;width:144px">${n}</div>`;
    h += out ? `<div class="a body b5" style="left:${x+184-46}px;top:${ry+10}px;width:46px;text-align:right">Undo</div>`
             : at(x+184-16, ry+14, ic('close',16,'var(--muted)',1.7));
  });
  return h;
}
const HAVE = [
  ['Spirits', ['Gin','Rye whiskey','White rum']],
  ['Liqueurs & bitters', ['Angostura bitters','Campari']],
  ['Vermouth & wine', ['Dry vermouth','Sweet vermouth']],
  ['Fresh', ['Lemon','Lime','Mint']],
  ['Mixers & juice', ['Soda water']],
  ['Syrups & spices', ['Sugar syrup']],
];
function haveList(out=''){
  let h = '', y = 250;
  HAVE.forEach(([g, items]) => {
    h += haveGroup(y, g, items.map(n => [n, n===out]));
    y += 24 + Math.ceil(items.length/2)*44 + 24;
  });
  return h;
}

/* Add: one row per ingredient, the box at the right. +N = what ticking it pours now (live), only when it is more than 0 */
function addRow(y, name, {on=false, gain=0, line='', h=48}={}){
  let r = '';
  if (line) {
    r += `<div class="a body ell" style="left:24px;top:${y+8}px;width:300px">${name}</div>`;
    r += `<div class="a small muted ell" style="left:24px;top:${y+33}px;width:300px">${line}</div>`;
  } else {
    r += `<div class="a body ell" style="left:24px;top:${y+(h-24)/2}px;width:300px">${name}</div>`;
  }
  if (!on && gain) r += `<div class="a body muted tn" style="left:320px;top:${y+(h-24)/2}px;width:60px;text-align:right">+${gain}</div>`;
  r += on ? `<div class="box on" style="left:394px;top:${y+(h-22)/2}px">${ic('check',16,'#FFFFFF',2.2)}</div>`
          : `<div class="box off" style="left:394px;top:${y+(h-22)/2}px"></div>`;
  return r;
}
function addRows(y, rows){
  let h = '';
  rows.forEach(([n, o]) => { const hh = o && o.line ? 60 : 48; h += addRow(y, n, {...o, h:hh}); y += hh; });
  return [h, y];
}
const searchField = (top, w=392) => `<div class="field" style="left:24px;top:${top}px;width:${w}px">${ic('search',20,'var(--muted)')}<span class="body muted">Search a name or a brand</span></div>`;

function keyboard(top, sugg){
  let k = `<div class="kb" style="top:${top}px;height:${956-top}px">`;
  sugg.forEach((s,i)=>{
    k += `<div class="a body" style="left:${i*146.67}px;top:10px;width:146.67px;text-align:center">${s}</div>`;
    if (i) k += `<div class="a" style="left:${i*146.67}px;top:12px;width:1px;height:22px;background:#B4B6BA"></div>`;
  });
  const kw = 37.8, gap = 6;
  const key = (x,y,w,t,f=false,fs) => `<div class="k ${f?'f':''}" style="left:${x}px;top:${y}px;width:${w}px${fs?`;font-size:${fs}px`:''}">${t}</div>`;
  let y = 54;
  [...'qwertyuiop'].forEach((c,i)=> k += key(4+i*(kw+gap), y, kw, c));
  y += 56; [...'asdfghjkl'].forEach((c,i)=> k += key(4+(kw+gap)/2+i*(kw+gap), y, kw, c));
  y += 56; k += key(4, y, 50, '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"><path d="M12 4 4 12.5h4.5V20h7v-7.5H20z"/></svg>', true);
  [...'zxcvbnm'].forEach((c,i)=> k += key(4+50+12.5+i*(kw+gap), y, kw, c));
  k += key(386, y, 50, '<svg width="22" height="18" viewBox="0 0 26 20" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"><path d="M8 2h15a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 23 18H8l-6.5-8z"/><path d="M12 6.5l7 7M19 6.5l-7 7" stroke-linecap="round"/></svg>', true);
  y += 56; k += key(4, y, 96, '123', true, 16) + key(106, y, 228, 'space', false, 16) + key(340, y, 96, 'done', true, 16);
  k += `<div class="a" style="left:28px;top:${y+60}px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg></div>`;
  k += `<div class="a" style="left:386px;top:${y+60}px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>`;
  return k + `</div>`;
}

/* ================= 1 First run: nothing in your bar ================= */
function firstRun(){
  let h = status() + title('My Bar');
  h += makeKey(122, 0);
  h += modeTabs('add');
  h += searchField(250);
  h += head(318, 'The basics');
  h += `<div class="a small muted" style="left:24px;top:342px">Most bars start with these. Tick the ones you have.</div>`;
  const [r] = addRows(368, ['Gin','Vodka','White rum','Bourbon','Sweet vermouth','Dry vermouth','Triple sec','Angostura bitters','Lemon','Lime','Orange'].map(n=>[n,{}]));
  return h + r + tabs();
}

/* ================= 2 In my bar, at rest (12 things) ================= */
function stocked(){
  let h = status() + title('My Bar');
  h += makeKey(122, 31);
  h += modeTabs('have', 12);
  h += haveList();
  return h + tabs();
}

/* ================= 3 Add, at rest ================= */
function addRest(){
  let h = status() + title('My Bar');
  h += makeKey(122, 31);
  h += modeTabs('add');
  h += searchField(250);
  h += head(318, 'Best next');
  let [r, y] = addRows(342, [
    ['Bourbon', {gain:7, line:'Mint Julep, Boulevardier and 5 more'}],
    ['Orange',  {gain:6, line:'Garibaldi, Negroni and 4 more'}],
  ]);
  h += r; y += 24;
  h += head(y, 'Spirits', allLink(44)); y += 24;
  [r, y] = addRows(y, [['Gin',{on:true}],['White rum',{on:true}],['Vodka',{gain:4}],['Rye whiskey',{on:true}]]);
  h += r; y += 24;
  h += head(y, 'Liqueurs & bitters', allLink(41)); y += 24;
  [r, y] = addRows(y, [['Angostura bitters',{on:true}],['Maraschino liqueur',{gain:4}],['Triple sec',{gain:4}],['Orange bitters',{gain:3}]]);
  h += r;
  return h + tabs();
}

/* ================= 4 Add, searching (keyboard up, Orange just ticked) ================= */
function search(){
  let h = status() + title('My Bar');
  h += makeKey(122, 37, '+6');
  h += modeTabs('add');
  h += `<div class="field" style="left:24px;top:250px;width:316px">${ic('search',20,'var(--muted)')}<span class="body" style="flex:1">orange<span style="display:inline-block;width:2px;height:21px;background:var(--ink);vertical-align:-4px;margin-left:1px"></span></span>${ic('close',18,'var(--muted)',1.8)}</div>`;
  h += `<div class="a body" style="left:340px;top:260px;width:76px;text-align:right">Cancel</div>`;
  const [r] = addRows(302, [
    ['Orange', {on:true}],
    ['Triple sec', {gain:5, line:'Orange liqueur, like Cointreau'}],
    ['Orange bitters', {gain:3}],
    ['Orange curaçao', {gain:4}],
    ['Grand Marnier', {gain:2, line:'Orange liqueur'}],
    ['Orange flower water', {}],
  ]);
  h += r;
  h += keyboard(610, ['“orange”','oranges','orangey']);
  return h + homeInd();
}

/* ================= 5 In my bar, just after taking Lime out ================= */
function removed(){
  let h = status() + title('My Bar');
  h += makeKey(122, 23, '−8');
  h += modeTabs('have', 11);
  h += haveList('Lime');
  return h + tabs();
}

/* ================= 6 You can make (pushed) ================= */
function make(){
  let h = status();
  h += at(20, 76, ic('chevronLeft',24,'var(--ink)',1.8));
  h += `<div class="row" style="left:24px;top:122px;width:392px"><span class="title">You can make</span><span class="small muted tn">31 drinks</span></div>`;
  h += head(180, 'Gin');
  const L = [
    ['gin-fizz','Gin Fizz','Gin, Lemon, Soda water'],
    ['gin-rickey','Gin Rickey','Gin, Lime, Soda water'],
    ['tom-collins','Tom Collins','Gin, Lemon, Sugar syrup, Soda water'],
    ['martini','Martini','Gin, Dry vermouth, Lemon'],
    [null,'Clarito','Gin, Dry vermouth, Lemon'],
    [null,'Southside','Gin, Lime, Sugar syrup, Mint'],
    [null,'Fitzgerald','Gin, Lemon, Sugar syrup, Angostura bitters'],
    [null,'Bronx Terrace','Gin, Dry vermouth, Lime'],
    [null,'Gin Fix','Gin, Lemon'],
    [null,'Gin Sour','Gin, Lemon, Sugar syrup'],
    [null,'Cardinale','Gin, Campari, Dry vermouth'],
  ];
  L.forEach(([img,n,line],i)=>{
    const y = 212 + i*68;
    h += img ? print(P(img), 24, y+8, 52, 52) : `<div class="a nophoto" style="left:24px;top:${y+8}px;width:52px;height:52px">${ic('rocks',24,'var(--control)',1.4)}</div>`;
    h += `<div class="a pf-body ell" style="left:92px;top:${y+11}px;width:324px">${n}</div>`;
    h += `<div class="a small muted ell" style="left:92px;top:${y+37}px;width:324px">${line}</div>`;
  });
  return h + safeFoot() + homeInd();
}

/* ================= 7 Spirits, all of them (pushed from "All 44") ================= */
function spirits(){
  let h = status();
  h += at(20, 76, ic('chevronLeft',24,'var(--ink)',1.8));
  h += `<div class="row" style="left:24px;top:122px;width:392px"><span class="title">Spirits</span><span class="small muted tn">3 in your bar</span></div>`;
  h += makeKey(172, 31);
  h += `<div class="a small muted" style="left:24px;top:240px;width:392px">Any kind counts for a recipe that only says brandy or gin.</div>`;
  h += head(282, 'Brandy');
  let [r, y] = addRows(306, [['Brandy',{gain:5}],['Cognac',{gain:7}],['Apricot brandy',{gain:6}],['Calvados',{gain:6}],['Applejack',{gain:10}],['Pisco',{gain:6}],['Peach brandy',{gain:5}],['Armagnac',{gain:5}]]);
  h += r; y += 24;
  h += head(y, 'Gin'); y += 24;
  [r, y] = addRows(y, [['Gin',{on:true}],['Old tom gin',{}],['London dry gin',{}],['Navy strength gin',{}]]);
  h += r;
  return h + safeFoot() + homeInd();
}

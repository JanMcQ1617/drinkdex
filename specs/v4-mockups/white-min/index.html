<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylight, less stuff</title>
<style>
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../../assets/fonts/InterLatin_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Playfair;src:url(../../../assets/fonts/PlayfairDisplayLatin_700Bold.ttf);font-weight:700}

/* v4 "Daylight" values dropped into the layout's five roles (layout/spec.md §3),
   plus the Daylight extras this layout still uses. No hue anywhere. */
:root{
  --page:#FFFFFF;     /* ground, bars, the sheet */
  --wash:#F5F5F5;     /* fields, unticked tiles, the secondary key, a print before it decodes */
  --rule:#C4C4C4;     /* seen story ring, sheet grabber. Decorative */
  --control:#8A8A8A;  /* resting tab glyphs, the no-photo glass. UI 3:1 (3.45 page, 3.17 wash), never text */
  --muted:#5C5C5C;    /* quiet text: 6.69 on page, 6.13 on wash */
  --ink:#0A0A0A;      /* text, ticked tiles, the primary key, the +, active glyphs: 19.80 page, 18.16 wash */
  --onInk:#FFFFFF;    /* text on ink: 19.80 */
  --scrim:rgba(10,10,10,.36);
  --photoEdge:rgba(10,10,10,.07);
  --t1:#262626; --t2:#3D3D3D; --t3:#5C5C5C; --t4:#E3E3E3; /* avatar tones */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E6E6E6}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}

/* three sizes, plus Playfair for drink names */
.title{font:600 28px/34px Inter;letter-spacing:-.4px}
.body{font:400 17px/24px Inter;letter-spacing:-.2px}
.small{font:400 13px/18px Inter}
.pf-title{font:700 28px/34px Playfair;letter-spacing:-.2px}
.pf-body{font:700 17px/24px Playfair}
.muted{color:var(--muted)}
.b5{font-weight:500}.b6{font-weight:600}
.tn{font-variant-numeric:tabular-nums}

.a{position:absolute}
.phone{position:relative;width:440px;height:956px;background:var(--page);overflow:hidden;flex:none;isolation:isolate}
.row{position:absolute;display:flex;align-items:baseline;justify-content:space-between}
.field{position:absolute;height:44px;background:var(--wash);border-radius:4px;display:flex;align-items:center;padding:0 12px;gap:10px}
.key{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.circle{border-radius:50%}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Daylight prints: square corners, a 1pt photoEdge so a pale wall still has an edge on white */
.print{position:absolute;overflow:hidden;background:var(--wash)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.print::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--photoEdge);pointer-events:none}
.nophoto{display:flex;align-items:center;justify-content:center}

/* Daylight avatar discs: grey tones, initials set in one of the three sizes */
.av{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;overflow:hidden}

/* status bar (system) */
.sb{position:absolute;top:0;left:0;right:0;height:62px;color:var(--ink)}
.sb .t{position:absolute;left:52px;top:21px;font:600 17px/22px Inter;letter-spacing:-.2px}
.sb .island{position:absolute;left:157px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.sb .r{position:absolute;right:30px;top:24px;display:flex;gap:6px;align-items:center}

/* system keyboard, drawn for the + window */
.kb{position:absolute;left:0;right:0;background:#D4D5D8}
.kb .k{position:absolute;height:44px;border-radius:6px;background:#FFFFFF;box-shadow:0 1px 0 #8E9093;display:flex;align-items:center;justify-content:center;font:400 22px/1 Inter;color:var(--ink)}
.kb .k.f{background:#ABAEB4;font-size:16px}

/* the wall */
.wall{display:flex;gap:36px;padding:112px 44px 40px;align-items:flex-start;position:relative}
.wall>h1{position:absolute;left:44px;top:34px;font:600 30px/36px Inter;letter-spacing:-.6px}
.wall>h1 small{font:400 15px/20px Inter;letter-spacing:0;color:var(--muted);margin-left:16px}
.frame{display:flex;flex-direction:column;gap:16px;width:440px;flex:none}
.frame .phone{box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.08)}
.cap{font:400 13px/19px Inter;color:#4A4A4A}
.cap .cnt{display:block;font:600 15px/22px Inter;color:var(--ink);margin-bottom:4px}
body.solo{background:var(--page)}
body.solo .wall{padding:0;display:block}
body.solo .wall>h1,body.solo .cap{display:none}
body.solo .frame{display:none}
body.solo .frame.on{display:block}
body.solo .frame .phone{box-shadow:none}
</style>
</head>
<body>
<div class="wall" id="wall">
  <h1>Daylight, less stuff<small>The v4 layout (layout/spec.md) in the Daylight palette. 440 × 956. Ink #0A0A0A, muted #5C5C5C, wash #F5F5F5 on white. The drink photographs are the only colour; a drink not yet caught is a grey proof, in the Dex only.</small></h1>
</div>
<script>
/* ---------- icons: Daylight paths (src/components/icons.tsx), stroke 1.6 at 24 ---------- */
const OUT = {
  home:'<path d="M3.2 10.4 12 3.4l8.8 7"/><path d="M5.4 9.3V19.4a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6V9.3"/><path d="M9.6 21V14.9h4.8V21"/>',
  dex:'<path d="M3.9 5.4h16.2l-8.1 8.3z"/><path d="M12 13.7v5.5"/><path d="M8.3 19.6h7.4"/>',
  bottle:'<path d="M10.4 3.2v4c0 1.4-3.2 1.8-3.2 3.6v8.6a1.4 1.4 0 0 0 1.4 1.4h6.8a1.4 1.4 0 0 0 1.4-1.4v-8.6c0-1.8-3.2-2.2-3.2-3.6v-4z"/><path d="M10.4 5.4h3.2"/><path d="M7.2 12.8h9.6"/><path d="M7.2 17h9.6"/>',
  search:'<circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.5 15.5 20.4 20.4"/>',
  heart:'<path d="M12 20.3 4.9 13.4a4.3 4.3 0 0 1 0-6.2 4.5 4.5 0 0 1 6.3 0l.8.8.8-.8a4.5 4.5 0 0 1 6.3 0 4.3 4.3 0 0 1 0 6.2z"/>',
  plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  bookmark:'<path d="M6.4 4.6h11.2v15.8L12 16.3l-5.6 4.1z"/>',
  chevronLeft:'<path d="M14.6 5.4 8 12l6.6 6.6"/>',
  chevronRight:'<path d="M9.4 5.4 16 12l-6.6 6.6"/>',
  close:'<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
  rocks:'<path d="M6.2 7.2h11.6l-1.1 11.3a1.6 1.6 0 0 1-1.6 1.4H8.9a1.6 1.6 0 0 1-1.6-1.4z"/><path d="M6.8 12.4h10.4"/>',
  /* new for this layout, drawn in the same hand */
  bell:'<path d="M6.3 16.6V11a5.7 5.7 0 0 1 11.4 0v5.6l1.7 2.2H4.6z"/><path d="M10 21a2.3 2.3 0 0 0 4 0"/>',
  sliders:'<path d="M4 7.5h9.2"/><path d="M17.8 7.5H20"/><path d="M4 16.5h2.7"/><path d="M11.3 16.5H20"/><circle cx="15.5" cy="7.5" r="2.3"/><circle cx="9" cy="16.5" r="2.3"/>',
  arrow:'<path d="M4.5 12h14.5"/><path d="M13.5 6.5 19 12l-5.5 5.5"/>',
};
const SOLID = {
  home:'<path fill-rule="evenodd" d="M12 2.7a1.4 1.4 0 0 1 .9.3l8.3 6.6a1.4 1.4 0 0 1 .5 1.1v8.7a2.2 2.2 0 0 1-2.2 2.2h-4.6v-5.7a1 1 0 0 0-1-1h-3.8a1 1 0 0 0-1 1v5.7H4.5a2.2 2.2 0 0 1-2.2-2.2v-8.7a1.4 1.4 0 0 1 .5-1.1l8.3-6.6a1.4 1.4 0 0 1 .9-.3z"/>',
  dex:'<path d="M3.5 5.1a.5.5 0 0 0-.36.85l8.5 8.7a.5.5 0 0 0 .72 0l8.5-8.7a.5.5 0 0 0-.36-.85z"/><path d="M11.1 14.6h1.8v4.3h2.8a.9.9 0 0 1 0 1.8H8.3a.9.9 0 0 1 0-1.8h2.8z"/>',
  heart:'<path d="M12 20.9a1 1 0 0 1-.68-.27l-6.9-6.7a5.1 5.1 0 0 1 0-7.4 5.4 5.4 0 0 1 7.58 0 5.4 5.4 0 0 1 7.58 0 5.1 5.1 0 0 1 0 7.4l-6.9 6.7a1 1 0 0 1-.68.27z"/>',
  bottle:'<path fill-rule="evenodd" d="M9.5 2.3h5v4.9c0 .5 3.2 1.2 3.2 3.6v8.6a2.3 2.3 0 0 1-2.3 2.3H8.6a2.3 2.3 0 0 1-2.3-2.3v-8.6c0-2.4 3.2-3.1 3.2-3.6zM8.1 13.4v3.2h7.8v-3.2z"/>',
};
const ic = (name, size=24, color='var(--ink)', sw=1.6, solid=false) => {
  if (name === 'more') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><circle cx="5.4" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.6" cy="12" r="1.6"/></svg>`;
  if (solid && SOLID[name]) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">${SOLID[name]}</svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${OUT[name]}</svg>`;
};
const at = (x, y, inner) => `<div class="a" style="left:${x}px;top:${y}px">${inner}</div>`;

const P  = n => `../white/img/${n}.webp`;     /* daylight prints */
const BW = n => `../white/img/bw/${n}.webp`;  /* baked "not yet" proofs */
const print = (src, x, y, w, h, pos='50% 50%') => `<div class="print" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${src}" style="object-position:${pos}"></div>`;

/* avatars: a Daylight tone (avatarTone) with a white silhouette standing in for the person's photo.
   No initials, so no capital letters and no fourth type size. */
const TONE = {t1:'var(--t1)',t2:'var(--t2)',t3:'var(--t3)'};
const PERSON = '<circle cx="12" cy="9" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6z"/>';
const av = (x, y, d, tone) => {
  const s = Math.round(d*.86);
  return `<div class="av" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:${TONE[tone]};align-items:flex-end"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="#FFFFFF">${PERSON}</svg></div>`;
};
const ME = ['t3'];

/* status bar and home indicator: system, not counted */
const status = () => `<div class="sb"><span class="t">9:41</span><span class="island"></span><span class="r">
  <svg width="18" height="12" viewBox="0 0 18 12" fill="#0A0A0A"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12" fill="#0A0A0A"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3ZM8 9.3l1.9-1.7a2.9 2.9 0 0 0-3.8 0Z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0A0A0A" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#0A0A0A"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="#0A0A0A" fill-opacity=".4"/></svg></span></div>`;
const homeInd = () => `<div class="a" style="left:150px;top:942px;width:140px;height:5px;border-radius:3px;background:var(--ink)"></div>`;

/* tab bar: five glyphs, no labels. Resting = outline in control, active = the solid glyph in ink.
   The + is the only filled key. Opaque page ground, no rule, no shadow, no floating card. */
function tabs(active){
  const xs = [44,132,220,308,396], cy = 897;
  let h = `<div class="a" style="left:0;top:873px;width:440px;height:83px;background:var(--page)"></div>`;
  [['home','home'],['dex','dex'],['plus'],['bar','bottle'],['profile']].forEach(([k,g],i)=>{
    const x = xs[i];
    if (k==='plus') { h += `<div class="key" style="left:${x-26}px;top:${cy-19}px;width:52px;height:38px;background:var(--ink)">${ic('plus',22,'#FFFFFF',2)}</div>`; return; }
    if (k==='profile') {
      h += av(x-13, cy-13, 26, ME[0]);
      if (active==='profile') h += `<div class="a circle" style="left:${x-16.5}px;top:${cy-16.5}px;width:33px;height:33px;box-shadow:inset 0 0 0 1.5px var(--ink)"></div>`;
      return;
    }
    const on = active===k;
    h += at(x-13, cy-13, ic(g, 26, on?'var(--ink)':'var(--control)', 1.6, on));
  });
  return h + homeInd();
}
/* tab-root top bar: title (or wordmark) left at x 24, one icon right-aligned to 416. Title box y 71–105 */
const topbar = (left, right='') => `<div class="row" style="left:24px;top:71px;width:392px;height:34px;align-items:center">${left}${right}</div>`;

/* ================= 1 Home ================= */
function home(){
  let h = status();
  h += topbar(`<span class="pf-title">Sipply</span>`, ic('bell',26));
  const st = [['You',null,'own'],['maya.pours','aperol-spritz','unseen'],['theo_stirs','paper-plane','unseen'],['ines.ag','negroni','unseen'],['dmitri.k','martini','seen'],['ana.lucia','margarita','seen']];
  st.forEach(([n,img,s],i)=>{
    const x = 24 + i*78, y = 122;
    const ring = s==='unseen' ? 'box-shadow:0 0 0 2px var(--ink)' : 'box-shadow:0 0 0 1px var(--rule)';
    h += `<div class="a circle" style="left:${x+1}px;top:${y+1}px;width:60px;height:60px;${ring}"></div>`;
    h += img ? `<img class="a circle" src="${P(img)}" style="left:${x+4}px;top:${y+4}px;width:54px;height:54px;object-fit:cover;object-position:50% 55%">`
             : av(x+4, y+4, 54, ME[0]);
    h += `<div class="a small ell" style="left:${x-8}px;top:192px;width:78px;text-align:center;color:${s==='seen'?'var(--muted)':'var(--ink)'}">${n}</div>`;
  });
  h += print(P('negroni'), 24, 232, 392, 490, '50% 58%');
  h += `<div class="row" style="left:24px;top:738px;width:392px"><span class="pf-title">Negroni</span><span class="small muted">ines.ag</span></div>`;
  h += at(22, 786, ic('heart',28)) + `<div class="a body tn" style="left:58px;top:788px">24</div>`;
  h += at(348, 788, ic('bookmark',24)) + at(392, 788, ic('more',24));
  h += print(P('paper-plane'), 24, 848, 392, 490);
  return h + tabs('home');
}

/* ================= 2 Dex ================= */
function dex(){
  let h = status();
  h += `<div class="row" style="left:24px;top:71px;width:392px"><span class="title">Dex</span><span class="small muted tn">38 / 2,089</span></div>`;
  h += `<div class="field" style="left:24px;top:122px;width:392px;padding-right:8px">${ic('search',20,'var(--muted)')}<span class="body muted" style="flex:1">Search a name or number</span>${ic('sliders',22)}</div>`;
  /* caught = colour print + ink name, not yet = the baked proof (../white/img/bw) + muted name.
     Same eight drinks as the layout wireframe; row 3 sits under the tab bar at rest. */
  const d = [['caesar','Caesar',1],['greyhound','Greyhound',0],['brandy-alexander','Brandy Alexander',1],['espresso-martini','Espresso Martini',1],
             ['grasshopper','Grasshopper',0],['porto-flip','Porto Flip',0],['americano','Americano',0],['aviation','Aviation',1]];
  d.forEach(([img,n,c],i)=>{
    const x = 24 + (i%2)*208, y = 190 + Math.floor(i/2)*246;
    h += print(c?P(img):BW(img), x, y, 184, 184);
    h += `<div class="a pf-body ell ${c?'':'muted'}" style="left:${x}px;top:${y+192}px;width:184px">${n}</div>`;
  });
  return h + tabs('dex');
}

/* ================= 3 My Bar ================= */
function bar(){
  let h = status();
  h += `<div class="row" style="left:24px;top:71px;width:392px"><span class="title">My Bar</span><span class="small muted tn">12 in your bar</span></div>`;
  h += `<div class="row" style="left:24px;top:122px;width:392px;height:48px;align-items:center"><span class="body b6">You can make 30</span>${ic('chevronRight',22,'var(--ink)',1.8)}</div>`;
  h += `<div class="a body" style="left:24px;top:174px;display:flex;align-items:center;gap:6px"><span class="b5">Add orange</span>${ic('arrow',16,'var(--muted)',1.6)}<span class="muted">5 more drinks</span></div>`;
  h += `<div class="field" style="left:24px;top:230px;width:392px">${ic('search',20,'var(--muted)')}<span class="body muted">Search ingredients</span></div>`;
  const t = [['Gin',1],['Lemon',1],['Lime',1],['Sweet vermouth',1],['Campari',1],['Angostura bitters',1],['Soda water',1],['Simple syrup',1],['Rye whiskey',1],['White rum',1],['Mint',1],['Sugar',1],
             ['Orange',0],['Cointreau',0],['Dry vermouth',0],['Tequila',0],['Egg white',0],['Bourbon',0]];
  t.forEach(([n,on],i)=>{
    const x = 24 + (i%2)*202, y = 298 + Math.floor(i/2)*64;
    h += `<div class="key body" style="left:${x}px;top:${y}px;width:190px;height:52px;justify-content:flex-start;padding:0 16px;background:${on?'var(--ink)':'var(--wash)'};color:${on?'var(--onInk)':'var(--ink)'}">${n}</div>`;
  });
  return h + tabs('bar');
}

/* ================= 4 Post detail (+ likers sheet) ================= */
function postBody(){
  let h = status();
  h += at(20, 76, ic('chevronLeft',24,'var(--ink)',1.8));
  h += av(24, 122, 32, 't2');
  h += `<div class="row" style="left:68px;top:126px;width:348px;align-items:center"><span class="body b6">theo_stirs</span>${ic('more',24)}</div>`;
  h += print(P('paper-plane'), 24, 170, 392, 490);
  h += `<div class="a pf-title" style="left:24px;top:684px">Paper Plane</div>`;
  h += `<div class="a body" style="left:24px;top:726px;width:392px">Equal parts, hard shake, and the bourbon still shows up. Best one this week.</div>`;
  /* you are in this post's likers, so the heart is the solid one: the fill carries the state */
  h += at(22, 790, ic('heart',28,'var(--ink)',1.6,true)) + `<div class="a body tn" style="left:58px;top:792px">24</div>`;
  return h;
}
function postRest(){ return postBody() + homeInd(); }
function post(){
  let h = postBody();
  h += `<div class="a" style="left:0;top:0;width:440px;height:956px;background:var(--scrim)"></div>`;
  h += `<div class="a" style="left:0;top:436px;width:440px;height:520px;background:var(--page);border-radius:12px 12px 0 0"></div>`;
  h += `<div class="a" style="left:202px;top:444px;width:36px;height:4px;border-radius:1px;background:var(--rule)"></div>`;
  h += `<div class="a body b6" style="left:24px;top:468px">Liked by</div>`;
  const L = [['Maya Ortiz','Following','t3'],['Nico Vargas','',ME[0]],['Dmitri Kovač','Follow','t2'],['Ana Lucía Rivera','Following','t1'],['Sam Ortega','Follow','t3'],['Ines Aguilar','Following','t2']];
  L.forEach(([n,k,tone],i)=>{
    const y = 516 + i*64;
    h += av(24, y+4, 44, tone);
    h += `<div class="a body ell" style="left:84px;top:${y+14}px;width:200px">${n}${k?'':' <span class="muted">(you)</span>'}</div>`;
    if (k) h += `<div class="key body b5" style="left:300px;top:${y+8}px;width:116px;height:36px;${k==='Follow'?'background:var(--ink);color:var(--onInk)':'background:var(--wash);color:var(--ink)'}">${k}</div>`;
  });
  return h + homeInd();
}

/* ================= 5 Profile ================= */
function profile(){
  let h = status();
  h += topbar(`<span class="title">nico.pours</span>`, ic('more',26));
  h += av(24, 130, 80, ME[0]);
  h += `<div class="a body b6" style="left:124px;top:146px">Nico Vargas</div>`;
  h += `<div class="a small muted ell" style="left:124px;top:174px;width:292px">Stirred, not shaken. One coupe at a time.</div>`;
  h += `<div class="a body tn" style="left:24px;top:234px;display:flex;gap:28px">
          <span><span class="b6">64</span> <span class="muted">posts</span></span>
          <span><span class="b6">212</span> <span class="muted">followers</span></span>
          <span><span class="b6">180</span> <span class="muted">following</span></span></div>`;
  h += `<div class="key body b5" style="left:24px;top:282px;width:392px;height:44px;background:var(--wash)">Edit profile</div>`;
  h += `<div class="row" style="left:24px;top:344px;width:392px;height:18px;align-items:center"><span class="small muted">38 drinks in your Dex</span>${ic('chevronRight',16,'var(--muted)',2)}</div>`;
  const g = ['negroni','paper-plane','aviation','old-fashioned','clover-club','martini','last-word','margarita','sidecar','penicillin','tom-collins','daiquiri'];
  g.forEach((img,i)=>{
    const w = (392 - 16) / 3;
    h += print(P(img), 24 + (i%3)*(w+8), 386 + Math.floor(i/3)*(w+8), w, w, '50% 55%');
  });
  return h + tabs('profile');
}

/* ================= 6 + window ================= */
function keyboard(top){
  let k = `<div class="kb" style="top:${top}px;height:${956-top}px">`;
  ['“neg”','Negroni','negative'].forEach((s,i)=>{
    k += `<div class="a body" style="left:${i*146.67}px;top:10px;width:146.67px;text-align:center">${s}</div>`;
    if (i) k += `<div class="a" style="left:${i*146.67}px;top:12px;width:1px;height:22px;background:#B4B6BA"></div>`;
  });
  const kw = 37.8, gap = 6;
  const key = (x,y,w,t,f=false,fs) => `<div class="k ${f?'f':''}" style="left:${x}px;top:${y}px;width:${w}px${fs?`;font-size:${fs}px`:''}">${t}</div>`;
  let y = 54;
  [...'qwertyuiop'].forEach((c,i)=> k += key(4+i*(kw+gap), y, kw, c));
  y += 56; [...'asdfghjkl'].forEach((c,i)=> k += key(4+(kw+gap)/2+i*(kw+gap), y, kw, c));
  y += 56; k += key(4, y, 50, '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"><path d="M12 4 4 12.5h4.5V20h7v-7.5H20z"/></svg>', true);
  [...'zxcvbnm'].forEach((c,i)=> k += key(4+50+12.5+i*(kw+gap), y, kw, c));
  k += key(386, y, 50, '<svg width="22" height="18" viewBox="0 0 26 20" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round"><path d="M8 2h15a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 23 18H8l-6.5-8z"/><path d="M12 6.5l7 7M19 6.5l-7 7" stroke-linecap="round"/></svg>', true);
  y += 56; k += key(4, y, 96, '123', true, 16) + key(106, y, 228, 'space', false, 16) + key(340, y, 96, 'return', true, 16);
  k += `<div class="a" style="left:28px;top:${y+60}px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg></div>`;
  k += `<div class="a" style="left:386px;top:${y+60}px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>`;
  return k + `</div>`;
}
function plus(){
  let h = status();
  h += at(22, 76, ic('close',24,'var(--ink)',1.9));
  h += `<div class="field" style="left:64px;top:66px;width:352px">${ic('search',20,'var(--muted)')}<span class="body" style="flex:1">neg<span style="display:inline-block;width:2px;height:21px;background:var(--ink);vertical-align:-4px;margin-left:1px"></span></span>${ic('close',18,'var(--muted)',1.8)}</div>`;
  const r = [['negroni','Negroni'],['negroni-sbagliato','Negroni Sbagliato'],['white-negroni','White Negroni'],[null,'Kingston Negroni'],[null,'Mezcal Negroni'],[null,'Cynar Negroni']];
  r.forEach(([img,n],i)=>{
    const y = 130 + i*68;
    h += img ? print(P(img), 24, y+8, 52, 52)
             : `<div class="a nophoto" style="left:24px;top:${y+8}px;width:52px;height:52px;background:var(--wash)">${ic('rocks',24,'var(--control)',1.4)}</div>`;
    h += `<div class="a pf-body" style="left:92px;top:${y+22}px">${n}</div>`;
  });
  h += keyboard(610);
  return h + homeInd();
}
/* after picking (layout/spec.md §5.6, "not drawn; same budget"): photo, one caption field, Post */
function plusCompose(){
  let h = status();
  h += at(20, 76, ic('chevronLeft',24,'var(--ink)',1.8));
  h += `<div class="a pf-body" style="left:80px;top:76px;width:280px;text-align:center">Negroni</div>`;
  h += print(P('negroni'), 24, 122, 392, 490, '50% 58%');
  h += `<div class="a" style="left:24px;top:636px;width:392px;height:88px;background:var(--wash);border-radius:4px;padding:12px 16px"><span class="body muted">Say something about it</span></div>`;
  h += `<div class="key body b5" style="left:24px;top:860px;width:392px;height:52px;background:var(--ink);color:var(--onInk)">Post</div>`;
  return h + homeInd();
}

/* ---------- the wall: before = the clumped Daylight board (../white/contact.png) ---------- */
const screens = [
  ['home', home, '1 Home', '44 → 27', 'Wordmark and one icon (activity). A small stories row, then posts: the print, one line (Playfair name, author quiet on the right), one action row (heart + count, save, •••). The post block went 17 → 7.'],

  ['post-rest', postRest, '4 Post detail, at rest', '9 visible elements (new frame: the clumped board only had the sheet open)', 'Back, author + •••, the print, the drink name, the whole caption, heart + count. The heart is solid because you liked it. Comment, share, save and the drink page are in •••.'],

const wall = document.getElementById('wall');
screens.forEach(([id,fn,name,cnt,txt])=>{

const hash = location.hash.slice(1);
if (hash) { document.body.classList.add('solo'); const f = document.getElementById('f-'+hash); if (f) f.classList.add('on'); }
